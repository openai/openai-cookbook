name: AUMARA Beds24 guest-note safety

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - '.github/workflows/aumara-beds24-note-audit.yml'
      - 'aumara-control-tower/scripts/beds24_guest_note_sync.py'
      - 'aumara-control-tower/scripts/beds24_cot_note_sync.py'
      - 'aumara-control-tower/scripts/guest_request_dry_run.py'
      - 'aumara-control-tower/policies/elcid.yaml'
      - 'aumara-control-tower/tests/test_beds24_guest_note_sync.py'
      - 'aumara-control-tower/tests/test_beds24_cot_note_sync.py'
      - 'aumara-control-tower/tests/test_guest_request_dry_run.py'
      - 'aumara-control-tower/tests/test_policy_registry_schema.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aumara-beds24-note-audit.yml'
      - 'aumara-control-tower/scripts/beds24_guest_note_sync.py'
      - 'aumara-control-tower/scripts/beds24_cot_note_sync.py'
      - 'aumara-control-tower/scripts/guest_request_dry_run.py'
      - 'aumara-control-tower/policies/elcid.yaml'
      - 'aumara-control-tower/tests/test_beds24_guest_note_sync.py'
      - 'aumara-control-tower/tests/test_beds24_cot_note_sync.py'
      - 'aumara-control-tower/tests/test_guest_request_dry_run.py'
      - 'aumara-control-tower/tests/test_policy_registry_schema.py'

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 16 &&
      github.event.comment.body == '/execute-beds24-cot-note' &&
      'aumara-beds24-cot-note-live-write' ||
      'aumara-beds24-note-audit'
    }}
  cancel-in-progress: >-
    ${{
      !(
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 16 &&
        github.event.comment.body == '/execute-beds24-cot-note'
      )
    }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test note planner without credentials or network
        run: |
          python -m unittest \
            aumara-control-tower/tests/test_beds24_guest_note_sync.py \
            aumara-control-tower/tests/test_beds24_cot_note_sync.py \
            aumara-control-tower/tests/test_guest_request_dry_run.py \
            aumara-control-tower/tests/test_policy_registry_schema.py

  verified-cot-note-write:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 16 &&
      github.event.comment.body == '/execute-beds24-cot-note' &&
      github.event.comment.author_association == 'OWNER'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
      BEDS24_COT_NOTE_MODE: live
      AUMARA_DISABLE_BOOKING_MUTATIONS: 'false'
      AUMARA_LIVE_BOOKING_WRITES_CONFIRMED: 'true'
      AUMARA_BEDS24_COT_WRITE_CONFIRMATION: INFOITEMS_ONLY_ELCID_COT_POLICY_2026_07_30_1
      BEDS24_COT_NOTE_MAX_WRITES: '1'
      BEDS24_COT_NOTE_POLICY_ID: elcid.baby-cot-infoitem
      BEDS24_COT_NOTE_POLICY_VERSION: 2026.07.27.1
      BEDS24_COT_NOTE_OUTPUT: aumara-control-tower/evidence/beds24-cot-note-write.json
    steps:
      - name: Require the merged reviewed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ["PR_API_URL"],
              headers={
                  "accept": "application/vnd.github+json",
                  "authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "x-github-api-version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull_request = json.load(response)
          expected = {
              "number": 16,
              "base": "main",
              "head": "agent/beds24-cot-note-write-safe",
          }
          actual = {
              "number": pull_request.get("number"),
              "base": (pull_request.get("base") or {}).get("ref"),
              "head": (pull_request.get("head") or {}).get("ref"),
          }
          if actual != expected or not pull_request.get("merged_at"):
              raise SystemExit(
                  "Cot-note execution requires merged reviewed PR #16"
              )
          PY
      - uses: actions/checkout@v4
      - name: Write at most one safe cot infoItem and verify it
        run: python aumara-control-tower/scripts/beds24_cot_note_sync.py
      - name: Upload sanitized read-back evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beds24-cot-note-write-evidence
          path: aumara-control-tower/evidence/beds24-cot-note-write.json
          if-no-files-found: warn
          retention-days: 7
