name: AUMARA guest journey live canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AUMARA-324882-LIVE to authorize this one canary run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aumara-guest-journey-live-324882
  cancel-in-progress: false

jobs:
  live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_GUEST_JOURNEY_MODE: live
      BEDS24_LIVE_SEND_AUTHORIZED: "true"
      AUMARA_DISABLE_GUEST_SEND: "false"
      AUMARA_DISABLE_EMAIL_SEND: "true"
      AUMARA_DISABLE_BOOKING_MUTATIONS: "true"
      BEDS24_AUTO_REPLY_EXECUTE: "0"
      BEDS24_NOTE_MODE: "off"
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

       - name: Verify manual canary authorization and secret presence
        env:
          CANARY_CONFIRMATION: ${{ inputs.CANARY_CONFIRMATION }}
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DYNAMODB_TABLE: ${{ secrets.DYNAMODB_TABLE }}
        run: |
          echo "Checking CANARY_CONFIRMATION=$CANARY_CONFIRMATION"
          if [ "$CANARY_CONFIRMATION" != "AUMARA-X24882-LIVE" ]; then
            echo "ERROR: Expected AUMARA-X24882-LIVE but got $CANARY_CONFIRMATION"
            exit 1
          fi
          
          if [ -z "$BEDS24_REFRESH_TOKEN" ]; then echo "Missing BEDS24_REFRESH_TOKEN"; exit 1; fi
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "Missing AWS_ACCESS_KEY_ID"; exit 1; fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then echo "Missing AWS_SECRET_ACCESS_KEY"; exit 1; fi
          if [ -z "$AWS_REGION" ]; then echo "Missing AWS_REGION"; exit 1; fi
          if [ -z "$DYNAMODB_TABLE" ]; then echo "Missing DYNAMODB_TABLE"; exit 1; fi
          
          echo "All checks passed!"

      - name: Install DynamoDB client
        run: python -m pip install "boto3>=1.34,<2"

      - name: Run AUMARA 324882 live canary
        env:
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DYNAMODB_TABLE: ${{ secrets.DYNAMODB_TABLE }}
        run: |
          python -m aumara_control_tower.scripts.beds24_guest_journey_live \
            --property 324882
