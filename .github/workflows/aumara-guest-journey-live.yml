name: AUMARA guest journey live canary
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type AUMARA-ZEM882-LIVE to authorize this one canary run"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aumara-guest-journey-live-zem882
  cancel-in-progress: false
jobs:
  live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_GUEST_JOURNEY_MODE: live
      BEDS24_LIVE_SEND_AUTHORIZED: "true"
      AUMARA_DISABLE_GUEST_SEND: "false"
      AUMARA_DISABLE_EMAIL_SEND: "true"
      AUMARA_DISABLE_BOOKING_MUTATIONS: "true"
      BEDS24_AUTO_REPLY_EXECUTE: "0"
      BEDS24_MOCK_MODE: "off"
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONUNBUFFERED: "1"
      CANARY_CONFIRMATION: ${{ inputs.confirmation }}
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
      BEDS24_REFRESH_CREDENTIAL: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DYNAMODB_TABLE: ${{ secrets.DYNAMODB_TABLE }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify manual canary authorization and secret presence
        run: |
          echo "Checking confirmation..."
          if [ "$CANARY_CONFIRMATION" != "AUMARA-ZEM882-LIVE" ]; then
            echo "ERROR: Expected AUMARA-ZEM882-LIVE, got $CANARY_CONFIRMATION"
            exit 1
          fi
          echo "All checks passed!"
      - name: Install dependencies
        working-directory: aumara-control-tower
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check boto3
      - name: Preflight env validation
        working-directory: aumara-control-tower
        run: |
          python - <<'PY'
          import os, sys
          required = [
            "BEDS24_REFRESH_TOKEN", "BEDS24_REFRESH_CREDENTIAL",
            "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY",
            "AWS_REGION", "DYNAMODB_TABLE",
          ]
          missing = [k for k in required if not os.environ.get(k, "").strip()]
          if missing:
              print("ERROR: missing required env vars: " + ", ".join(missing))
              sys.exit(1)
          print("Preflight OK")
          PY
      - name: Run live canary
        working-directory: aumara-control-tower
        run: |
          python scripts/beds24_guest_journey_live.py --property 324882
