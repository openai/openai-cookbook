name: AUMARA Provider Binding Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aumara-provider-binding-discovery.yml'

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Discover provider-related secret names only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aumara-control-tower/checkpoints
          python3 - <<'PY'
          import datetime, json, os, re, urllib.parse, urllib.request

          api_url = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
             'Accept': 'application/vnd.github+json',
             'Authorization': 'Bearer ' + token,
             'X-GitHub-Api-Version': '2022-11-28',
          }

          def fetch_names(path):
             request = urllib.request.Request(f'{api_url}{path}', headers=headers)
             with urllib.request.urlopen(request, timeout=30) as response:
                 payload = json.loads(response.read().decode('utf-8'))
             return [entry['name'] for entry in payload.get('secrets', [])]

          names = set(fetch_names(f'/repos/{repo}/actions/secrets'))
          environment = urllib.parse.quote('Production', safe='')
          names.update(fetch_names(f'/repos/{repo}/environments/{environment}/secrets'))
          names = sorted(names)
          patterns={
            'xai_grok': re.compile(r'(XAI|GROK|X_AI)', re.I),
            'gemini_google_ai': re.compile(r'(GEMINI|GENAI|GENERATIVE.*AI|GOOGLE.*AI|AI.*GOOGLE)', re.I),
          }
          matched={k:[n for n in names if rx.search(n)] for k,rx in patterns.items()}
          out={
            'schema':'aumara.provider-binding-discovery',
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'matched_secret_names':matched,
            'total_secret_count_seen':len(names),
            'secret_values_exposed':False,
          }
          path='aumara-control-tower/checkpoints/AUMARA_PROVIDER_BINDING_NAMES.json'
          open(path,'w',encoding='utf-8').write(json.dumps(out,indent=2)+'\n')
          print('provider_binding_name_discovery_complete')
          print('xai_grok_matches=' + str(len(matched['xai_grok'])))
          print('gemini_google_ai_matches=' + str(len(matched['gemini_google_ai'])))
          PY
      - name: Persist names-only discovery receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AUMARA Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aumara-control-tower/checkpoints/AUMARA_PROVIDER_BINDING_NAMES.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record AUMARA provider binding names'
          git push origin HEAD:main
