name: AUMARA Pipeline Validation

on:
  push:
    branches: [main]
    paths:
      - "aumara-site/creative/**"
      - "aumara-site/scripts/**"
      - ".github/workflows/aumara-visual-pack.yml"
      - ".github/workflows/aumara-validate.yml"
  pull_request:
    paths:
      - "aumara-site/creative/**"
      - "aumara-site/scripts/**"
      - ".github/workflows/aumara-visual-pack.yml"
      - ".github/workflows/aumara-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON and Python syntax
        shell: bash
        run: |
          python -m json.tool aumara-site/creative/prompts.json >/dev/null
          python -m py_compile aumara-site/scripts/generate_visual_pack.py

      - name: Validate prompt pack structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("aumara-site/creative/prompts.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("model"), "model is required"
          packs = data.get("packs")
          assert isinstance(packs, dict) and packs, "packs must be a non-empty object"

          seen = set()
          valid_modes = {"generate", "edit"}
          for pack_name, jobs in packs.items():
              assert isinstance(jobs, list) and jobs, f"pack {pack_name} must be non-empty"
              for job in jobs:
                  job_id = job.get("id")
                  assert job_id and job_id not in seen, f"invalid or duplicate id: {job_id}"
                  seen.add(job_id)
                  assert job.get("mode", "generate") in valid_modes, f"bad mode for {job_id}"
                  assert job.get("prompt"), f"prompt missing for {job_id}"
                  assert job.get("size"), f"size missing for {job_id}"
                  if job.get("mode") == "edit":
                      assert job.get("input"), f"input missing for edit job {job_id}"

          print(f"Validated {len(seen)} AUMARA visual jobs across {len(packs)} packs")
          PY
