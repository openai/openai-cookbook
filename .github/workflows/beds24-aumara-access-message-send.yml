name: Beds24 AUMARA access message send

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit (default) or live
        required: false
        default: audit
        type: choice
        options:
          - audit
          - live
      horizon_days:
        description: Arrival horizon days
        required: false
        default: "45"
        type: string

permissions:
  contents: read

concurrency:
  group: beds24-aumara-access-message-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      AUMARA_FIXED_GUEST_PIN: "1531"
      AUMARA_ACCESS_MESSAGE_MODE: ${{ inputs.mode || 'audit' }}
      AUMARA_ACCESS_MESSAGE_HORIZON_DAYS: ${{ inputs.horizon_days || '45' }}
      AUMARA_LIVE_BOOKING_WRITES_CONFIRMED: ${{ inputs.mode == 'live' && 'true' || 'false' }}
      AUMARA_ACCESS_MESSAGE_WRITE_CONFIRMATION: ${{ inputs.mode == 'live' && 'AUMARA_ACCESS_MESSAGE_SEND_1531_2026_08_03' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require credential
        run: |
          if [ -z "$BEDS24_REFRESH_TOKEN" ]; then
            echo "::error::BEDS24_REFRESH_CREDENTIAL missing"
            exit 1
          fi
      - name: Send or audit access messages
        run: python aumara-control-tower/scripts/beds24_aumara_access_message_send.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aumara-access-message-send
          path: aumara-control-tower/evidence/aumara-access-message-send.json
          if-no-files-found: warn
          retention-days: 7
