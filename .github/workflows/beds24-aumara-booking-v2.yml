name: Beds24 AUMARA credential check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beds24-aumara-credential-check
  cancel-in-progress: true

jobs:
  validate:
    name: Validate existing B24 credential safely
    runs-on: ubuntu-latest
    env:
      B24_TOKEN_CREDENTIAL: ${{ secrets.B24_TOKEN_CREDENTIAL }}
      BEDS24_ACCESS_TOKEN_FILE: ${{ runner.temp }}/beds24-access-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate B24 token credential
        run: python aumara-control-tower/scripts/beds24_auth_check.py validate

      - name: Exchange refresh token
        run: python aumara-control-tower/scripts/beds24_auth_check.py exchange

      - name: Run read-only Beds24 probe
        run: python aumara-control-tower/scripts/beds24_auth_check.py probe

      - name: Upload authentication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beds24-authentication-evidence
          path: aumara-control-tower/evidence/beds24-auth-check.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary access token
        if: always()
        shell: bash
        run: rm -f "$BEDS24_ACCESS_TOKEN_FILE"
