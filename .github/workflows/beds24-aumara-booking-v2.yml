name: Beds24 AUMARA booking bridge v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-aumara-booking-v2.yml'
      - 'aumara-control-tower/scripts/beds24_create_paid_booking.py'
      - 'aumara-control-tower/beds24-requests/AUMARA-MEDINA-20260718-660.json'

permissions:
  contents: write

concurrency:
  group: beds24-aumara-booking-v2
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      BEDS24_BOOTSTRAP_CREDENTIAL: ${{ secrets.BEDS24_BOOTSTRAP_CREDENTIAL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Beds24 auth recovery and paid booking
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p aumara-control-tower/evidence
          python aumara-control-tower/scripts/beds24_create_paid_booking.py > aumara-control-tower/evidence/beds24-execution-log.txt 2>&1
          RC=$?
          cat aumara-control-tower/evidence/beds24-execution-log.txt
          exit "$RC"

      - name: Commit auth, encrypted vault and booking evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            aumara-control-tower/evidence/beds24-auth-bootstrap-status.json \
            aumara-control-tower/evidence/beds24-AUMARA-MEDINA-20260718-660.json \
            aumara-control-tower/evidence/beds24-execution-log.txt \
            aumara-control-tower/vault/beds24-refresh-token.enc \
            2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Record Beds24 auth and AUMARA booking evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if booking execution did not complete
        if: steps.execute.outcome != 'success'
        shell: bash
        run: |
          echo 'Beds24 booking execution failed. Evidence was committed for diagnosis.' >&2
          exit 1
