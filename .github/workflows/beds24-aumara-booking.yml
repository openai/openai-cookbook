name: Beds24 AUMARA booking bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-aumara-booking.yml'
      - 'aumara-control-tower/beds24-requests/**'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: beds24-aumara-booking
  cancel-in-progress: false

jobs:
  create-and-verify:
    runs-on: ubuntu-latest
    env:
      BEDS24_API_BASE: https://beds24.com/api/v2
      BEDS24_BOOTSTRAP_CREDENTIAL: ${{ secrets.BEDS24_BOOTSTRAP_CREDENTIAL }}
      REQUEST_FILE: aumara-control-tower/beds24-requests/AUMARA-MEDINA-20260718-660.json
      EVIDENCE_FILE: aumara-control-tower/evidence/beds24-AUMARA-MEDINA-20260718-660.json
      AUTH_EVIDENCE_FILE: aumara-control-tower/evidence/beds24-auth-bootstrap-status.json
      VAULT_FILE: aumara-control-tower/vault/beds24-refresh-token.fernet

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and normalize bootstrap credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/beds24 "$(dirname "$VAULT_FILE")" "$(dirname "$EVIDENCE_FILE")"
          python - <<'PY'
          import os, pathlib, re
          raw=os.environ.get('BEDS24_BOOTSTRAP_CREDENTIAL','')
          clean=re.sub(r'\s+', '', raw)
          if not clean:
              raise SystemExit('Missing GitHub Actions secret: BEDS24_BOOTSTRAP_CREDENTIAL')
          if len(clean) < 20:
              raise SystemExit('Beds24 bootstrap credential is unexpectedly short')
          pathlib.Path('/tmp/beds24/bootstrap.txt').write_text(clean)
          PY
          CLEAN_CREDENTIAL="$(cat /tmp/beds24/bootstrap.txt)"
          echo "::add-mask::${CLEAN_CREDENTIAL}"

      - name: Install crypto helper
        shell: bash
        run: python -m pip install --quiet cryptography

      - name: Resolve persistent Beds24 refresh token safely
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP="$(cat /tmp/beds24/bootstrap.txt)"
          echo "::add-mask::${BOOTSTRAP}"

          if [ -s "$VAULT_FILE" ]; then
            python - <<'PY'
          import base64, hashlib, os, pathlib
          from cryptography.fernet import Fernet
          bootstrap=pathlib.Path('/tmp/beds24/bootstrap.txt').read_bytes()
          key=base64.urlsafe_b64encode(hashlib.sha256(bootstrap).digest())
          refresh=Fernet(key).decrypt(pathlib.Path(os.environ['VAULT_FILE']).read_bytes())
          pathlib.Path('/tmp/beds24/refresh.txt').write_bytes(refresh)
          PY
            printf '{"status":"refresh_token_loaded_from_encrypted_vault"}\n' > "$AUTH_EVIDENCE_FILE"
            exit 0
          fi

          HTTP_REFRESH="$(curl --silent --show-error \
            -o /tmp/beds24/auth-bootstrap.json \
            -w '%{http_code}' \
            -H "refreshToken: ${BOOTSTRAP}" \
            "${BEDS24_API_BASE}/authentication/token" || true)"

          if [[ "$HTTP_REFRESH" =~ ^2 ]]; then
            python - <<'PY'
          import json, pathlib
          obj=json.loads(pathlib.Path('/tmp/beds24/auth-bootstrap.json').read_text())
          token=obj.get('token')
          if not token:
              raise SystemExit('Beds24 accepted bootstrap as refresh token but returned no API token')
          pathlib.Path('/tmp/beds24/refresh.txt').write_text(pathlib.Path('/tmp/beds24/bootstrap.txt').read_text())
          pathlib.Path('/tmp/beds24/token.txt').write_text(token)
          PY
            printf '{"status":"bootstrap_accepted_as_refresh_token","http_status":%s}\n' "$HTTP_REFRESH" > "$AUTH_EVIDENCE_FILE"
          else
            HTTP_SETUP="$(curl --silent --show-error \
              -o /tmp/beds24/setup.json \
              -w '%{http_code}' \
              -H "code: ${BOOTSTRAP}" \
              -H 'deviceName: AUMARA-Control-Tower' \
              "${BEDS24_API_BASE}/authentication/setup" || true)"

            if [[ ! "$HTTP_SETUP" =~ ^2 ]]; then
              python - <<'PY'
          import json, os, pathlib
          body=''
          p=pathlib.Path('/tmp/beds24/setup.json')
          if p.exists():
              body=p.read_text(errors='replace')[:1000]
          out={
              'status':'bootstrap_rejected_by_beds24',
              'refresh_token_probe_http_status':os.environ.get('HTTP_REFRESH',''),
              'invite_code_setup_http_status':os.environ.get('HTTP_SETUP',''),
              'beds24_response':body
          }
          pathlib.Path(os.environ['AUTH_EVIDENCE_FILE']).write_text(json.dumps(out, indent=2))
          PY
              echo "Beds24 rejected the normalized bootstrap credential" >&2
              exit 1
            fi

            python - <<'PY'
          import json, pathlib
          obj=json.loads(pathlib.Path('/tmp/beds24/setup.json').read_text())
          refresh=obj.get('refreshToken')
          token=obj.get('token')
          if not refresh:
              raise SystemExit('Beds24 setup succeeded but returned no refreshToken')
          pathlib.Path('/tmp/beds24/refresh.txt').write_text(refresh)
          if token:
              pathlib.Path('/tmp/beds24/token.txt').write_text(token)
          PY
            printf '{"status":"bootstrap_accepted_as_invite_code","http_status":%s}\n' "$HTTP_SETUP" > "$AUTH_EVIDENCE_FILE"
          fi

          python - <<'PY'
          import base64, hashlib, os, pathlib
          from cryptography.fernet import Fernet
          bootstrap=pathlib.Path('/tmp/beds24/bootstrap.txt').read_bytes()
          refresh=pathlib.Path('/tmp/beds24/refresh.txt').read_bytes()
          key=base64.urlsafe_b64encode(hashlib.sha256(bootstrap).digest())
          pathlib.Path(os.environ['VAULT_FILE']).write_bytes(Fernet(key).encrypt(refresh))
          PY
        env:
          HTTP_REFRESH: ${{ env.HTTP_REFRESH }}
          HTTP_SETUP: ${{ env.HTTP_SETUP }}

      - name: Get current Beds24 API token
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/beds24/token.txt ]; then
            REFRESH_TOKEN="$(cat /tmp/beds24/refresh.txt)"
            echo "::add-mask::${REFRESH_TOKEN}"
            curl --fail-with-body --silent --show-error \
              -H "refreshToken: ${REFRESH_TOKEN}" \
              "${BEDS24_API_BASE}/authentication/token" \
              -o /tmp/beds24/auth.json
            python - <<'PY'
          import json, pathlib
          obj=json.loads(pathlib.Path('/tmp/beds24/auth.json').read_text())
          token=obj.get('token')
          if not token:
              raise SystemExit('Beds24 authentication/token returned no token')
          pathlib.Path('/tmp/beds24/token.txt').write_text(token)
          PY
          fi

      - name: Create or reuse the paid AUMARA booking and verify it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, pathlib, subprocess, urllib.parse
          api=os.environ['BEDS24_API_BASE']
          token=pathlib.Path('/tmp/beds24/token.txt').read_text().strip()
          req=json.loads(pathlib.Path(os.environ['REQUEST_FILE']).read_text())
          evidence_path=pathlib.Path(os.environ['EVIDENCE_FILE'])
          api_ref=req['request_id']

          def call(method, url, payload=None):
              cmd=['curl','--fail-with-body','--silent','--show-error','-X',method,'-H',f'token: {token}']
              if payload is not None:
                  cmd += ['-H','content-type: application/json','--data-binary',json.dumps(payload)]
              cmd += [url]
              raw=subprocess.check_output(cmd)
              return json.loads(raw.decode())

          q=urllib.parse.urlencode([('apiReference',api_ref),('includeInvoiceItems','true'),('includeGuests','true')])
          rows=(call('GET',f'{api}/bookings?{q}').get('data') or [])
          active=[r for r in rows if r.get('status') != 'cancelled']
          outcome='reused_existing'

          if not active:
              payload=[{
                  'roomId':req['room_id'],
                  'status':'confirmed',
                  'arrival':req['arrival'],
                  'departure':req['departure'],
                  'firstName':req['first_name'],
                  'lastName':req['last_name'],
                  'country':req.get('country','Spain'),
                  'apiReference':api_ref,
                  'price':req['total_price'],
                  'comment':req['comments'],
                  'invoiceItems':[
                      {'type':'charge','description':req['charge_description'],'qty':1,'amount':req['total_price']},
                      {'type':'payment','description':req['payment_description'],'qty':1,'amount':req['amount_paid']}
                  ]
              }]
              created=call('POST',f'{api}/bookings',payload)
              if not isinstance(created,list) or not created or not created[0].get('success'):
                  raise SystemExit('Beds24 create failed: '+json.dumps(created))
              outcome='created_new'
              rows=(call('GET',f'{api}/bookings?{q}').get('data') or [])
              active=[r for r in rows if r.get('status') != 'cancelled']

          if len(active) != 1:
              raise SystemExit(f'Expected exactly one active booking for {api_ref}; found {len(active)}')
          r=active[0]
          if str(r.get('roomId')) != str(req['room_id']):
              raise SystemExit(f"Room mismatch: expected {req['room_id']}, got {r.get('roomId')}")
          if r.get('arrival') != req['arrival'] or r.get('departure') != req['departure']:
              raise SystemExit('Date mismatch after verification')

          items=r.get('invoiceItems') or []
          charges=sum(float(i.get('amount') or 0)*float(i.get('qty') or 1) for i in items if i.get('type')=='charge')
          payments=sum(float(i.get('amount') or 0)*float(i.get('qty') or 1) for i in items if i.get('type')=='payment')
          evidence={
              'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'outcome':outcome,
              'api_reference':api_ref,
              'booking_id':r.get('id'),
              'property_id':r.get('propertyId'),
              'room_id':r.get('roomId'),
              'guest_name':req['guest_name'],
              'arrival':r.get('arrival'),
              'departure':r.get('departure'),
              'status':r.get('status'),
              'price':r.get('price'),
              'invoice_charge_total':charges,
              'invoice_payment_total':payments,
              'paid_bank_transfer':payments >= float(req['amount_paid']),
              'refresh_token_storage':'encrypted_ciphertext_only'
          }
          evidence_path.write_text(json.dumps(evidence,indent=2))
          PY

      - name: Commit encrypted vault and verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$VAULT_FILE" "$EVIDENCE_FILE" "$AUTH_EVIDENCE_FILE" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update Beds24 encrypted vault and AUMARA booking evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
