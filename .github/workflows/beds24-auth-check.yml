name: Beds24 credential check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/beds24-auth-check.yml'
      - 'aumara-control-tower/scripts/beds24_auth_check.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      B24_TOKEN_CREDENTIAL: ${{ secrets.B24_TOKEN_CREDENTIAL }}
      BEDS24_ACCESS_TOKEN_FILE: /tmp/beds24-access-token
    steps:
      - uses: actions/checkout@v