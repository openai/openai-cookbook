name: Beds24 booking bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-booking-bridge.yml'
      - 'aumara-control-tower/beds24-requests/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: beds24-booking-bridge
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      BEDS24_API_BASE: https://beds24.com/api/v2
      BEDS24_INVITE_CODE: ${{ secrets.BEDS24_INVITE_CODE }}
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare directories
        shell: bash
        run: mkdir -p /tmp/beds24 aumara-control-tower/evidence

      - name: Resolve refresh token
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BEDS24_REFRESH_TOKEN:-}" ]; then
            printf '%s' "$BEDS24_REFRESH_TOKEN" > /tmp/beds24/refresh.txt
            echo "source=existing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BEDS24_INVITE_CODE:-}" ]; then
            echo "source=missing_credentials" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "code: ${BEDS24_INVITE_CODE}" \
            -H "deviceName: AUMARA-Control-Tower" \
            "${BEDS24_API_BASE}/authentication/setup" \
            -o /tmp/beds24/setup.json
          python - <<'PY'
          import json, pathlib
          obj=json.loads(pathlib.Path('/tmp/beds24/setup.json').read_text())
          token=obj.get('refreshToken')
          if not token:
              raise SystemExit('Beds24 setup did not return refreshToken')
          pathlib.Path('/tmp/beds24/refresh.txt').write_text(token)
          PY
          echo "source=invite_code" >> "$GITHUB_OUTPUT"

      - name: Persist refresh token as repository secret
        id: persist
        if: steps.resolve.outputs.source == 'invite_code'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pynacl
          gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" > /tmp/beds24/gh-public-key.json
          python - <<'PY'
          import base64, json
          from nacl import encoding, public
          key=json.load(open('/tmp/beds24/gh-public-key.json'))
          refresh=open('/tmp/beds24/refresh.txt').read().strip().encode()
          public_key=public.PublicKey(key['key'].encode(), encoding.Base64Encoder())
          encrypted=public.SealedBox(public_key).encrypt(refresh)
          json.dump({'key_id':key['key_id'],'encrypted_value':base64.b64encode(encrypted).decode()}, open('/tmp/beds24/secret-put.json','w'))
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/secrets/BEDS24_REFRESH_TOKEN" --input /tmp/beds24/secret-put.json

      - name: Stop cleanly when credentials are missing
        if: steps.resolve.outputs.source == 'missing_credentials'
        shell: bash
        run: |
          cat > aumara-control-tower/evidence/beds24-booking-bridge-status.json <<'JSON'
          {
            "status": "WAITING_FOR_BEDS24_INVITE_CODE_SECRET",
            "required_secret": "BEDS24_INVITE_CODE",
            "next_action": "Add the one-time Beds24 API V2 invite code as a GitHub Actions repository secret. The hourly bridge will then exchange it, create pending booking requests, and attempt to persist BEDS24_REFRESH_TOKEN."
          }
          JSON

      - name: Get short-lived token
        if: steps.resolve.outputs.source != 'missing_credentials'
        shell: bash
        run: |
          set -euo pipefail
          REFRESH_TOKEN="$(cat /tmp/beds24/refresh.txt)"
          curl --fail-with-body --silent --show-error \
            -H "refreshToken: ${REFRESH_TOKEN}" \
            "${BEDS24_API_BASE}/authentication/token" \
            -o /tmp/beds24/auth.json
          python - <<'PY'
          import json, pathlib
          obj=json.loads(pathlib.Path('/tmp/beds24/auth.json').read_text())
          token=obj.get('token')
          if not token:
              raise SystemExit('Beds24 auth endpoint did not return token')
          pathlib.Path('/tmp/beds24/auth-token.txt').write_text(token)
          PY

      - name: Process booking requests idempotently
        if: steps.resolve.outputs.source != 'missing_credentials'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, urllib.parse, datetime, os

          api=os.environ['BEDS24_API_BASE']
          token=pathlib.Path('/tmp/beds24/auth-token.txt').read_text().strip()
          req_dir=pathlib.Path('aumara-control-tower/beds24-requests')
          out_dir=pathlib.Path('aumara-control-tower/evidence')
          out_dir.mkdir(parents=True, exist_ok=True)

          def curl_json(args, body=None):
              cmd=['curl','--fail-with-body','--silent','--show-error','-H',f'token: {token}']+args
              if body is not None:
                  cmd += ['-H','content-type: application/json','--data-binary',body]
              raw=subprocess.check_output(cmd)
              return json.loads(raw.decode())

          for path in sorted(req_dir.glob('*.json')):
              req=json.loads(path.read_text())
              marker=req['request_id']
              evidence_path=out_dir/f'beds24-{marker}.json'
              if evidence_path.exists():
                  continue

              q={
                  'roomId': str(req['room_id']),
                  'arrival': req['arrival'],
                  'departure': req['departure'],
                  'searchString': req['guest_name'],
                  'includeInvoiceItems': 'true'
              }
              url=api+'/bookings?'+urllib.parse.urlencode(q)
              found=curl_json([url]).get('data') or []
              exact=[]
              for r in found:
                  name=(' '.join([str(r.get('firstName') or '').strip(), str(r.get('lastName') or '').strip()])).strip().lower()
                  if str(r.get('roomId'))==str(req['room_id']) and r.get('arrival')==req['arrival'] and r.get('departure')==req['departure'] and name==req['guest_name'].lower():
                      exact.append(r)

              outcome='reused_existing'
              if not exact:
                  payload=[{
                      'roomId': req['room_id'],
                      'roomQty': 1,
                      'status': 'confirmed',
                      'arrival': req['arrival'],
                      'departure': req['departure'],
                      'firstName': req['first_name'],
                      'lastName': req['last_name'],
                      'country': req.get('country','Spain'),
                      'country2': req.get('country2','ES'),
                      'price': req['total_price'],
                      'comments': req['comments'],
                      'notes': req['notes'],
                      'custom1': marker,
                      'flagText': req.get('flag_text','PAID'),
                      'invoiceItems': [
                          {'type':'charge','description':req['charge_description'],'qty':1,'amount':req['total_price']},
                          {'type':'payment','description':req['payment_description'],'qty':1,'amount':req['amount_paid']}
                      ],
                      'actions': {'notifyGuest': False, 'notifyHost': True, 'allowWebhooks': True}
                  }]
                  created=curl_json(['-X','POST',api+'/bookings'], json.dumps(payload))
                  if not isinstance(created,list) or not created or not created[0].get('success'):
                      raise SystemExit('Beds24 create failed: '+json.dumps(created))
                  outcome='created_new'
                  found=curl_json([url]).get('data') or []
                  exact=[]
                  for r in found:
                      name=(' '.join([str(r.get('firstName') or '').strip(), str(r.get('lastName') or '').strip()])).strip().lower()
                      if str(r.get('roomId'))==str(req['room_id']) and r.get('arrival')==req['arrival'] and r.get('departure')==req['departure'] and name==req['guest_name'].lower():
                          exact.append(r)

              if len(exact)!=1:
                  raise SystemExit(f'Expected one exact booking for {marker}, found {len(exact)}')
              r=exact[0]
              items=r.get('invoiceItems') or []
              charges=sum(float(i.get('amount') or 0)*float(i.get('qty') or 1) for i in items if i.get('type')=='charge')
              payments=sum(float(i.get('amount') or 0)*float(i.get('qty') or 1) for i in items if i.get('type')=='payment')
              evidence={
                  'verified_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'request_id': marker,
                  'outcome': outcome,
                  'booking_id': r.get('id'),
                  'property_id': r.get('propertyId'),
                  'room_id': r.get('roomId'),
                  'guest_name': req['guest_name'],
                  'arrival': r.get('arrival'),
                  'departure': r.get('departure'),
                  'status': r.get('status'),
                  'price': r.get('price'),
                  'invoice_charge_total': charges,
                  'invoice_payment_total': payments,
                  'contact_details': req.get('contact_details_status','pending')
              }
              evidence_path.write_text(json.dumps(evidence, indent=2))
          PY

      - name: Record bridge status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          status={
            'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'credential_source': '${{ steps.resolve.outputs.source }}',
            'refresh_secret_persistence_step': '${{ steps.persist.outcome }}',
            'plaintext_credentials_committed': False
          }
          pathlib.Path('aumara-control-tower/evidence/beds24-booking-bridge-status.json').write_text(json.dumps(status, indent=2))
          PY

      - name: Commit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aumara-control-tower/evidence/
          git diff --cached --quiet || git commit -m 'Update Beds24 booking bridge evidence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
