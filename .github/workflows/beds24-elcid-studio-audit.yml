name: Beds24 El Cid Studio read-only audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-elcid-studio-audit.yml'
      - 'aumara-control-tower/scripts/beds24_elcid_studio_audit.py'

permissions:
  contents: write

concurrency:
  group: beds24-elcid-studio-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      BEDS24_TOKEN_CREDENTIAL: ${{ secrets.BEDS24_TOKEN_CREDENTIAL }}
      BEDS24_BOOTSTRAP_CREDENTIAL: ${{ secrets.BEDS24_BOOTSTRAP_CREDENTIAL }}
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
      BEDS24_ALLOW_INVITE_BOOTSTRAP: '1'
      BEDS24_STUDIO_AUDIT_OUTPUT: aumara-control-tower/evidence/elcid-studio-audit.json

    steps:
      - uses: actions/checkout@v4

      - name: Test read-only audit logic
        run: python -m unittest aumara-control-tower/scripts/tests/test_beds24_elcid_studio_audit.py

      - name: Audit Studio bookings, alternatives, and website
        run: python aumara-control-tower/scripts/beds24_elcid_studio_audit.py

      - name: Persist only an encrypted refresh-token vault after bootstrap
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aumara-control-tower/vault/beds24-refresh-token.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh encrypted Beds24 credential vault [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elcid-studio-read-only-audit
          path: aumara-control-tower/evidence/elcid-studio-audit.json
          if-no-files-found: warn
          retention-days: 7
