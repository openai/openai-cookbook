name: Beds24 exchange artifact audit and cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/beds24-exchange-audit.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: beds24-exchange-audit-cleanup
  cancel-in-progress: false

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: "868d8df92140db824e3439699cd562bb8e3a79a3"
      ORIGINAL_PARENT_SHA: "00ab4f98f1d2d21bc54e0bed17ec8b5b857cee1f"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exchange run and refresh-token artifact without exposing token
        id: audit
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import io
          import json
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          target_sha = os.environ["TARGET_SHA"]
          out_dir = pathlib.Path("aumara-control-tower/evidence/beds24-exchange")
          out_dir.mkdir(parents=True, exist_ok=True)
          evidence_path = out_dir / "latest.json"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AUMARA-Beds24-Exchange-Audit/1.0",
          }

          def request_json(url: str) -> dict:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          evidence: dict[str, object] = {
              "target_sha": target_sha,
              "workflow": "exchange-beds24-invite.yml",
              "verified": False,
              "diagnostic": None,
          }

          run = None
          try:
              workflow = urllib.parse.quote("exchange-beds24-invite.yml", safe="")
              runs_url = (
                  f"{api}/repos/{repo}/actions/workflows/{workflow}/runs"
                  "?event=push&branch=main&per_page=50"
              )
              for _ in range(48):
                  payload = request_json(runs_url)
                  candidates = [
                      item for item in payload.get("workflow_runs", [])
                      if item.get("head_sha") == target_sha
                  ]
                  if candidates:
                      run = sorted(candidates, key=lambda item: item.get("created_at", ""), reverse=True)[0]
                      if run.get("status") == "completed":
                          break
                  time.sleep(5)

              if not run:
                  raise RuntimeError("No exchange workflow run found for target commit")
              if run.get("status") != "completed":
                  raise RuntimeError(f"Exchange run did not complete: {run.get('status')}")

              run_id = int(run["id"])
              evidence.update({
                  "run_id": run_id,
                  "run_number": run.get("run_number"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "html_url": run.get("html_url"),
              })

              artifacts = request_json(
                  f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
              ).get("artifacts", [])
              matches = [
                  artifact for artifact in artifacts
                  if artifact.get("name") == "beds24-refresh-token"
              ]
              if not matches:
                  raise RuntimeError("beds24-refresh-token artifact is missing")

              artifact = sorted(matches, key=lambda item: item.get("created_at", ""), reverse=True)[0]
              evidence.update({
                  "artifact_id": artifact.get("id"),
                  "artifact_name": artifact.get("name"),
                  "artifact_size_bytes": artifact.get("size_in_bytes"),
                  "artifact_expired": artifact.get("expired"),
                  "artifact_created_at": artifact.get("created_at"),
                  "artifact_expires_at": artifact.get("expires_at"),
              })

              download = urllib.request.Request(
                  str(artifact["archive_download_url"]), headers=headers
              )
              with urllib.request.urlopen(download, timeout=60) as response:
                  archive = response.read()
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  names = bundle.namelist()
                  expected = [name for name in names if pathlib.PurePosixPath(name).name == "beds24-refresh-token.txt"]
                  if len(expected) != 1:
                      raise RuntimeError("Artifact does not contain exactly one beds24-refresh-token.txt")
                  raw = bundle.read(expected[0])

              refresh = raw.decode("utf-8").strip()
              evidence.update({
                  "token_file_present": True,
                  "token_file_bytes": len(raw),
                  "token_single_line": len(refresh.splitlines()) == 1,
                  "token_prefix_shape_valid": refresh.startswith("rt_"),
              })

              checks = [
                  run.get("conclusion") == "success",
                  not bool(artifact.get("expired")),
                  bool(refresh),
                  len(refresh.splitlines()) == 1,
                  refresh.startswith("rt_"),
              ]
              if not all(checks):
                  raise RuntimeError("Exchange run or artifact validation failed")

              evidence["verified"] = True
              evidence["diagnostic"] = "SUCCESS"
          except Exception as exc:
              evidence["diagnostic"] = str(exc)[:500]
          finally:
              evidence_path.write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              safe = dict(evidence)
              safe.pop("html_url", None)
              print(json.dumps(safe, sort_keys=True))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"verified={str(bool(evidence.get('verified'))).lower()}\n")
                  if evidence.get("run_id"):
                      handle.write(f"run_id={evidence['run_id']}\n")
          PY

      - name: Restore manual-only exchange workflow, commit evidence, and self-delete
        if: always()
        shell: bash
        run: |
          git show "${ORIGINAL_PARENT_SHA}:.github/workflows/exchange-beds24-invite.yml" > .github/workflows/exchange-beds24-invite.yml
          git rm .github/workflows/beds24-exchange-audit.yml
          git add .github/workflows/exchange-beds24-invite.yml aumara-control-tower/evidence/beds24-exchange/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: verify Beds24 exchange artifact and restore manual-only trigger"
          git push origin HEAD:main

      - name: Fail audit if verification did not pass
        if: steps.audit.outputs.verified != 'true'
        run: exit 1
