name: Beds24 Photo Sync Discovery

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/aumara-beds24-sync.trigger'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Discover key bindings and Beds24 content shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          secrets = json.loads(os.environ.get('ALL_SECRETS_JSON') or '{}')
          names = sorted(secrets)

          def candidates(kind):
              out=[]
              for n in names:
                  u=n.upper()
                  if kind=='api':
                      if (('BEDS24' in u and 'API' in u and 'KEY' in u and 'PROP' not in u) or u in {'APIKEY','API_KEY','BEDS24APIKEY'}):
                          out.append(n)
                  else:
                      if ((('BEDS24' in u or 'PROP' in u) and 'PROP' in u and 'KEY' in u) or u in {'PROPKEY','PROP_KEY','BEDS24PROPKEY'}):
                          out.append(n)
              return out

          api_names=candidates('api')
          prop_names=candidates('prop')
          print('api_key_secret_names=' + json.dumps(api_names))
          print('prop_key_secret_names=' + json.dumps(prop_names))
          print('secret_values_exposed=false')
          refresh_credential = str(secrets.get('BEDS24_REFRESH_CREDENTIAL') or '').strip()
          print('refresh_credential_present=' + ('true' if bool(refresh_credential) else 'false'))

          def request_json(url, *, method='GET', headers=None, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers or {},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      raw = r.read()
                      status = int(r.status)
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  status = int(e.code)
              try:
                  parsed = json.loads(raw.decode('utf-8', 'replace')) if raw else {}
              except Exception:
                  parsed = {}
              return status, parsed

          def safe(node, depth=0):
              if depth>8: return '[depth]'
              if isinstance(node, dict):
                  out={}
                  for k,v in node.items():
                      ku=str(k).lower()
                      if any(x in ku for x in ('apikey','propkey','token','password','secret','email','phone','address')):
                          out[str(k)]='[redacted]'
                      elif isinstance(v,(dict,list)):
                          out[str(k)]=safe(v,depth+1)
                      elif any(x in ku for x in ('id','name','title','status','picture','image','photo','url','room','property','display')):
                          out[str(k)]=v
                  return out
              if isinstance(node,list):
                  return [safe(x,depth+1) for x in node[:100]]
              return node

          status = None
          body = {}

          if len(api_names)==1 and len(prop_names)==1:
              status, body = request_json(
                  'https://api.beds24.com/json/getPropertyContent',
                  method='POST',
                  headers={
                      'Content-Type':'application/json',
                      'Accept':'application/json',
                      'User-Agent':'AUMARA-photo-sync/1.0',
                  },
                  payload={
                      'authentication':{
                          'apiKey':str(secrets[api_names[0]]).strip(),
                          'propKey':str(secrets[prop_names[0]]).strip(),
                      }
                  },
              )
              print('discovery_auth_mode=legacy_api_prop_keys')
          elif refresh_credential:
              details_status, details = request_json(
                  'https://api.beds24.com/v2/authentication/details',
                  headers={'accept':'application/json','token':refresh_credential},
              )
              access_token = (
                  refresh_credential
                  if 200 <= details_status < 300 and bool(details.get('validToken'))
                  else ''
              )
              auth_mode = 'access_token'
              if not access_token:
                  token_status, token_body = request_json(
                      'https://api.beds24.com/v2/authentication/token',
                      headers={'accept':'application/json','refreshToken':refresh_credential},
                  )
                  print('token_exchange_http_status=' + str(token_status))
                  candidate = token_body.get('token') if isinstance(token_body, dict) else None
                  access_token = str(candidate).strip() if isinstance(candidate, str) else ''
                  auth_mode = 'refresh_token'
              if not access_token:
                  print('status=AUTH_FAILED')
                  raise SystemExit(2)
              print('discovery_auth_mode=' + auth_mode)
              status, body = request_json(
                  'https://api.beds24.com/v2/properties',
                  headers={'accept':'application/json','token':access_token},
              )
          else:
              print('status=' + ('MISSING_MATCH' if not api_names or not prop_names else 'AMBIGUOUS_MATCH'))
              raise SystemExit(2)

          print('http_status=' + str(status))
          print('response_shape=' + json.dumps(safe(body), ensure_ascii=False, separators=(',',':')))
          print('status=' + ('LIVE_CONTENT_READ_OK' if 200 <= status < 300 else 'LIVE_CONTENT_READ_FAILED'))
          if not 200 <= status < 300:
              raise SystemExit(3)
          PY
