name: Beds24 secret presence probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beds24-secret-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beds24-secret-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      # Real repository secret (Settings → Secrets and variables → Actions)
      BEDS24_REFRESH_CREDENTIAL: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      # Legacy names kept only to report absence/presence accurately
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
      BEDS24_API_TOKEN: ${{ secrets.BEDS24_API_TOKEN }}
      BEDS24_TOKEN: ${{ secrets.BEDS24_TOKEN }}
      BEDS24_API_KEY: ${{ secrets.BEDS24_API_KEY }}
      BEDS24_INVITE_CODE: ${{ secrets.BEDS24_INVITE_CODE }}
      BEDS24_REFRESH: ${{ secrets.BEDS24_REFRESH }}
    steps:
      - uses: actions/checkout@v4
      - name: Write sanitized presence report
        shell: bash
        run: |
          python - <<'PY'
          import json, os, datetime
          names = [
            'BEDS24_REFRESH_CREDENTIAL',  # canonical repo secret
            'BEDS24_REFRESH_TOKEN',        # legacy alias (usually absent)
            'BEDS24_API_TOKEN',
            'BEDS24_TOKEN',
            'BEDS24_API_KEY',
            'BEDS24_INVITE_CODE',
            'BEDS24_REFRESH',
          ]
          present = {name: bool(os.environ.get(name)) for name in names}
          report = {
            'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'canonical_secret': 'BEDS24_REFRESH_CREDENTIAL',
            'canonical_present': present['BEDS24_REFRESH_CREDENTIAL'],
            'secrets_present': present,
          }
          os.makedirs('aumara-control-tower/evidence', exist_ok=True)
          with open('aumara-control-tower/evidence/beds24-secret-presence.json', 'w') as f:
            json.dump(report, f, indent=2)
          print(json.dumps({
            'canonical_secret': report['canonical_secret'],
            'canonical_present': report['canonical_present'],
            'legacy_aliases_present': {
              k: v for k, v in present.items() if k != 'BEDS24_REFRESH_CREDENTIAL'
            },
          }, indent=2))
          PY
      - name: Commit sanitized report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aumara-control-tower/evidence/beds24-secret-presence.json
          git diff --cached --quiet || git commit -m 'Record Beds24 secret presence [skip ci]'
          git push
