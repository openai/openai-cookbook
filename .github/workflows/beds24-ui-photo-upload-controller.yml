name: AUMARA one-shot controller Beds24 UI photos

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  control:
    if: >-
      github.event.issue.title == 'AUMARA control: run Beds24 UI photo upload 324882' &&
      github.event.issue.user.login == 'elcidspain'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: beds24-ui-photo-upload.yml
      ORIGINAL_PUSH_SHA: 90670bb1f7d667bd5682ff2c41fcf1d3a79b701b
    steps:
      - name: Reuse successful push run or dispatch manual workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          target_workflow = os.environ["TARGET_WORKFLOW"]
          original_push_sha = os.environ["ORIGINAL_PUSH_SHA"]
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue_number = int(event["issue"]["number"])

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AUMARA-Beds24-UI-Controller/1.0",
          }

          def api_call(path: str, method: str = "GET", payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(f"{api}{path}", data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      if not raw:
                          return {}
                      return json.loads(raw.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {method} {path} returned HTTP {exc.code}: {raw[:500]}") from exc

          workflow_path = urllib.parse.quote(target_workflow, safe="")

          def list_runs() -> list[dict]:
              payload = api_call(
                  f"/repos/{repo}/actions/workflows/{workflow_path}/runs?branch=main&per_page=100"
              )
              return list(payload.get("workflow_runs", []))

          def wait_for_run(run_id: int, timeout_seconds: int = 1200) -> dict:
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  run = api_call(f"/repos/{repo}/actions/runs/{run_id}")
                  if run.get("status") == "completed":
                      return run
                  time.sleep(5)
              raise RuntimeError(f"Timed out waiting for workflow run {run_id}")

          report: dict[str, object] = {
              "target_workflow": target_workflow,
              "original_push_sha": original_push_sha,
              "controller_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "selected_source": None,
              "prior_push_run": None,
              "run": None,
              "jobs": [],
              "artifacts": [],
              "credentials_exposed": False,
              "diagnostic": None,
          }
          selected_run = None
          exit_code = 1

          try:
              runs = list_runs()
              prior = sorted(
                  [
                      run for run in runs
                      if run.get("head_sha") == original_push_sha and run.get("event") == "push"
                  ],
                  key=lambda run: run.get("created_at", ""),
                  reverse=True,
              )

              if prior:
                  candidate = prior[0]
                  if candidate.get("status") != "completed":
                      candidate = wait_for_run(int(candidate["id"]))
                  report["prior_push_run"] = {
                      key: candidate.get(key)
                      for key in (
                          "id", "run_number", "event", "head_sha", "status", "conclusion",
                          "created_at", "updated_at", "html_url"
                      )
                  }
                  if candidate.get("conclusion") == "success":
                      selected_run = candidate
                      report["selected_source"] = "existing_successful_push_run"

              if selected_run is None:
                  before_ids = {int(run["id"]) for run in runs if run.get("id") is not None}
                  dispatched_at = dt.datetime.now(dt.timezone.utc)
                  api_call(
                      f"/repos/{repo}/actions/workflows/{workflow_path}/dispatches",
                      method="POST",
                      payload={"ref": "main"},
                  )
                  report["selected_source"] = "new_workflow_dispatch"
                  deadline = time.time() + 180
                  discovered = None
                  while time.time() < deadline:
                      for run in list_runs():
                          run_id = int(run["id"])
                          if run_id in before_ids or run.get("event") != "workflow_dispatch":
                              continue
                          created_raw = str(run.get("created_at") or "")
                          try:
                              created_at = dt.datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
                          except ValueError:
                              created_at = dispatched_at
                          if created_at >= dispatched_at - dt.timedelta(seconds=10):
                              discovered = run
                              break
                      if discovered:
                          break
                      time.sleep(5)
                  if not discovered:
                      raise RuntimeError("workflow_dispatch was accepted but no new run appeared")
                  selected_run = wait_for_run(int(discovered["id"]))

              run_id = int(selected_run["id"])
              jobs_payload = api_call(f"/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")
              artifacts_payload = api_call(f"/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")

              report["run"] = {
                  key: selected_run.get(key)
                  for key in (
                      "id", "run_number", "event", "head_sha", "status", "conclusion",
                      "created_at", "updated_at", "html_url"
                  )
              }
              report["jobs"] = [
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "steps": [
                          {
                              "number": step.get("number"),
                              "name": step.get("name"),
                              "status": step.get("status"),
                              "conclusion": step.get("conclusion"),
                          }
                          for step in job.get("steps", [])
                      ],
                  }
                  for job in jobs_payload.get("jobs", [])
              ]
              report["artifacts"] = [
                  {
                      "id": artifact.get("id"),
                      "name": artifact.get("name"),
                      "size_in_bytes": artifact.get("size_in_bytes"),
                      "expired": artifact.get("expired"),
                      "created_at": artifact.get("created_at"),
                      "expires_at": artifact.get("expires_at"),
                  }
                  for artifact in artifacts_payload.get("artifacts", [])
              ]
              report["diagnostic"] = "SUCCESS" if selected_run.get("conclusion") == "success" else "TARGET_WORKFLOW_FAILED"
              exit_code = 0 if selected_run.get("conclusion") == "success" else 1
          except Exception as exc:
              report["diagnostic"] = str(exc)[:1000]
              exit_code = 1
          finally:
              body = (
                  "Beds24 UI photo upload control result (safe metadata only):\n\n```json\n"
                  + json.dumps(report, indent=2, sort_keys=True)
                  + "\n```"
              )
              api_call(
                  f"/repos/{repo}/issues/{issue_number}/comments",
                  method="POST",
                  payload={"body": body},
              )
              api_call(
                  f"/repos/{repo}/issues/{issue_number}",
                  method="PATCH",
                  payload={"state": "closed", "state_reason": "completed"},
              )

          raise SystemExit(exit_code)
          PY
