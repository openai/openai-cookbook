name: Beds24 UI photo upload AUMARA 324882
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-through-control-panel:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade gdown requests playwright
          playwright install --with-deps chromium
      - name: Download FULL_no_crop
        run: |
          mkdir -p ./download
          gdown --folder https://drive.google.com/drive/folders/1apf9xnyInfhZSI0NfNA3n0OhEgiN8HXS -O ./download || python3 -c "import gdown; gdown.download_folder('https://drive.google.com/drive/folders/1apf9xnyInfhZSI0NfNA3n0OhEgiN8HXS', output='./download')"
          ls ./download
      - name: Upload normal photos
        env:
          BEDS24_USERNAME: ${{ secrets.BEDS24_USERNAME }}
          BEDS24_PASSWORD: ${{ secrets.BEDS24_PASSWORD }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          from playwright.sync_api import sync_playwright

          def wait_for_first_visible(page, selectors, timeout_ms=30000):
              last_error = None
              for selector in selectors:
                  locator = page.locator(selector).first
                  try:
                      locator.wait_for(state="visible", timeout=timeout_ms)
                      return locator
                  except Exception as exc:
                      last_error = exc
              raise RuntimeError(
                  f"Unable to locate any visible selector from {selectors}"
              ) from last_error

          def click_first_available(page, selectors):
              for selector in selectors:
                  locator = page.locator(selector).first
                  if locator.count() > 0:
                      locator.click()
                      return
              raise RuntimeError(f"Unable to locate clickable selector from {selectors}")

          username=os.environ.get("BEDS24_USERNAME", "").strip()
          password=os.environ.get("BEDS24_PASSWORD", "").strip()
          if not username or not password:
              print("ERROR: BEDS24_USERNAME/BEDS24_PASSWORD secrets are missing")
              sys.exit(1)
          photos=sorted(glob.glob("./download/**/*FULL_no_crop.jpg", recursive=True))[:10]
          print(f"Photos {photos}")
          if not photos:
              print("ERROR: No FULL_no_crop.jpg files found")
              sys.exit(1)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              pg=b.new_page()
              pg.goto("https://beds24.com/control3.php")
              username_input = wait_for_first_visible(
                  pg,
                  [
                      "input[name='username']",
                      "input[name='email']",
                      "input[autocomplete='username']",
                      "input[type='email']",
                      "input[type='text']",
                  ],
              )
              password_input = wait_for_first_visible(
                  pg,
                  [
                      "input[name='password']",
                      "input[autocomplete='current-password']",
                      "input[type='password']",
                  ],
              )
              username_input.fill(username)
              password_input.fill(password)
              click_first_available(
                  pg,
                  [
                      "input[type='submit']",
                      "button[type='submit']",
                      "button:has-text('Log in')",
                      "button:has-text('Login')",
                      "button:has-text('Sign in')",
                  ],
              )
              pg.wait_for_load_state("networkidle")
              pg.goto("https://beds24.com/control3.php?pagetype=propcontent&propid=324882")
              pg.wait_for_timeout(3000)
              for ph in photos:
                  pg.set_input_files("input[type='file']", ph)
                  pg.wait_for_timeout(2000)
                  if pg.locator("button:has-text('Upload')").count()>0:
                      pg.click("button:has-text('Upload')")
                      pg.wait_for_load_state("networkidle", timeout=30000)
              pg.screenshot(path="after_upload.png")
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beds24-ui-${{ github.run_id }}
          path: "*.png"
