name: Deploy AUMARA to Nominalia v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aumara-site/**'
      - '.github/workflows/deploy-aumara-nominalia-v2.yml'

permissions:
  contents: read

concurrency:
  group: aumara-nominalia-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_HOST: ${{ secrets.NOMINALIA_FTP_HOST || vars.NOMINALIA_FTP_HOST || 'elcidt.ftp.tb-hosting.com' }}
      FTP_USER: ${{ secrets.NOMINALIA_FTP_USER || vars.NOMINALIA_FTP_USER || 'elcidspaincom@elcidspaincom' }}
      FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
      PREVIEW_DRIVE_ID: 1AIMUmuLsfidwjUhgMODGLEQYvMl4C_a3
      SOURCE_DRIVE_ID: 1L8oePUeTfB0EFXhyXW3J6R82LF2ob6tt
      FTP_TARGET: /www/aumara
      PAGE_URL: https://elcidspain.com/aumara/
      NODE01_URL: https://elcidspain.com/aumara/media/nodes/node-01.mp4
      NODE08_URL: https://elcidspain.com/aumara/media/nodes/node-08.mp4
      BEDS24_URL: https://beds24.com/booking2.php?propid=324882
      PAGE_MARKER: Walk the place before you choose the house.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deployment and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp ffmpeg
          python -m pip install --disable-pip-version-check gdown

      - name: Validate FTP credentials
        run: |
          test -n "$FTP_HOST" || { echo "NOMINALIA FTP host is empty (set NOMINALIA_FTP_HOST secret or variable)"; exit 1; }
          test -n "$FTP_USER" || { echo "NOMINALIA FTP user is empty (set NOMINALIA_FTP_USER secret or variable)"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "NOMINALIA FTP password secret is empty"; exit 1; }

      - name: Connect to confirmed FTP root
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; pwd; cls -la /; bye"

      - name: Prove remote write access in confirmed web folder
        shell: bash
        run: |
          set -euo pipefail
          printf 'AUMARA write test %s\n' "$(date -u +%FT%TZ)" > /tmp/aumara-write-test.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cd $FTP_TARGET; put /tmp/aumara-write-test.txt -o .aumara-write-test.txt; cls -l .aumara-write-test.txt; rm .aumara-write-test.txt; bye"

      - name: Download ready walkthrough preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aumara-site/media
          gdown "$PREVIEW_DRIVE_ID" -O aumara-site/media/AUMARA_walkthrough_preview_v1.mp4
          test -s aumara-site/media/AUMARA_walkthrough_preview_v1.mp4

      - name: Build interactive walkthrough points
        shell: bash
        run: |
          set -euo pipefail
          gdown "$SOURCE_DRIVE_ID" -O /tmp/IMG_8063.MOV
          test -s /tmp/IMG_8063.MOV
          chmod +x aumara-site/scripts/build_walkthrough_nodes.sh
          aumara-site/scripts/build_walkthrough_nodes.sh /tmp/IMG_8063.MOV aumara-site/media/nodes
          for n in 01 02 03 04 05 06 07 08; do test -s "aumara-site/media/nodes/node-$n.mp4"; done
          test -s aumara-site/media/nodes/manifest.json

      - name: Upload complete AUMARA site
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; mirror --reverse --verbose --parallel=2 --no-perms --exclude-glob scripts/ ./aumara-site/ $FTP_TARGET/; bye"

      - name: Verify uploaded interactive files on FTP
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cls -l $FTP_TARGET/index.html; cls -l $FTP_TARGET/media/nodes/node-01.mp4; cls -l $FTP_TARGET/media/nodes/node-08.mp4; cls -l $FTP_TARGET/media/nodes/manifest.json; bye"

      - name: Verify exact AUMARA release and both ends of walkthrough
        id: external
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 45 --retry 5 --retry-delay 5 "$PAGE_URL" -o /tmp/aumara-live.html
          page_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 45 --retry 3 --retry-delay 5 "$PAGE_URL")"
          node01_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 60 --retry 4 --retry-delay 5 -r 0-2047 "$NODE01_URL")"
          node08_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 60 --retry 4 --retry-delay 5 -r 0-2047 "$NODE08_URL")"
          echo "page_code=$page_code" >> "$GITHUB_OUTPUT"
          echo "node01_code=$node01_code" >> "$GITHUB_OUTPUT"
          echo "node08_code=$node08_code" >> "$GITHUB_OUTPUT"
          echo "Public AUMARA HTTP: $page_code"
          echo "Walkthrough node 01 HTTP: $node01_code"
          echo "Walkthrough node 08 HTTP: $node08_code"
          test "$page_code" = "200"
          grep -Fq "$PAGE_MARKER" /tmp/aumara-live.html
          grep -Fq 'media/nodes/node-01.mp4' /tmp/aumara-live.html
          grep -Fq 'https://beds24.com/booking2.php?propid=324882' /tmp/aumara-live.html
          case "$node01_code" in 200|206) ;; *) exit 1 ;; esac
          case "$node08_code" in 200|206) ;; *) exit 1 ;; esac

      - name: Verify Beds24 direct booking endpoint
        id: beds24
        shell: bash
        run: |
          set -euo pipefail
          beds24_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 45 --retry 3 --retry-delay 4 "$BEDS24_URL")"
          echo "code=$beds24_code" >> "$GITHUB_OUTPUT"
          echo "Beds24 direct booking HTTP: $beds24_code"
          case "$beds24_code" in 200|201|202|204|301|302|303|307|308) ;; *) exit 1 ;; esac

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AUMARA Nominalia deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- FTP target: \`${FTP_TARGET}\`"
            echo "- Main page HTTP: \`${{ steps.external.outputs.page_code || 'not_run' }}\`"
            echo "- Walkthrough node 01 HTTP: \`${{ steps.external.outputs.node01_code || 'not_run' }}\`"
            echo "- Walkthrough node 08 HTTP: \`${{ steps.external.outputs.node08_code || 'not_run' }}\`"
            echo "- Beds24 endpoint HTTP: \`${{ steps.beds24.outputs.code || 'not_run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
