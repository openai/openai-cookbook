name: Deploy AUMARA to Nominalia v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aumara-site/index.html'
      - '.github/workflows/deploy-aumara-nominalia-v2.yml'

permissions:
  contents: read

concurrency:
  group: aumara-nominalia-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_HOST: elcidt.ftp.tb-hosting.com
      FTP_USER: elcidspaincom@elcidspaincom
      FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
      FTP_TARGET: /www/aumara
      PAGE_URL: https://elcidspain.com/aumara/
      BEDS24_URL: https://beds24.com/booking2.php?propid=324882
      PAGE_MARKER: Some places give you more. AUMARA gives you back to yourself.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validate FTP secret
        run: |
          test -n "$FTP_PASSWORD" || { echo "NOMINALIA FTP password secret is empty"; exit 1; }

      - name: Publish AUMARA brand-first page
        shell: bash
        run: |
          set -euo pipefail
          test -s aumara-site/index.html
          grep -Fq "$PAGE_MARKER" aumara-site/index.html
          grep -Fq "$BEDS24_URL" aumara-site/index.html
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cd $FTP_TARGET; put aumara-site/index.html -o index.html; cls -l index.html; bye"

      - name: Verify AUMARA production page
        id: external
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 45 --retry 5 --retry-delay 5 "$PAGE_URL" -o /tmp/aumara-live.html
          page_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 45 --retry 3 --retry-delay 5 "$PAGE_URL")"
          bytes="$(wc -c < /tmp/aumara-live.html | tr -d ' ')"
          echo "page_code=$page_code" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Public AUMARA HTTP: $page_code"
          echo "Public AUMARA bytes: $bytes"
          test "$page_code" = "200"
          grep -Fq "$PAGE_MARKER" /tmp/aumara-live.html
          grep -Fq "$BEDS24_URL" /tmp/aumara-live.html
          ! grep -Fq 'media/nodes/node-01.mp4' /tmp/aumara-live.html
          test "$bytes" -gt 10000

      - name: Verify Beds24 direct booking endpoint
        id: beds24
        shell: bash
        run: |
          set -euo pipefail
          beds24_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 45 --retry 3 --retry-delay 4 "$BEDS24_URL")"
          echo "code=$beds24_code" >> "$GITHUB_OUTPUT"
          echo "Beds24 direct booking HTTP: $beds24_code"
          case "$beds24_code" in 200|201|202|204|301|302|303|307|308) ;; *) exit 1 ;; esac

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AUMARA Nominalia deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- FTP target: \`${FTP_TARGET}/index.html\`"
            echo "- Main page HTTP: \`${{ steps.external.outputs.page_code || 'not_run' }}\`"
            echo "- Main page bytes: \`${{ steps.external.outputs.bytes || 'not_run' }}\`"
            echo "- Beds24 endpoint HTTP: \`${{ steps.beds24.outputs.code || 'not_run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
