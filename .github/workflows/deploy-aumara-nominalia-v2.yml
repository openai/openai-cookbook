name: Deploy AUMARA to Nominalia v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aumara-site/**'

permissions:
  contents: read

concurrency:
  group: aumara-nominalia-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_HOST: elcidt.ftp.tb-hosting.com
      FTP_USER: elcidspaincom@elcidspaincom
      FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
      PREVIEW_DRIVE_ID: 1AIMUmuLsfidwjUhgMODGLEQYvMl4C_a3
      FTP_TARGET: /www/aumara
      PAGE_URL: https://elcidspain.com/aumara/video-preview.html
      VIDEO_URL: https://elcidspain.com/aumara/media/AUMARA_walkthrough_preview_v1.mp4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          python -m pip install --disable-pip-version-check gdown

      - name: Validate FTP secret
        run: |
          test -n "$FTP_PASSWORD" || { echo "NOMINALIA FTP password secret is empty"; exit 1; }

      - name: Connect to confirmed FTP root
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; pwd; cls -la /; bye"

      - name: Prove remote write access in confirmed web folder
        shell: bash
        run: |
          set -euo pipefail
          printf 'AUMARA write test %s\n' "$(date -u +%FT%TZ)" > /tmp/aumara-write-test.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cd $FTP_TARGET; put /tmp/aumara-write-test.txt -o .aumara-write-test.txt; cls -l .aumara-write-test.txt; rm .aumara-write-test.txt; bye"

      - name: Download ready walkthrough MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aumara-site/media
          gdown "$PREVIEW_DRIVE_ID" -O aumara-site/media/AUMARA_walkthrough_preview_v1.mp4
          test -s aumara-site/media/AUMARA_walkthrough_preview_v1.mp4
          test "$(stat -c%s aumara-site/media/AUMARA_walkthrough_preview_v1.mp4)" -gt 5000000
          file aumara-site/media/AUMARA_walkthrough_preview_v1.mp4

      - name: Upload AUMARA site and video
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; mirror --reverse --verbose --parallel=2 --no-perms --exclude-glob scripts/ ./aumara-site/ $FTP_TARGET/; bye"

      - name: Verify uploaded files on FTP
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cls -l $FTP_TARGET/video-preview.html; cls -l $FTP_TARGET/media/AUMARA_walkthrough_preview_v1.mp4; bye"

      - name: Verify public page and MP4
        id: external
        shell: bash
        run: |
          set -euo pipefail
          page_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "$PAGE_URL")"
          video_code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 60 --retry 3 --retry-delay 5 -r 0-1023 "$VIDEO_URL")"
          echo "page_code=$page_code" >> "$GITHUB_OUTPUT"
          echo "video_code=$video_code" >> "$GITHUB_OUTPUT"
          echo "Public page HTTP: $page_code"
          echo "Public video HTTP: $video_code"
          test "$page_code" = "200"
          case "$video_code" in 200|206) ;; *) exit 1 ;; esac

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AUMARA Nominalia deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- FTP target: \`${FTP_TARGET}\`"
            echo "- Page HTTP: \`${{ steps.external.outputs.page_code || 'not_run' }}\`"
            echo "- Video HTTP: \`${{ steps.external.outputs.video_code || 'not_run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
