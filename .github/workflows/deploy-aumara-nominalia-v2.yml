name: Deploy AUMARA to Nominalia v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aumara-site/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_HOST: elcidt.ftp.tb-hosting.com
      FTP_USER: elcidspaincom@elcidspaincom
      FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
      PREVIEW_DRIVE_ID: 1AIMUmuLsfidwjUhgMODGLEQYvMl4C_a3
      FTP_TARGET: /aumara
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          python -m pip install --disable-pip-version-check gdown

      - name: Validate FTP secret
        run: |
          test -n "$FTP_PASSWORD" || { echo "NOMINALIA FTP password secret is empty"; exit 1; }

      - name: Connect to confirmed FTP root
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; pwd; cls -la /; bye"

      - name: Prove remote write access in AUMARA folder
        shell: bash
        run: |
          set -euo pipefail
          printf 'AUMARA write test %s\n' "$(date -u +%FT%TZ)" > /tmp/aumara-write-test.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; mkdir -p $FTP_TARGET; cd $FTP_TARGET; put /tmp/aumara-write-test.txt -o .aumara-write-test.txt; cls -l .aumara-write-test.txt; rm .aumara-write-test.txt; bye"

      - name: Download ready walkthrough MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aumara-site/media
          gdown "$PREVIEW_DRIVE_ID" -O aumara-site/media/AUMARA_walkthrough_preview_v1.mp4
          test -s aumara-site/media/AUMARA_walkthrough_preview_v1.mp4
          test "$(stat -c%s aumara-site/media/AUMARA_walkthrough_preview_v1.mp4)" -gt 5000000
          file aumara-site/media/AUMARA_walkthrough_preview_v1.mp4

      - name: Upload AUMARA site and video
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; mirror --reverse --verbose --parallel=2 --no-perms --exclude-glob scripts/ ./aumara-site/ $FTP_TARGET/; bye"

      - name: Verify uploaded files
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cls -l $FTP_TARGET/video-preview.html; cls -l $FTP_TARGET/media/AUMARA_walkthrough_preview_v1.mp4; bye"

      - name: External URL check
        continue-on-error: true
        run: |
          curl -I --max-time 30 --retry 3 --retry-delay 5 https://elcidspain.com/aumara/video-preview.html
