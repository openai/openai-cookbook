name: Deploy AUMARA to Nominalia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aumara-site/**'
      - '.github/workflows/deploy-aumara-nominalia.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Nominalia FTP secret
        id: ftp_check
        shell: bash
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Nominalia FTP password was found in the environment. Production was not changed."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy AUMARA site to Nominalia FTP
        if: steps.ftp_check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: elcids.ftp.tb-hosting.com
          username: elcidspaincom@elcidspaincom
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./aumara-site/
          server-dir: /www/aumara/
          dangerous-clean-slate: false
