name: Deploy AUMARA to Nominalia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aumara-site/**'
      - '.github/workflows/deploy-aumara-nominalia.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_USERNAME: elcidspaincom@elcidspaincom
      FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose Nominalia FTP endpoints without exposing the password
        id: ftp_diag
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          RESULT_FILE="diagnostics/nominalia-ftp.txt"
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "username=$FTP_USERNAME"
          } > "$RESULT_FILE"

          if [ -z "$FTP_PASSWORD" ]; then
            echo "secret=missing" >> "$RESULT_FILE"
            echo "classification=SECRET_MISSING" >> "$RESULT_FILE"
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Nominalia FTP secret is missing"
            exit 0
          fi
          echo "secret=present" >> "$RESULT_FILE"

          CANDIDATES=(
            "elcids.ftp.tb-hosting.com"
            "elcidt.ftp.tb-hosting.com"
            "213.158.94.137"
          )

          SELECTED=""
          for HOST in "${CANDIDATES[@]}"; do
            SAFE_LABEL=$(echo "$HOST" | tr '.-' '__')
            if [[ "$HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "candidate_${SAFE_LABEL}_dns=ip_literal" >> "$RESULT_FILE"
            elif getent ahostsv4 "$HOST" > "/tmp/dns_${SAFE_LABEL}.txt" 2>/dev/null; then
              echo "candidate_${SAFE_LABEL}_dns=ok" >> "$RESULT_FILE"
              head -n 1 "/tmp/dns_${SAFE_LABEL}.txt" | awk -v p="candidate_${SAFE_LABEL}_resolved_ip=" '{print p $1}' >> "$RESULT_FILE"
            else
              echo "candidate_${SAFE_LABEL}_dns=failed" >> "$RESULT_FILE"
              continue
            fi

            curl --silent --show-error --fail --ftp-pasv --connect-timeout 15 --max-time 35 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$HOST/" --list-only \
              >"/tmp/root_${SAFE_LABEL}_out.txt" 2>"/tmp/root_${SAFE_LABEL}_err.txt"
            CODE=$?
            echo "candidate_${SAFE_LABEL}_root_curl_code=$CODE" >> "$RESULT_FILE"
            if [ "$CODE" -eq 0 ]; then
              echo "candidate_${SAFE_LABEL}_root=ok" >> "$RESULT_FILE"
              SELECTED="$HOST"
              break
            else
              ERR=$(tail -n 1 "/tmp/root_${SAFE_LABEL}_err.txt" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')
              echo "candidate_${SAFE_LABEL}_root=failed" >> "$RESULT_FILE"
              echo "candidate_${SAFE_LABEL}_error=$ERR" >> "$RESULT_FILE"
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "classification=NO_WORKING_FTP_ENDPOINT_WITH_CURRENT_USERNAME" >> "$RESULT_FILE"
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::The GitHub secret is present. None of the known Nominalia FTP endpoints accepted the current FTP username/account."
            exit 0
          fi

          echo "selected_server=$SELECTED" >> "$RESULT_FILE"
          echo "server=$SELECTED" >> "$GITHUB_OUTPUT"

          test_path() {
            LABEL="$1"
            URL="$2"
            curl --silent --show-error --fail --ftp-pasv --connect-timeout 15 --max-time 35 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" "$URL" --list-only \
              >"/tmp/path_${LABEL}_out.txt" 2>"/tmp/path_${LABEL}_err.txt"
            CODE=$?
            echo "${LABEL}_curl_code=$CODE" >> "$RESULT_FILE"
            if [ "$CODE" -eq 0 ]; then
              echo "${LABEL}=ok" >> "$RESULT_FILE"
            else
              ERR=$(tail -n 1 "/tmp/path_${LABEL}_err.txt" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')
              echo "${LABEL}=failed" >> "$RESULT_FILE"
              echo "${LABEL}_error=$ERR" >> "$RESULT_FILE"
            fi
            return "$CODE"
          }

          test_path www "ftp://$SELECTED/www/"
          WWW_CODE=$?
          test_path aumara "ftp://$SELECTED/www/aumara/"
          AUMARA_CODE=$?

          if [ "$AUMARA_CODE" -eq 0 ]; then
            echo "classification=FTP_OK_WWW_AUMARA_EXISTS" >> "$RESULT_FILE"
            echo "server_dir=/www/aumara/" >> "$RESULT_FILE"
            echo "server_dir=/www/aumara/" >> "$GITHUB_OUTPUT"
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$WWW_CODE" -eq 0 ]; then
            echo "classification=FTP_OK_WWW_EXISTS_AUMARA_MISSING" >> "$RESULT_FILE"
            echo "server_dir=/www/aumara/" >> "$RESULT_FILE"
            echo "server_dir=/www/aumara/" >> "$GITHUB_OUTPUT"
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            test_path root_aumara "ftp://$SELECTED/aumara/"
            ROOT_AUMARA_CODE=$?
            if [ "$ROOT_AUMARA_CODE" -eq 0 ]; then
              echo "classification=FTP_OK_ROOT_AUMARA_EXISTS" >> "$RESULT_FILE"
              echo "server_dir=/aumara/" >> "$RESULT_FILE"
              echo "server_dir=/aumara/" >> "$GITHUB_OUTPUT"
              echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "classification=FTP_LOGIN_OK_REMOTE_PATH_UNVERIFIED" >> "$RESULT_FILE"
              echo "server_dir=unverified" >> "$RESULT_FILE"
              echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
              echo "::error::FTP login works, but neither /www/aumara/ nor /aumara/ is a verified remote path"
            fi
          fi

      - name: Save sanitized FTP diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name "AUMARA Deploy Bot"
          git config user.email "elcidspain@gmail.com"
          git add diagnostics/nominalia-ftp.txt
          git commit -m "Record sanitized Nominalia FTP diagnostic [skip ci]" || exit 0
          git push

      - name: Deploy AUMARA site to Nominalia FTP
        if: steps.ftp_diag.outputs.deploy_ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_diag.outputs.server }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./aumara-site/
          server-dir: ${{ steps.ftp_diag.outputs.server_dir }}
          dangerous-clean-slate: false
