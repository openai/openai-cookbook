name: Deploy AUMARA to Nominalia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aumara-site/**'
      - '.github/workflows/deploy-aumara-nominalia.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy AUMARA site to Nominalia FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: elcidt.ftp.tb-hosting.com
          username: elcidspaincom@elcidspaincom
          password: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./aumara-site/
          server-dir: /www/aumara/
          dangerous-clean-slate: false
