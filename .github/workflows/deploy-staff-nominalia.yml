name: Deploy AUMARA Staff to Nominalia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staff/**'
      - '.github/workflows/deploy-staff-nominalia.yml'

permissions:
  contents: read

concurrency:
  group: aumara-staff-nominalia-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: NOMINALIA_FTP_PASSWORD
    env:
      FTP_HOST: ${{ secrets.NOMINALIA_FTP_HOST || vars.NOMINALIA_FTP_HOST || 'elcidt.ftp.tb-hosting.com' }}
      FTP_USER: ${{ secrets.NOMINALIA_FTP_USER || vars.NOMINALIA_FTP_USER || 'elcidspaincom@elcidspaincom' }}
      FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
      FTP_TARGET: /www/staff
      PAGE_URL: https://elcidspain.com/staff/
      MANIFEST_URL: https://elcidspain.com/staff/manifest.webmanifest
      SW_URL: https://elcidspain.com/staff/sw.js
      APP_URL: https://elcidspain.com/staff/app.js
      BOOTFIX_URL: https://elcidspain.com/staff/bootfix231.js
      PATCH_URL: https://elcidspain.com/staff/patch.js
      LEGACY_URL: https://elcidspain.com/staff/legacy.js
      PLANNER_URL: https://elcidspain.com/staff/planner23.js
      STYLE_URL: https://elcidspain.com/staff/styles.css

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA source
        shell: bash
        run: |
          set -euo pipefail
          node --check staff/app.js
          node --check staff/bootfix231.js
          node --check staff/patch.js
          node --check staff/legacy.js
          node --check staff/planner23.js
          node --check staff/sw.js
          grep -Fq 'AUMARA Staff' staff/index.html
          grep -Fq 'PWA 2.3.1' staff/index.html
          grep -Fq '/staff/bootfix231.js?v=231' staff/index.html
          grep -Fq '/staff/planner23.js?v=231' staff/index.html
          grep -Fq "aumara-staff-pwa-v2.3.1" staff/sw.js
          grep -Fq '/staff/bootfix231.js?v=231' staff/sw.js
          grep -Fq '/staff/planner23.js?v=231' staff/sw.js
          grep -Fq 'v23-grid' staff/planner23.js
          grep -Fq 'pointerdown' staff/planner23.js
          grep -Fq "tab('schedule','Мой график')" staff/planner23.js
          grep -Fq "tab('all','Все смены')" staff/planner23.js
          grep -Fq "tab('requests','Запросы')" staff/planner23.js
          grep -Fq "rpc('createShiftsBatch'" staff/planner23.js
          grep -Fq "rpc('submitRequest'" staff/planner23.js
          grep -Fq "rpc('getChat'" staff/legacy.js
          grep -Fq "rpc('getAuditLog'" staff/legacy.js
          grep -Fq "rpc('listMyDevices'" staff/legacy.js
          grep -Fq '"start_url": "/staff/"' staff/manifest.webmanifest
          test -s staff/styles.css
          test -s staff/icon.svg

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validate deployment credentials
        run: |
          test -n "$FTP_HOST" || { echo "Nominalia FTP host is empty (set NOMINALIA_FTP_HOST secret or variable)"; exit 1; }
          test -n "$FTP_USER" || { echo "Nominalia FTP user is empty (set NOMINALIA_FTP_USER secret or variable)"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Nominalia FTP password secret is empty"; exit 1; }

      - name: Connect to Nominalia
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; pwd; cls -la /www; bye"

      - name: Verify Staff web root
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cd $FTP_TARGET; pwd; bye"

      - name: Upload AUMARA Staff PWA
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; mirror --reverse --delete --verbose --parallel=2 --no-perms ./staff/ $FTP_TARGET/; bye"

      - name: Verify files on FTP
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-allow no; set ftp:passive-mode yes; cls -l $FTP_TARGET/index.html; cls -l $FTP_TARGET/app.js; cls -l $FTP_TARGET/bootfix231.js; cls -l $FTP_TARGET/patch.js; cls -l $FTP_TARGET/legacy.js; cls -l $FTP_TARGET/planner23.js; cls -l $FTP_TARGET/styles.css; cls -l $FTP_TARGET/manifest.webmanifest; cls -l $FTP_TARGET/sw.js; cls -l $FTP_TARGET/icon.svg; bye"

      - name: Verify public PWA
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page_code="$(curl -sS -L -o /tmp/staff.html -w '%{http_code}' --max-time 45 --retry 5 --retry-delay 3 "$PAGE_URL")"
          manifest_code="$(curl -sS -L -o /tmp/manifest.webmanifest -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$MANIFEST_URL")"
          sw_code="$(curl -sS -L -o /tmp/sw.js -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$SW_URL")"
          app_code="$(curl -sS -L -o /tmp/app.js -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$APP_URL")"
          bootfix_code="$(curl -sS -L -o /tmp/bootfix231.js -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$BOOTFIX_URL")"
          patch_code="$(curl -sS -L -o /tmp/patch.js -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$PATCH_URL")"
          legacy_code="$(curl -sS -L -o /tmp/legacy.js -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$LEGACY_URL")"
          planner_code="$(curl -sS -L -o /tmp/planner23.js -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$PLANNER_URL")"
          style_code="$(curl -sS -L -o /tmp/styles.css -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 3 "$STYLE_URL")"
          echo "page_code=$page_code" >> "$GITHUB_OUTPUT"
          echo "manifest_code=$manifest_code" >> "$GITHUB_OUTPUT"
          echo "sw_code=$sw_code" >> "$GITHUB_OUTPUT"
          echo "app_code=$app_code" >> "$GITHUB_OUTPUT"
          echo "bootfix_code=$bootfix_code" >> "$GITHUB_OUTPUT"
          echo "patch_code=$patch_code" >> "$GITHUB_OUTPUT"
          echo "legacy_code=$legacy_code" >> "$GITHUB_OUTPUT"
          echo "planner_code=$planner_code" >> "$GITHUB_OUTPUT"
          echo "style_code=$style_code" >> "$GITHUB_OUTPUT"
          test "$page_code" = "200"
          test "$manifest_code" = "200"
          test "$sw_code" = "200"
          test "$app_code" = "200"
          test "$bootfix_code" = "200"
          test "$patch_code" = "200"
          test "$legacy_code" = "200"
          test "$planner_code" = "200"
          test "$style_code" = "200"
          grep -Fq 'PWA 2.3.1' /tmp/staff.html
          grep -Fq '/staff/bootfix231.js?v=231' /tmp/staff.html
          grep -Fq '/staff/planner23.js?v=231' /tmp/staff.html
          grep -Fq 'aumara-staff-api' /tmp/app.js
          grep -Fq 'BOOT_TIMEOUT_MS=12000' /tmp/bootfix231.js
          grep -Fq 'saveReview2' /tmp/patch.js
          grep -Fq "rpc('getChat'" /tmp/legacy.js
          grep -Fq 'v23-grid' /tmp/planner23.js
          grep -Fq 'pointerdown' /tmp/planner23.js
          grep -Fq "rpc('createShiftsBatch'" /tmp/planner23.js
          grep -Fq "rpc('submitRequest'" /tmp/planner23.js
          grep -Fq "aumara-staff-pwa-v2.3.1" /tmp/sw.js
          grep -Fq '"start_url": "/staff/"' /tmp/manifest.webmanifest
          node --check /tmp/app.js
          node --check /tmp/bootfix231.js
          node --check /tmp/patch.js
          node --check /tmp/legacy.js
          node --check /tmp/planner23.js
          node --check /tmp/sw.js

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AUMARA Staff Nominalia deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- FTP target: \`${FTP_TARGET}\`"
            echo "- Page HTTP: \`${{ steps.verify.outputs.page_code || 'not_run' }}\`"
            echo "- App JS HTTP: \`${{ steps.verify.outputs.app_code || 'not_run' }}\`"
            echo "- Bootstrap JS HTTP: \`${{ steps.verify.outputs.bootfix_code || 'not_run' }}\`"
            echo "- Patch JS HTTP: \`${{ steps.verify.outputs.patch_code || 'not_run' }}\`"
            echo "- Legacy JS HTTP: \`${{ steps.verify.outputs.legacy_code || 'not_run' }}\`"
            echo "- Planner JS HTTP: \`${{ steps.verify.outputs.planner_code || 'not_run' }}\`"
            echo "- Styles HTTP: \`${{ steps.verify.outputs.style_code || 'not_run' }}\`"
            echo "- Manifest HTTP: \`${{ steps.verify.outputs.manifest_code || 'not_run' }}\`"
            echo "- Service worker HTTP: \`${{ steps.verify.outputs.sw_code || 'not_run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
