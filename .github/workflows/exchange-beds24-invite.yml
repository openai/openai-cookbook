name: Exchange Beds24 invite code

on:
  workflow_dispatch:
    inputs:
      invite_code:
        description: "One-time Beds24 invite code from SETTINGS > MARKETPLACE > API (expires in 24h)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/beds24-ui-photo-upload.yml"

permissions:
  contents: read

concurrency:
  group: beds24-invite-exchange
  cancel-in-progress: true

jobs:
  exchange:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'support invite ') }}
    name: Exchange invite for refreshToken
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exchange one-time invite and write refresh token
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          event_path = pathlib.Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))
          invite = str((event.get("inputs") or {}).get("invite_code") or "").strip()
          if not invite:
              message = str(((event.get("head_commit") or {}).get("message")) or "")
              match = re.search(r"support invite\s+([A-Za-z0-9-]+)", message)
              invite = match.group(1) if match else ""

          if not invite:
              print("ERROR: No Beds24 invite code found in workflow input or commit message", file=sys.stderr)
              raise SystemExit(1)

          print(f"::add-mask::{invite}")

          def call_setup(url: str):
              with tempfile.NamedTemporaryFile(delete=False) as handle:
                  body_path = handle.name
              try:
                  process = subprocess.run(
                      [
                          "curl", "-sS", "-o", body_path, "-w", "%{http_code}",
                          "-H", f"code: {invite}", url,
                      ],
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  if process.returncode != 0:
                      raise RuntimeError(f"curl failed with exit code {process.returncode}")
                  status = int((process.stdout or "0").strip() or "0")
                  body = pathlib.Path(body_path).read_text(encoding="utf-8", errors="replace")
                  return status, body
              finally:
                  pathlib.Path(body_path).unlink(missing_ok=True)

          primary = "https://beds24.com/api/v2/authentication/setup"
          fallback = "https://api.beds24.com/v2/authentication/setup"
          status, raw = call_setup(primary)
          used_url = primary
          if status == 404:
              status, raw = call_setup(fallback)
              used_url = fallback

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              print(f"ERROR: Beds24 returned non-JSON response (HTTP {status})", file=sys.stderr)
              raise SystemExit(1)

          token = str(payload.get("token") or "")
          refresh = str(payload.get("refreshToken") or "")
          if token:
              print(f"::add-mask::{token}")
          if refresh:
              print(f"::add-mask::{refresh}")

          if not (200 <= status < 300) or not token or not refresh:
              safe_keys = sorted(str(key) for key in payload.keys()) if isinstance(payload, dict) else []
              print(
                  json.dumps(
                      {
                          "status": "FAILED",
                          "http_status": status,
                          "endpoint": used_url,
                          "response_keys": safe_keys,
                          "has_token": bool(token),
                          "has_refresh_token": bool(refresh),
                      }
                  ),
                  file=sys.stderr,
              )
              raise SystemExit(1)

          output_dir = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "beds24-exchange"
          output_dir.mkdir(parents=True, exist_ok=True)
          output_file = output_dir / "beds24-refresh-token.txt"
          output_file.write_text(refresh + "\n", encoding="utf-8")

          print(
              json.dumps(
                  {
                      "status": "SUCCESS",
                      "http_status": status,
                      "endpoint": used_url,
                      "token_prefix": token[:10],
                      "artifact": "beds24-refresh-token",
                      "file": "beds24-refresh-token.txt",
                  }
              )
          )
          PY

      - name: Upload refresh token artifact
        uses: actions/upload-artifact@v4
        with:
          name: beds24-refresh-token
          path: ${{ runner.temp }}/beds24-exchange/beds24-refresh-token.txt
          if-no-files-found: error
          retention-days: 3
