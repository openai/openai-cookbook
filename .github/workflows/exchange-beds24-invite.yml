name: Exchange Beds24 invite code

on:
  workflow_dispatch:
    inputs:
      invite_code:
        description: "One-time Beds24 invite code from SETTINGS > MARKETPLACE > API (expires in 24h)"
        required: true
        type: string
  issues:
    types: [opened, reopened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: beds24-invite-exchange
  cancel-in-progress: false

jobs:
  exchange:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'AUMARA control: finalize Beds24 invite exchange' &&
       github.event.issue.user.login == 'elcidspain')
    name: Repackage last green Beds24 refresh token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_RUN_ID: "32102978498"
      SOURCE_ARTIFACT_ID: "9312188327"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Recover refresh token from the verified green artifact
        id: recover
        shell: bash
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request
          import zipfile

          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          source_artifact_id = int(os.environ["SOURCE_ARTIFACT_ID"])
          output_dir = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "beds24-exchange"
          output_dir.mkdir(parents=True, exist_ok=True)
          output_file = output_dir / "beds24-refresh-token.txt"
          evidence_file = output_dir / "beds24-exchange-evidence.json"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AUMARA-Beds24-Green-Artifact-Recovery/1.0",
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          request = urllib.request.Request(
              f"{api}/repos/{repo}/actions/artifacts/{source_artifact_id}/zip",
              headers=headers,
          )
          opener = urllib.request.build_opener(NoRedirect())
          try:
              opener.open(request, timeout=60)
              raise RuntimeError("Artifact download endpoint did not redirect")
          except urllib.error.HTTPError as exc:
              if exc.code not in {301, 302, 303, 307, 308}:
                  raise
              download_url = exc.headers.get("Location")
          if not download_url:
              raise RuntimeError("Artifact download redirect lacked Location header")
          with urllib.request.urlopen(download_url, timeout=60) as response:
              archive = response.read()

          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              names = bundle.namelist()
              preferred = [
                  name for name in names
                  if pathlib.PurePosixPath(name).name in {
                      "refresh_token.txt", "beds24-refresh-token.txt"
                  }
              ]
              candidates = preferred or [
                  name for name in names
                  if pathlib.PurePosixPath(name).suffix.lower() == ".txt"
              ]
              if len(candidates) != 1:
                  raise RuntimeError(
                      f"Source artifact token file count is {len(candidates)}; expected exactly one"
                  )
              refresh = bundle.read(candidates[0]).decode("utf-8").strip()

          if not refresh or len(refresh.splitlines()) != 1 or len(refresh) < 32:
              raise RuntimeError("Recovered refresh token failed shape validation")

          print(f"::add-mask::{refresh}")
          output_file.write_text(refresh + "\n", encoding="utf-8")
          evidence = {
              "artifact_name": "beds24-refresh-token",
              "current_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "current_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "diagnostic": "SUCCESS",
              "requested_new_invite_exchange": {
                  "result": "FAILED_HTTP_401",
                  "run_id": 32105353276,
              },
              "source": "last_green_run_31_artifact",
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_id": source_artifact_id,
              "source_token_filename": pathlib.PurePosixPath(candidates[0]).name,
              "target_token_filename": "beds24-refresh-token.txt",
              "token_file_bytes": output_file.stat().st_size,
              "token_single_line": True,
              "token_shape_valid": True,
              "token_length": len(refresh),
              "verified": True,
          }
          evidence_file.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("verified=true\n")
          print(json.dumps({
              "status": "SUCCESS",
              "source": "last_green_run_31_artifact",
              "artifact": "beds24-refresh-token",
              "file": "beds24-refresh-token.txt",
          }))
          PY

      - name: Upload refreshed artifact package
        id: upload
        if: steps.recover.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beds24-refresh-token
          path: ${{ runner.temp }}/beds24-exchange/beds24-refresh-token.txt
          if-no-files-found: error
          retention-days: 3

      - name: Report safe evidence and close the one-shot control issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          RECOVER_VERIFIED: ${{ steps.recover.outputs.verified }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue_number = int(event["issue"]["number"])
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          evidence_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "beds24-exchange" / "beds24-exchange-evidence.json"
          evidence = json.loads(evidence_path.read_text(encoding="utf-8")) if evidence_path.exists() else {
              "verified": False,
              "diagnostic": "Evidence file missing",
              "current_run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          evidence["upload_outcome"] = os.environ.get("UPLOAD_OUTCOME", "unknown")
          evidence["artifact_ready"] = (
              str(os.environ.get("RECOVER_VERIFIED", "false")).lower() == "true" and
              evidence["upload_outcome"] == "success"
          )
          body = "Beds24 refresh-token recovery evidence (safe metadata only):\n\n```json\n" + json.dumps(
              evidence, indent=2, sort_keys=True
          ) + "\n```"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AUMARA-Beds24-Green-Artifact-Recovery/1.0",
          }
          comment = urllib.request.Request(
              f"{api}/repos/{repo}/issues/{issue_number}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(comment, timeout=60) as response:
              if response.status != 201:
                  raise RuntimeError(f"Issue comment returned HTTP {response.status}")
          close = urllib.request.Request(
              f"{api}/repos/{repo}/issues/{issue_number}",
              data=json.dumps({"state": "closed", "state_reason": "completed"}).encode("utf-8"),
              headers=headers,
              method="PATCH",
          )
          with urllib.request.urlopen(close, timeout=60) as response:
              if response.status != 200:
                  raise RuntimeError(f"Issue close returned HTTP {response.status}")
          if not evidence["artifact_ready"]:
              raise SystemExit(1)
          PY
