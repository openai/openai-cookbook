name: Exchange Beds24 invite code

on:
  workflow_dispatch:
    inputs:
      invite_code:
        description: "One-time Beds24 invite code from SETTINGS > MARKETPLACE > API (expires in 24h)"
        required: true
        type: string
  issues:
    types: [opened, reopened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: beds24-invite-exchange
  cancel-in-progress: false

jobs:
  exchange:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'AUMARA control: finalize Beds24 invite exchange' &&
       github.event.issue.user.login == 'elcidspain')
    name: Inventory Beds24 exchange artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Inventory safe workflow and artifact metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue_number = int(event["issue"]["number"])
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AUMARA-Beds24-Artifact-Inventory/1.0",
          }

          def request_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          workflow = urllib.parse.quote("exchange-beds24-invite.yml", safe="")
          runs_raw = request_json(
              f"{api}/repos/{repo}/actions/workflows/{workflow}/runs?per_page=100"
          ).get("workflow_runs", [])
          artifacts_raw = request_json(
              f"{api}/repos/{repo}/actions/artifacts?name=beds24-refresh-token&per_page=100"
          ).get("artifacts", [])

          runs = []
          for run in runs_raw[:40]:
              runs.append({
                  "id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "event": run.get("event"),
                  "head_sha": run.get("head_sha"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
              })

          artifacts = []
          for artifact in artifacts_raw[:40]:
              workflow_run = artifact.get("workflow_run") or {}
              artifacts.append({
                  "id": artifact.get("id"),
                  "name": artifact.get("name"),
                  "size_in_bytes": artifact.get("size_in_bytes"),
                  "expired": artifact.get("expired"),
                  "created_at": artifact.get("created_at"),
                  "expires_at": artifact.get("expires_at"),
                  "workflow_run": {
                      "id": workflow_run.get("id"),
                      "head_sha": workflow_run.get("head_sha"),
                      "head_branch": workflow_run.get("head_branch"),
                  },
              })

          evidence = {
              "current_inventory_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_runs": runs,
              "beds24_refresh_artifacts": artifacts,
          }
          body = "Beds24 Actions inventory (safe metadata only):\n\n```json\n" + json.dumps(
              evidence, indent=2, sort_keys=True
          ) + "\n```"

          comment = urllib.request.Request(
              f"{api}/repos/{repo}/issues/{issue_number}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(comment, timeout=60) as response:
              if response.status != 201:
                  raise RuntimeError(f"Issue comment returned HTTP {response.status}")

          close = urllib.request.Request(
              f"{api}/repos/{repo}/issues/{issue_number}",
              data=json.dumps({"state": "closed", "state_reason": "completed"}).encode("utf-8"),
              headers=headers,
              method="PATCH",
          )
          with urllib.request.urlopen(close, timeout=60) as response:
              if response.status != 200:
                  raise RuntimeError(f"Issue close returned HTTP {response.status}")
          PY
