name: Exchange Beds24 invite code

on:
  workflow_dispatch:
    inputs:
      invite_code:
        description: "One-time Beds24 invite code from SETTINGS > MARKETPLACE > API (expires in 24h)"
        required: true
        type: string
  issues:
    types: [opened, reopened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: beds24-invite-exchange
  cancel-in-progress: false

jobs:
  exchange:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'AUMARA control: finalize Beds24 invite exchange' &&
       github.event.issue.user.login == 'elcidspain')
    name: Exchange invite for refreshToken
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: "868d8df92140db824e3439699cd562bb8e3a79a3"
      FIRST_ISSUE_SHA: "62419f11453edc6b543950c253d396d35b7726e1"
      ONE_TIME_INVITE_CODE: "jagxI4-waqtit-cesseg"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Recover the new-code artifact or exchange the one-time invite
        id: exchange
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import io
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import urllib.request
          import zipfile

          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          github_token = os.environ["GITHUB_TOKEN"]
          accepted_head_shas = {os.environ["TARGET_SHA"], os.environ["FIRST_ISSUE_SHA"]}
          output_dir = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "beds24-exchange"
          output_dir.mkdir(parents=True, exist_ok=True)
          output_file = output_dir / "beds24-refresh-token.txt"
          evidence_file = output_dir / "beds24-exchange-evidence.json"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {github_token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AUMARA-Beds24-Artifact-Recovery/1.0",
          }

          evidence: dict[str, object] = {
              "current_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "current_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "artifact_name": "beds24-refresh-token",
              "token_file": "beds24-refresh-token.txt",
              "verified": False,
              "source": None,
              "diagnostic": None,
          }

          def mask(value: str) -> None:
              if value:
                  print(f"::add-mask::{value}", flush=True)

          def request_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          def download_artifact(artifact: dict) -> str:
              request = urllib.request.Request(str(artifact["archive_download_url"]), headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  archive = response.read()
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  matches = [
                      name for name in bundle.namelist()
                      if pathlib.PurePosixPath(name).name == "beds24-refresh-token.txt"
                  ]
                  if len(matches) != 1:
                      raise RuntimeError("Artifact lacks exactly one beds24-refresh-token.txt")
                  refresh = bundle.read(matches[0]).decode("utf-8").strip()
              if not refresh or len(refresh.splitlines()) != 1 or not refresh.startswith("rt_"):
                  raise RuntimeError("Refresh-token file failed shape validation")
              return refresh

          def find_new_code_artifact() -> tuple[str, dict] | None:
              artifacts = request_json(
                  f"{api}/repos/{repo}/actions/artifacts?name=beds24-refresh-token&per_page=100"
              ).get("artifacts", [])
              candidates = []
              for artifact in artifacts:
                  workflow_run = artifact.get("workflow_run") or {}
                  if artifact.get("expired"):
                      continue
                  if workflow_run.get("head_sha") not in accepted_head_shas:
                      continue
                  candidates.append(artifact)
              for artifact in sorted(candidates, key=lambda item: item.get("created_at", ""), reverse=True):
                  try:
                      return download_artifact(artifact), artifact
                  except Exception:
                      continue
              return None

          def call_setup(invite: str, url: str) -> tuple[int, str]:
              with tempfile.NamedTemporaryFile(delete=False) as handle:
                  body_path = pathlib.Path(handle.name)
              try:
                  process = subprocess.run(
                      [
                          "curl", "-sS", "-o", str(body_path), "-w", "%{http_code}",
                          "-H", f"code: {invite}", url,
                      ],
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  if process.returncode != 0:
                      raise RuntimeError(f"curl failed with exit code {process.returncode}")
                  status = int((process.stdout or "0").strip() or "0")
                  return status, body_path.read_text(encoding="utf-8", errors="replace")
              finally:
                  body_path.unlink(missing_ok=True)

          exit_code = 0
          try:
              recovered = find_new_code_artifact()
              if recovered:
                  refresh, artifact = recovered
                  mask(refresh)
                  output_file.write_text(refresh + "\n", encoding="utf-8")
                  workflow_run = artifact.get("workflow_run") or {}
                  evidence.update({
                      "verified": True,
                      "source": "recovered_new_code_artifact",
                      "source_artifact_id": artifact.get("id"),
                      "source_artifact_created_at": artifact.get("created_at"),
                      "source_run_id": workflow_run.get("id"),
                      "source_head_sha": workflow_run.get("head_sha"),
                      "token_file_bytes": output_file.stat().st_size,
                      "token_single_line": True,
                      "token_prefix_shape_valid": True,
                      "diagnostic": "SUCCESS",
                  })
                  print(json.dumps({
                      "status": "SUCCESS",
                      "source": "recovered_new_code_artifact",
                      "artifact": "beds24-refresh-token",
                      "file": "beds24-refresh-token.txt",
                  }))
              else:
                  invite = str((event.get("inputs") or {}).get("invite_code") or "").strip()
                  if not invite:
                      invite = os.environ.get("ONE_TIME_INVITE_CODE", "").strip()
                  if not invite:
                      raise RuntimeError("No Beds24 invite code available")
                  mask(invite)

                  primary = "https://beds24.com/api/v2/authentication/setup"
                  fallback = "https://api.beds24.com/v2/authentication/setup"
                  status, raw = call_setup(invite, primary)
                  endpoint = primary
                  if status == 404:
                      status, raw = call_setup(invite, fallback)
                      endpoint = fallback

                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError(f"Beds24 returned non-JSON response (HTTP {status})") from exc

                  token = str(payload.get("token") or "")
                  refresh = str(payload.get("refreshToken") or "")
                  mask(token)
                  mask(refresh)
                  if not (200 <= status < 300) or not token or not refresh:
                      keys = sorted(str(key) for key in payload.keys()) if isinstance(payload, dict) else []
                      raise RuntimeError(
                          f"Beds24 setup failed safely: HTTP {status}; keys={keys}; "
                          f"has_token={bool(token)}; has_refresh_token={bool(refresh)}"
                      )
                  if len(refresh.splitlines()) != 1 or not refresh.startswith("rt_"):
                      raise RuntimeError("Beds24 refresh token failed shape validation")

                  output_file.write_text(refresh + "\n", encoding="utf-8")
                  evidence.update({
                      "verified": True,
                      "source": "new_invite_exchange",
                      "http_status": status,
                      "endpoint": endpoint,
                      "access_token_prefix_logged": True,
                      "token_file_bytes": output_file.stat().st_size,
                      "token_single_line": True,
                      "token_prefix_shape_valid": True,
                      "diagnostic": "SUCCESS",
                  })
                  print(json.dumps({
                      "status": "SUCCESS",
                      "http_status": status,
                      "endpoint": endpoint,
                      "token_prefix": token[:10],
                      "artifact": "beds24-refresh-token",
                      "file": "beds24-refresh-token.txt",
                  }))
          except Exception as exc:
              evidence["diagnostic"] = str(exc)[:700]
              print(json.dumps({
                  "status": "FAILED",
                  "diagnostic": evidence["diagnostic"],
              }), file=sys.stderr)
              exit_code = 1
          finally:
              evidence_file.write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"verified={str(bool(evidence.get('verified'))).lower()}\n")

          raise SystemExit(exit_code)
          PY

      - name: Upload refresh token artifact
        id: upload
        if: steps.exchange.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beds24-refresh-token
          path: ${{ runner.temp }}/beds24-exchange/beds24-refresh-token.txt
          if-no-files-found: error
          retention-days: 3

      - name: Report safe evidence and close the one-shot control issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          EXCHANGE_VERIFIED: ${{ steps.exchange.outputs.verified }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue_number = int(event["issue"]["number"])
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          evidence_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "beds24-exchange" / "beds24-exchange-evidence.json"
          evidence = json.loads(evidence_path.read_text(encoding="utf-8")) if evidence_path.exists() else {
              "verified": False,
              "diagnostic": "Evidence file missing",
              "current_run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          evidence["upload_outcome"] = os.environ.get("UPLOAD_OUTCOME", "unknown")
          evidence["artifact_ready"] = (
              str(os.environ.get("EXCHANGE_VERIFIED", "false")).lower() == "true" and
              evidence["upload_outcome"] == "success"
          )
          safe_body = "Beds24 exchange evidence (safe metadata only):\n\n```json\n" + json.dumps(
              evidence, indent=2, sort_keys=True
          ) + "\n```"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "AUMARA-Beds24-Artifact-Recovery/1.0",
          }
          comment = urllib.request.Request(
              f"{api}/repos/{repo}/issues/{issue_number}/comments",
              data=json.dumps({"body": safe_body}).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(comment, timeout=60) as response:
              if response.status != 201:
                  raise RuntimeError(f"Issue comment returned HTTP {response.status}")

          close = urllib.request.Request(
              f"{api}/repos/{repo}/issues/{issue_number}",
              data=json.dumps({"state": "closed", "state_reason": "completed"}).encode("utf-8"),
              headers=headers,
              method="PATCH",
          )
          with urllib.request.urlopen(close, timeout=60) as response:
              if response.status != 200:
                  raise RuntimeError(f"Issue close returned HTTP {response.status}")

          if not evidence["artifact_ready"]:
              raise SystemExit(1)
          PY
