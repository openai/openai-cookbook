name: Mutate AUMARA DNS in Nominalia email login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nominalia-live-domain-mutate-email.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nominalia-live-aumara-dns
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 cryptography
      - name: Use current email login alias
        run: sed -i 's/admin_elcid/elcidspain@gmail.com/g' ops/nominalia_live_domain_mutator.py
      - name: Change only aumara.me A record
        env:
          PYTHONUNBUFFERED: '1'
        run: python ops/nominalia_live_domain_mutator.py
