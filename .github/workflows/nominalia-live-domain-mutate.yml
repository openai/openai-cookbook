name: Mutate AUMARA DNS in Nominalia

on:
  push:
    branches: [main]
    paths:
      - 'ops/nominalia_live_domain_mutator.py'
      - '.github/workflows/nominalia-live-domain-mutate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nominalia-live-aumara-dns
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install secure mutator dependencies
        run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 cryptography

      - name: Change only aumara.me A record
        env:
          PYTHONUNBUFFERED: '1'
        run: python ops/nominalia_live_domain_mutator.py
