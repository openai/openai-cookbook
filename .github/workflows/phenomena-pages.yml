name: Deploy PHENOMENA

on:
  push:
    branches: [main]
    paths:
      - 'phenomena/site/**'
      - '.github/workflows/phenomena-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: phenomena-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload PHENOMENA site
        uses: actions/upload-pages-artifact@v3
        with:
          path: phenomena/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
