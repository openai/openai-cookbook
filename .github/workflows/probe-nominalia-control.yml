name: Probe authorized Nominalia control access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-control.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: NOMINALIA_FTP_PASSWORD
    env:
      NOMINALIA_USER: ${{ secrets.NOMINALIA_CONTROL_USER || secrets.NOMINALIA_USER || vars.NOMINALIA_CONTROL_USER || 'admin_elcid' }}
      NOMINALIA_PASSWORD: ${{ secrets.NOMINALIA_CONTROL_PASSWORD || secrets.NOMINALIA_PANEL_PASSWORD || secrets.NOMINALIA_PASSWORD || secrets.NOMINALIA_ACCOUNT_PASSWORD || secrets.NOMINALIA_FTP_PASSWORD || secrets.NOMINALIAFTPPASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Test control-panel authentication without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4
          mkdir -p ops
          python - <<'PY'
          import os, json
          from urllib.parse import urljoin, urlparse, parse_qsl, urlencode, urlunparse
          import requests
          from bs4 import BeautifulSoup

          user=os.environ['NOMINALIA_USER']
          password=os.environ['NOMINALIA_PASSWORD']
          assert user and password
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 AUMARA authorized control probe'
          r=s.get('https://controlpanel.nominalia.com/welcome.html',timeout=30,allow_redirects=True); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          login_form=next((f for f in soup.find_all('form') if f.find('input',{'type':'password'})),None)
          if not login_form:
              status='NO_LOGIN_FORM'; final=r.url; ss=soup
          else:
              data={i.get('name'):i.get('value','') for i in login_form.find_all('input') if i.get('name')}
              p=login_form.find('input',{'type':'password'}); p_name=p.get('name')
              text_inputs=[i for i in login_form.find_all('input') if i.get('name') and i.get('type','text') in ('text','email')]
              u_name=text_inputs[0].get('name') if text_inputs else None
              if not (u_name and p_name): raise SystemExit('Unable to identify login fields safely')
              data[u_name]=user; data[p_name]=password
              action=urljoin(r.url,login_form.get('action') or r.url)
              rr=s.post(action,data=data,timeout=30,allow_redirects=True) if (login_form.get('method') or 'post').lower()!='get' else s.get(action,params=data,timeout=30,allow_redirects=True)
              final=rr.url; ss=BeautifulSoup(rr.text,'html.parser')
              lower=ss.get_text(' ',strip=True).lower()
              still_login=bool(ss.find('input',{'type':'password'})) and ('welcome' in final.lower() or 'login' in final.lower())
              stepup=any(x in lower for x in ['verification code','código de verificación','two-factor','2fa','autenticación de dos factores','one-time code'])
              status='AUTH_STEPUP_REQUIRED' if stepup else ('AUTH_FAILED' if still_login else 'AUTHENTICATED')
          title=(ss.title.string.strip() if ss.title and ss.title.string else '')
          links=[]
          if status=='AUTHENTICATED':
              for a in ss.find_all('a',href=True):
                  txt=' '.join(a.stripped_strings); href=urljoin(final,a['href']); key=(txt+' '+href).lower()
                  if any(k in key for k in ['domain','dominio','dns','hosting','ssl','website','sitio web']):
                      pu=urlparse(href); safe=[]
                      for k,v in parse_qsl(pu.query,keep_blank_values=True):
                          if k.lower() in {'token','sid','session','auth','key','csrf','code'}: v='REDACTED'
                          safe.append((k,v))
                      links.append({'text':txt[:120],'url':urlunparse((pu.scheme,pu.netloc,pu.path,pu.params,urlencode(safe),''))[:500]})
              out=[]; seen=set()
              for x in links:
                  k=(x['text'],x['url'])
                  if k not in seen: seen.add(k); out.append(x)
              links=out[:40]
          report={'status':status,'final_host':urlparse(final).netloc,'final_path':urlparse(final).path,'page_title':title[:200],'candidate_control_links':links}
          open('ops/nominalia-control-probe.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit sanitized control evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/nominalia-control-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record sanitized Nominalia control probe [skip ci]'
          git pull --rebase origin main
          git push
