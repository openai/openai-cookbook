name: Probe Nominalia secret presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment:
          - NOMINALIA_FTP_PASSWORD
          - Production
          - Preview
          - copilot
          - github-pages
    environment: ${{ matrix.environment }}
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
      MATRIX_ENV: ${{ matrix.environment }}
    steps:
      - name: Report accessible secret names only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          raw=os.environ.get('ALL_SECRETS_JSON','{}')
          try:
              data=json.loads(raw) if raw else {}
          except Exception:
              data={}
          names=sorted(data.keys())
          nominalia=[n for n in names if 'NOMINALIA' in n.upper() or 'CONTROL' in n.upper()]
          print(json.dumps({'environment': os.environ.get('MATRIX_ENV',''), 'nominalia_or_control_secret_names': nominalia}, sort_keys=True))
          PY
