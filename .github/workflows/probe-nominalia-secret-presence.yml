name: Probe Nominalia control credential variables

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment:
          - NOMINALIA_FTP_PASSWORD
          - Production
          - Preview
          - copilot
          - github-pages
    environment: ${{ matrix.environment }}
    env:
      V_NOMINALIA_CONTROL_PASSWORD: ${{ vars.NOMINALIA_CONTROL_PASSWORD }}
      V_NOMINALIA_CONTROLPASSWORD: ${{ vars.NOMINALIA_CONTROLPASSWORD }}
      V_NOMINALIACONTROLPASSWORD: ${{ vars.NOMINALIACONTROLPASSWORD }}
      V_CONTROL_PASSWORD: ${{ vars.CONTROL_PASSWORD }}
      V_NOMINALIA_PASSWORD: ${{ vars.NOMINALIA_PASSWORD }}
      V_NOMINALIA_PANEL_PASSWORD: ${{ vars.NOMINALIA_PANEL_PASSWORD }}
      V_NOMINALIA_CONTROL_USER: ${{ vars.NOMINALIA_CONTROL_USER }}
      V_NOMINALIA_CONTROL_USERNAME: ${{ vars.NOMINALIA_CONTROL_USERNAME }}
      V_NOMINALIA_USERNAME: ${{ vars.NOMINALIA_USERNAME }}
      V_NOMINALIA_USER: ${{ vars.NOMINALIA_USER }}
      V_NOMINALIA_EMAIL: ${{ vars.NOMINALIA_EMAIL }}
      MATRIX_ENV: ${{ matrix.environment }}
    steps:
      - name: Report variable names only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          present=sorted(k[2:] for k,v in os.environ.items() if k.startswith('V_') and v)
          print(json.dumps({'environment': os.environ.get('MATRIX_ENV',''), 'present': present}, sort_keys=True))
          PY
