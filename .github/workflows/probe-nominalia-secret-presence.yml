name: Probe Nominalia secret presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment:
          - NOMINALIA_FTP_PASSWORD
          - Production
          - Preview
          - copilot
          - github-pages
    environment: ${{ matrix.environment }}
    env:
      S_NOMINALIA_CONTROL_PASSWORD: ${{ secrets.NOMINALIA_CONTROL_PASSWORD }}
      S_NOMINALIA_CONTROLPASSWORD: ${{ secrets.NOMINALIA_CONTROLPASSWORD }}
      S_NOMINALIACONTROLPASSWORD: ${{ secrets.NOMINALIACONTROLPASSWORD }}
      S_NOMINALIA_CONTROL_PANEL_PASSWORD: ${{ secrets.NOMINALIA_CONTROL_PANEL_PASSWORD }}
      S_NOMINALIA_CONTROLPANEL_PASSWORD: ${{ secrets.NOMINALIA_CONTROLPANEL_PASSWORD }}
      S_NOMINALIACONTROLPANELPASSWORD: ${{ secrets.NOMINALIACONTROLPANELPASSWORD }}
      S_NOMINALIA_PANEL_PASSWORD: ${{ secrets.NOMINALIA_PANEL_PASSWORD }}
      S_NOMINALIA_CP_PASSWORD: ${{ secrets.NOMINALIA_CP_PASSWORD }}
      S_NOMINALIA_PASSWORD: ${{ secrets.NOMINALIA_PASSWORD }}
      S_NOMINALIA_ADMIN_PASSWORD: ${{ secrets.NOMINALIA_ADMIN_PASSWORD }}
      S_NOMINALIA_LOGIN_PASSWORD: ${{ secrets.NOMINALIA_LOGIN_PASSWORD }}
      S_NOMINALIA_WEB_PASSWORD: ${{ secrets.NOMINALIA_WEB_PASSWORD }}
      S_CONTROL_PASSWORD: ${{ secrets.CONTROL_PASSWORD }}
      S_NOMINALIA_CONTROL_USER: ${{ secrets.NOMINALIA_CONTROL_USER }}
      S_NOMINALIA_CONTROL_USERNAME: ${{ secrets.NOMINALIA_CONTROL_USERNAME }}
      S_NOMINALIACONTROLUSER: ${{ secrets.NOMINALIACONTROLUSER }}
      S_NOMINALIACONTROLUSERNAME: ${{ secrets.NOMINALIACONTROLUSERNAME }}
      S_NOMINALIA_PANEL_USER: ${{ secrets.NOMINALIA_PANEL_USER }}
      S_NOMINALIA_USERNAME: ${{ secrets.NOMINALIA_USERNAME }}
      S_NOMINALIA_USER: ${{ secrets.NOMINALIA_USER }}
      S_NOMINALIA_LOGIN: ${{ secrets.NOMINALIA_LOGIN }}
      S_NOMINALIA_EMAIL: ${{ secrets.NOMINALIA_EMAIL }}
      S_NOMINALIA_FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
      S_NOMINALIAFTPPASSWORD: ${{ secrets.NOMINALIAFTPPASSWORD }}
    steps:
      - name: Report names only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          prefix='S_'
          present=sorted(k[len(prefix):] for k,v in os.environ.items() if k.startswith(prefix) and v)
          print(json.dumps({'environment': os.environ.get('MATRIX_ENV',''), 'present': present}, sort_keys=True))
          PY
        env:
          MATRIX_ENV: ${{ matrix.environment }}
