name: Probe Nominalia secret presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-secret-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: NOMINALIA_FTP_PASSWORD
    env:
      S_CONTROL_PASSWORD: ${{ secrets.NOMINALIA_CONTROL_PASSWORD }}
      S_PANEL_PASSWORD: ${{ secrets.NOMINALIA_PANEL_PASSWORD }}
      S_CP_PASSWORD: ${{ secrets.NOMINALIA_CP_PASSWORD }}
      S_PASSWORD: ${{ secrets.NOMINALIA_PASSWORD }}
      S_ADMIN_PASSWORD: ${{ secrets.NOMINALIA_ADMIN_PASSWORD }}
      S_CONTROL_USER: ${{ secrets.NOMINALIA_CONTROL_USER }}
      S_PANEL_USER: ${{ secrets.NOMINALIA_PANEL_USER }}
      S_USERNAME: ${{ secrets.NOMINALIA_USERNAME }}
      S_API_TOKEN: ${{ secrets.NOMINALIA_API_TOKEN }}
      S_DNS_TOKEN: ${{ secrets.NOMINALIA_DNS_TOKEN }}
      S_FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
      S_FTP_PASSWORD_ALT: ${{ secrets.NOMINALIAFTPPASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record names only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          python - <<'PY'
          import json, os
          names = [
            'CONTROL_PASSWORD','PANEL_PASSWORD','CP_PASSWORD','PASSWORD','ADMIN_PASSWORD',
            'CONTROL_USER','PANEL_USER','USERNAME','API_TOKEN','DNS_TOKEN',
            'FTP_PASSWORD','FTP_PASSWORD_ALT'
          ]
          out = {name: bool(os.environ.get('S_'+name)) for name in names}
          open('ops/nominalia-secret-presence.json','w').write(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/nominalia-secret-presence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Nominalia secret presence [skip ci]'
          git pull --rebase origin main
          git push
