name: Probe Nominalia secret presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-secret-presence.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List repository secret names only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/secrets" --jq '.secrets[].name' | grep -Ei 'nominalia|control' || true
      - name: List environment secret names only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for env in NOMINALIA_FTP_PASSWORD Production Preview copilot github-pages; do
            echo "ENV=$env"
            gh api "repos/${GITHUB_REPOSITORY}/environments/${env}/secrets" --jq '.secrets[].name' 2>/dev/null | grep -Ei 'nominalia|control' || true
          done
