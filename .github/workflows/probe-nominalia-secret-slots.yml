name: Probe existing Nominalia credential slots safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nominalia-secret-slots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: NOMINALIA_FTP_PASSWORD
    env:
      S_FTP1: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
      S_FTP2: ${{ secrets.NOMINALIAFTPPASSWORD }}
      S_PANEL: ${{ secrets.NOMINALIA_PANEL_PASSWORD }}
      S_CONTROL: ${{ secrets.NOMINALIA_CONTROL_PASSWORD }}
      S_PASS: ${{ secrets.NOMINALIA_PASSWORD }}
      S_USER: ${{ secrets.NOMINALIA_USERNAME }}
      S_TOKEN: ${{ secrets.NOMINALIA_TOKEN }}
      S_API_TOKEN: ${{ secrets.NOMINALIA_API_TOKEN }}
      S_API_KEY: ${{ secrets.NOMINALIA_API_KEY }}
      S_TEAMBLUE: ${{ secrets.TEAMBLUE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record presence only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          python - <<'PY'
          import os,json
          names=['S_FTP1','S_FTP2','S_PANEL','S_CONTROL','S_PASS','S_USER','S_TOKEN','S_API_TOKEN','S_API_KEY','S_TEAMBLUE']
          out={n:bool(os.environ.get(n)) for n in names}
          open('ops/nominalia-secret-slots.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit presence map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/nominalia-secret-slots.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Nominalia secret-slot presence [skip ci]'
          git pull --rebase origin main
          git push
