name: Recover Beds24 booking verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-beds24-booking-id.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      SOURCE_JOB_ID: '87233764278'
      EVIDENCE_FILE: aumara-control-tower/evidence/beds24-recovered-booking-verification.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prior successful execution logs and recover booking ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/beds24-recovery "$(dirname "$EVIDENCE_FILE")"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" \
            -o /tmp/beds24-recovery/job.log
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import re

          log = pathlib.Path('/tmp/beds24-recovery/job.log').read_text(errors='replace')
          lines = [line for line in log.splitlines() if 'BOOKING_VERIFIED' in line and 'booking_id' in line]
          if not lines:
              raise SystemExit('No BOOKING_VERIFIED line with booking_id found in source job logs')
          line = lines[-1]
          match = re.search(r'\{[^\n]*"status"\s*:\s*"BOOKING_VERIFIED"[^\n]*\}', line)
          if not match:
              raise SystemExit('Could not isolate BOOKING_VERIFIED JSON from source job logs')
          payload = json.loads(match.group(0))
          booking_id = payload.get('booking_id')
          if not booking_id:
              raise SystemExit('Recovered verification payload contains no booking_id')
          evidence = {
              'recovered_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'source_job_id': int(os.environ['SOURCE_JOB_ID']),
              'status': payload.get('status'),
              'booking_id': booking_id,
              'outcome': payload.get('outcome'),
              'meaning': 'The prior Beds24 finalizer step completed successfully and emitted BOOKING_VERIFIED after room, dates, confirmed status, charge and payment checks passed.'
          }
          pathlib.Path(os.environ['EVIDENCE_FILE']).write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence))
          PY

      - name: Commit recovered verification evidence safely
        shell: bash
        run: |
          set -euo pipefail
          cp "$EVIDENCE_FILE" /tmp/beds24-recovered-booking-verification.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$EVIDENCE_FILE")"
          cp /tmp/beds24-recovered-booking-verification.json "$EVIDENCE_FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_FILE"
          git diff --cached --quiet || git commit -m 'Recover verified Beds24 booking ID [skip ci]'
          git push origin HEAD:main
