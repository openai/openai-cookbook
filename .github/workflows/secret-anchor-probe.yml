name: Secret anchor presence probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-anchor-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      NOMINALIA_FTP_HOST: ${{ secrets.NOMINALIA_FTP_HOST }}
      NOMINALIA_FTP_USER: ${{ secrets.NOMINALIA_FTP_USER }}
      NOMINALIA_FTP_PASSWORD: ${{ secrets.NOMINALIA_FTP_PASSWORD }}
      NOMINALIA_HOST: ${{ secrets.NOMINALIA_HOST }}
      NOMINALIA_USER: ${{ secrets.NOMINALIA_USER }}
      NOMINALIA_PASSWORD: ${{ secrets.NOMINALIA_PASSWORD }}
      AUMARA_WEBHOOK_TOKEN: ${{ secrets.AUMARA_WEBHOOK_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Write boolean-only report
        shell: bash
        run: |
          python - <<'PY'
          import json, os, datetime, pathlib
          names=['FTP_HOST','FTP_USERNAME','FTP_USER','FTP_PASSWORD','NOMINALIA_FTP_HOST','NOMINALIA_FTP_USER','NOMINALIA_FTP_PASSWORD','NOMINALIA_HOST','NOMINALIA_USER','NOMINALIA_PASSWORD','AUMARA_WEBHOOK_TOKEN','RESEND_API_KEY']
          report={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'present':{n:bool(os.environ.get(n)) for n in names}}
          pathlib.Path('aumara-control-tower/evidence').mkdir(parents=True,exist_ok=True)
          pathlib.Path('aumara-control-tower/evidence/secret-anchor-presence.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aumara-control-tower/evidence/secret-anchor-presence.json
          git diff --cached --quiet || git commit -m 'Record secret anchor presence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
