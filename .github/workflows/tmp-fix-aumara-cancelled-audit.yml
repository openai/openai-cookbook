name: TEMP Fix AUMARA cancelled-reservation audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fix-aumara-cancelled-audit.yml"

permissions:
  contents: write

concurrency:
  group: tmp-fix-aumara-cancelled-audit
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow cancellation-status patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path("aumara-control-tower/scripts/beds24_aumara_access_audit.py")
          test_path = Path("aumara-control-tower/scripts/tests/test_beds24_aumara_access_audit.py")

          script = script_path.read_text(encoding="utf-8")
          old_constant = 'HEALTHY_STATUSES = {"PIN_MESSAGE_MATCHED"}\n'
          new_constant = (
              'HEALTHY_STATUSES = {"PIN_MESSAGE_MATCHED"}\n'
              'INACTIVE_BOOKING_STATUSES = {"cancelled", "canceled", "black", "inquiry"}\n'
          )
          if old_constant not in script:
              raise SystemExit("expected HEALTHY_STATUSES anchor not found")
          if "INACTIVE_BOOKING_STATUSES" not in script:
              script = script.replace(old_constant, new_constant, 1)

          old_return = (
              '    rows = data_rows(response, "AUMARA booking")\n'
              '    return [row for row in rows if int(row.get("propertyId") or PROPERTY_ID) == PROPERTY_ID]\n'
          )
          new_return = (
              '    rows = data_rows(response, "AUMARA booking")\n'
              '    return [\n'
              '        row\n'
              '        for row in rows\n'
              '        if int(row.get("propertyId") or PROPERTY_ID) == PROPERTY_ID\n'
              '        and str(row.get("status") or "").strip().lower()\n'
              '        not in INACTIVE_BOOKING_STATUSES\n'
              '    ]\n'
          )
          if old_return not in script and new_return not in script:
              raise SystemExit("expected fetch_arrivals return anchor not found")
          if old_return in script:
              script = script.replace(old_return, new_return, 1)
          script_path.write_text(script, encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          anchor = (
              '    def test_lock_pin_is_detected_without_returning_value(self):\n'
          )
          new_test = '''    def test_fetch_arrivals_excludes_inactive_booking_statuses(self):
        response = {
            "data": [
                {"id": 1, "propertyId": 324882, "status": "confirmed"},
                {"id": 2, "propertyId": 324882, "status": "cancelled"},
                {"id": 3, "propertyId": 324882, "status": "canceled"},
                {"id": 4, "propertyId": 324882, "status": "black"},
                {"id": 5, "propertyId": 324882, "status": "inquiry"},
                {"id": 6, "propertyId": 999999, "status": "confirmed"},
            ]
        }
        with mock.patch.object(MODULE, "request_json", return_value=(200, response)):
            rows = MODULE.fetch_arrivals(
                "token",
                "https://api.beds24.com/v2",
                MODULE.dt.date(2026, 8, 11),
                MODULE.dt.date(2026, 8, 12),
            )
        self.assertEqual([row["id"] for row in rows], [1])

'''
          if "test_fetch_arrivals_excludes_inactive_booking_statuses" not in tests:
              if anchor not in tests:
                  raise SystemExit("expected test insertion anchor not found")
              tests = tests.replace(anchor, new_test + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Run focused regression tests
        run: |
          python -m unittest \
            aumara-control-tower/scripts/tests/test_beds24_aumara_access_audit.py \
            aumara-control-tower/scripts/tests/test_beds24_elcid_studio_audit.py \
            -v

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            aumara-control-tower/scripts/beds24_aumara_access_audit.py \
            aumara-control-tower/scripts/tests/test_beds24_aumara_access_audit.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git commit -m 'Exclude cancelled bookings from AUMARA access audit [skip ci]'
          git push origin HEAD:main
