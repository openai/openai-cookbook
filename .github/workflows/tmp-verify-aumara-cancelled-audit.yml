name: TEMP Verify AUMARA cancelled-reservation audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-aumara-cancelled-audit.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify cancelled booking is excluded from live arrivals
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import sys

          scripts = pathlib.Path("aumara-control-tower/scripts")
          sys.path.insert(0, str(scripts.resolve()))
          import beds24_aumara_access_audit as audit
          from beds24_elcid_studio_audit import get_access_token

          booking_id = 89395880
          token, auth_mode, api_base, auth_source, _ = get_access_token()
          booking = audit.fetch_booking_by_id(token, api_base, booking_id)
          if booking is None:
              raise SystemExit("booking 89395880 not found during live verification")
          status = str(booking.get("status") or "").strip().lower()
          if status not in audit.INACTIVE_BOOKING_STATUSES:
              raise SystemExit(f"booking 89395880 still active: {status}")

          arrivals = audit.fetch_arrivals(
              token,
              api_base,
              dt.date(2026, 8, 11),
              dt.date(2026, 8, 11),
          )
          ids = [int(row.get("id") or 0) for row in arrivals]
          if booking_id in ids:
              raise SystemExit("cancelled booking 89395880 leaked into active arrivals")

          print(json.dumps({
              "status": "LIVE_CANCELLED_FILTER_VERIFIED",
              "bookingId": booking_id,
              "bookingStatus": status,
              "excludedFromArrivals": True,
              "activeArrivalsCount": len(ids),
              "authMode": auth_mode,
              "authSource": auth_source,
              "secretExposed": False,
          }, separators=(",", ":")))
          PY
