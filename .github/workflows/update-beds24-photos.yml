name: Update Beds24 Photos AUMARA 324882

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-beds24-photos.yml"

permissions:
  contents: write

concurrency:
  group: beds24-v2-picture-structure-324882
  cancel-in-progress: true

jobs:
  update-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEDS24_REFRESH_CREDENTIAL: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      PROPERTY_ID: "324882"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish sanitized run marker
        shell: bash
        run: |
          mkdir -p aumara-control-tower/evidence/beds24-v2-picture-structure
          cat > "aumara-control-tower/evidence/beds24-v2-picture-structure/${GITHUB_RUN_ID}-started.json" <<JSON
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "property_id": "324882",
            "state": "RUNNING",
            "secret_exposed": false
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "aumara-control-tower/evidence/beds24-v2-picture-structure/${GITHUB_RUN_ID}-started.json"
          git commit -m "Open Beds24 V2 picture probe ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Materialize exact V2 picture structure probe
        shell: bash
        run: |
          python3 - <<'EXTRACT'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/beds24-v2-picture-structure.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(source)) if source[index].strip() == 'PY')
          script = textwrap.dedent('\n'.join(source[start:end])) + '\n'
          target = Path('/tmp/beds24_v2_picture_structure.py')
          target.write_text(script, encoding='utf-8')
          EXTRACT
          python3 -m py_compile /tmp/beds24_v2_picture_structure.py

      - name: Read current property picture structure
        run: python3 /tmp/beds24_v2_picture_structure.py
