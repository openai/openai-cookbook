name: Update Beds24 Photos AUMARA 324882

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-beds24-photos.yml"

permissions:
  contents: write

concurrency:
  group: beds24-legacy-picture-probe-324882
  cancel-in-progress: true

jobs:
  update-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROPERTY_ID: "324882"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize read-only legacy API probe
        shell: bash
        run: |
          awk '/beds24_legacy_probe.py.gz.b64 <<.B64./{capture=1; next} capture && /^[[:space:]]*B64[[:space:]]*$/{exit} capture{sub(/^[[:space:]]+/, ""); print}' \
            .github/workflows/beds24-legacy-picture-probe.yml > /tmp/beds24_legacy_probe.py.gz.b64
          test -s /tmp/beds24_legacy_probe.py.gz.b64
          base64 -d /tmp/beds24_legacy_probe.py.gz.b64 | gzip -d > /tmp/beds24_legacy_probe.py
          chmod 700 /tmp/beds24_legacy_probe.py
          python -m py_compile /tmp/beds24_legacy_probe.py

      - name: Probe existing legacy picture access without writes
        run: python /tmp/beds24_legacy_probe.py

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beds24-legacy-picture-probe-${{ github.run_id }}
          path: aumara-control-tower/evidence/beds24-legacy-probe/${{ github.run_id }}/status.json
          if-no-files-found: warn
          retention-days: 3
