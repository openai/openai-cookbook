name: Update Beds24 Photos AUMARA 324882

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-beds24-photos.yml"

permissions:
  contents: write

concurrency:
  group: beds24-token-recovery-324882
  cancel-in-progress: true

jobs:
  update-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      BEDS24_REFRESH_TOKEN_SLOT: ${{ secrets.BEDS24_REFRESH_TOKEN }}
      BEDS24_REFRESH_CREDENTIAL_SLOT: ${{ secrets.BEDS24_REFRESH_CREDENTIAL }}
      PROPERTY_ID: "324882"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install token-vault dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Recover valid token and inspect current picture structure
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          from cryptography.fernet import Fernet, InvalidToken

          API_BASE = "https://api.beds24.com/v2"
          PROPERTY_ID = os.environ.get("PROPERTY_ID", "324882")
          RUN_ID = os.environ.get("GITHUB_RUN_ID", "unknown")
          TOKEN_SLOT = (os.environ.get("BEDS24_REFRESH_TOKEN_SLOT") or "").strip()
          CREDENTIAL_SLOT = (os.environ.get("BEDS24_REFRESH_CREDENTIAL_SLOT") or "").strip()
          EVIDENCE_PATH = pathlib.Path(
              f"aumara-control-tower/evidence/beds24-token-recovery/{RUN_ID}.json"
          )
          VAULT_PATH = pathlib.Path(
              "aumara-control-tower/evidence/beds24-refresh-vault.json"
          )
          known_secrets: list[str] = [value for value in (TOKEN_SLOT, CREDENTIAL_SLOT) if value]
          active_access_token = ""

          def now_utc() -> str:
              return dt.datetime.now(dt.timezone.utc).isoformat()

          def request_json(
              url: str,
              *,
              headers: dict[str, str],
              method: str = "GET",
              payload: Any | None = None,
          ) -> tuple[int, Any]:
              data = None
              request_headers = {"accept": "application/json", **headers}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  request_headers["content-type"] = "application/json"
              request = urllib.request.Request(
                  url,
                  headers=request_headers,
                  data=data,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      status = response.status
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  status = exc.code
              try:
                  body = json.loads(raw.decode("utf-8", "replace")) if raw else {}
              except json.JSONDecodeError:
                  body = {"non_json_bytes": len(raw)}
              return status, body

          def redact_text(value: str) -> str:
              result = value
              for secret in (*known_secrets, active_access_token):
                  if secret:
                      result = result.replace(secret, "[REDACTED]")
              return result[:3000]

          def sanitize(value: Any, depth: int = 0) -> Any:
              if depth > 10:
                  return "[DEPTH_LIMIT]"
              if isinstance(value, dict):
                  output: dict[str, Any] = {}
                  for key, item in value.items():
                      normalized = str(key).lower()
                      if any(token in normalized for token in ("token", "secret", "password", "credential")):
                          output[str(key)] = "[REDACTED]"
                      else:
                          output[str(key)] = sanitize(item, depth + 1)
                  return output
              if isinstance(value, list):
                  return [sanitize(item, depth + 1) for item in value[:300]]
              if isinstance(value, str):
                  return redact_text(value)
              return value

          def diagnostics(body: Any) -> Any:
              if not isinstance(body, dict):
                  return {"response_type": type(body).__name__}
              result: dict[str, Any] = {}
              for key in ("code", "status", "type", "message", "error", "detail", "error_description"):
                  if key in body and body[key] not in (None, "", [], {}):
                      result[key] = sanitize(body[key])
              if not result:
                  result["body_keys"] = sorted(str(key) for key in body.keys())[:50]
              return result

          def vault_key(kek: str) -> bytes:
              digest = hashlib.sha256(
                  ("AUMARA_BEDS24_REFRESH_VAULT_V1\0" + kek).encode("utf-8")
              ).digest()
              return base64.urlsafe_b64encode(digest)

          def decrypt_vault(kek: str) -> str:
              if not kek or not VAULT_PATH.exists():
                  return ""
              try:
                  data = json.loads(VAULT_PATH.read_text(encoding="utf-8"))
                  ciphertext = data.get("ciphertext") if isinstance(data, dict) else None
                  if not isinstance(ciphertext, str) or not ciphertext:
                      return ""
                  return Fernet(vault_key(kek)).decrypt(ciphertext.encode("ascii")).decode("utf-8")
              except (OSError, json.JSONDecodeError, InvalidToken, ValueError):
                  return ""

          def encrypt_vault(refresh_token: str, kek: str, source: str) -> None:
              VAULT_PATH.parent.mkdir(parents=True, exist_ok=True)
              ciphertext = Fernet(vault_key(kek)).encrypt(refresh_token.encode("utf-8")).decode("ascii")
              VAULT_PATH.write_text(
                  json.dumps(
                      {
                          "version": 1,
                          "cipher": "fernet-sha256-kek",
                          "source": source,
                          "created_at_utc": now_utc(),
                          "ciphertext": ciphertext,
                          "plaintext_stored": False,
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          def property_url() -> str:
              query = urllib.parse.urlencode(
                  {
                      "id": PROPERTY_ID,
                      "includePictures": "true",
                      "includeAllRooms": "true",
                      "includeOffers": "true",
                      "includeTexts": "property",
                  }
              )
              return f"{API_BASE}/properties?{query}"

          def extract_property(body: Any) -> dict[str, Any] | None:
              if not isinstance(body, dict):
                  return None
              data = body.get("data")
              if not isinstance(data, list):
                  return None
              for item in data:
                  if isinstance(item, dict) and str(item.get("id") or item.get("propertyId")) == PROPERTY_ID:
                      return item
              if len(data) == 1 and isinstance(data[0], dict):
                  return data[0]
              return None

          def property_probe(token: str) -> tuple[int, dict[str, Any] | None, Any]:
              status, body = request_json(property_url(), headers={"token": token})
              return status, extract_property(body), body

          def collect_picture_paths(value: Any, path: str = "$", output: list[dict[str, Any]] | None = None):
              if output is None:
                  output = []
              if isinstance(value, dict):
                  for key, item in value.items():
                      child = f"{path}.{key}"
                      if any(token in str(key).lower() for token in ("picture", "image", "photo")):
                          output.append({"path": child, "value": sanitize(item)})
                      collect_picture_paths(item, child, output)
              elif isinstance(value, list):
                  for index, item in enumerate(value[:200]):
                      collect_picture_paths(item, f"{path}[{index}]", output)
              return output

          evidence: dict[str, Any] = {
              "checked_at_utc": now_utc(),
              "run_id": RUN_ID,
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "environment": "Production",
              "property_id": PROPERTY_ID,
              "status": "STARTING",
              "token_slot_present": bool(TOKEN_SLOT),
              "credential_slot_present": bool(CREDENTIAL_SLOT),
              "vault_present_before": VAULT_PATH.exists(),
              "vault_decrypted": False,
              "vault_written": False,
              "attempts": [],
              "selected_source": None,
              "selected_mode": None,
              "property_http_status": None,
              "property_keys": [],
              "room_keys": [],
              "picture_paths": [],
              "property_snapshot": None,
              "diagnostic": None,
              "secret_exposed": False,
          }

          candidates: list[tuple[str, str, bool]] = []
          vault_token = decrypt_vault(CREDENTIAL_SLOT)
          if vault_token:
              evidence["vault_decrypted"] = True
              known_secrets.append(vault_token)
              candidates.append(("encrypted_vault", vault_token, False))
          if TOKEN_SLOT:
              candidates.append(("BEDS24_REFRESH_TOKEN", TOKEN_SLOT, False))
          if CREDENTIAL_SLOT:
              candidates.append(("BEDS24_REFRESH_CREDENTIAL", CREDENTIAL_SLOT, True))

          selected_property: dict[str, Any] | None = None
          seen: set[str] = set()

          for source, candidate, allow_setup in candidates:
              if not candidate or candidate in seen:
                  continue
              seen.add(candidate)
              attempt: dict[str, Any] = {
                  "source": source,
                  "direct_property_http_status": None,
                  "refresh_http_status": None,
                  "refreshed_property_http_status": None,
                  "setup_http_status": None,
                  "setup_property_http_status": None,
                  "accepted_mode": None,
                  "diagnostic": None,
              }
              evidence["attempts"].append(attempt)

              direct_status, direct_property, direct_body = property_probe(candidate)
              attempt["direct_property_http_status"] = direct_status
              if 200 <= direct_status < 300 and direct_property is not None:
                  active_access_token = candidate
                  selected_property = direct_property
                  attempt["accepted_mode"] = "access_token"
                  evidence["selected_source"] = source
                  evidence["selected_mode"] = "access_token"
                  evidence["property_http_status"] = direct_status
                  break

              refresh_status, refresh_body = request_json(
                  f"{API_BASE}/authentication/token",
                  headers={"refreshToken": candidate},
              )
              attempt["refresh_http_status"] = refresh_status
              refreshed_access = refresh_body.get("token") if isinstance(refresh_body, dict) else None
              rotated_refresh = refresh_body.get("refreshToken") if isinstance(refresh_body, dict) else None
              if 200 <= refresh_status < 300 and isinstance(refreshed_access, str) and refreshed_access:
                  active_access_token = refreshed_access
                  if isinstance(rotated_refresh, str) and rotated_refresh and CREDENTIAL_SLOT:
                      known_secrets.append(rotated_refresh)
                      encrypt_vault(rotated_refresh, CREDENTIAL_SLOT, f"refresh:{source}")
                      evidence["vault_written"] = True
                  refreshed_status, refreshed_property, refreshed_body = property_probe(active_access_token)
                  attempt["refreshed_property_http_status"] = refreshed_status
                  if 200 <= refreshed_status < 300 and refreshed_property is not None:
                      selected_property = refreshed_property
                      attempt["accepted_mode"] = "refresh_token"
                      evidence["selected_source"] = source
                      evidence["selected_mode"] = "refresh_token"
                      evidence["property_http_status"] = refreshed_status
                      break
                  attempt["diagnostic"] = {
                      "stage": "property_after_refresh",
                      "response": diagnostics(refreshed_body),
                  }

              if allow_setup:
                  setup_status, setup_body = request_json(
                      f"{API_BASE}/authentication/setup",
                      headers={"code": candidate},
                  )
                  attempt["setup_http_status"] = setup_status
                  setup_access = setup_body.get("token") if isinstance(setup_body, dict) else None
                  setup_refresh = setup_body.get("refreshToken") if isinstance(setup_body, dict) else None
                  if 200 <= setup_status < 300 and isinstance(setup_access, str) and setup_access:
                      active_access_token = setup_access
                      if isinstance(setup_refresh, str) and setup_refresh and CREDENTIAL_SLOT:
                          known_secrets.append(setup_refresh)
                          encrypt_vault(setup_refresh, CREDENTIAL_SLOT, f"setup:{source}")
                          evidence["vault_written"] = True
                      setup_property_status, setup_property, setup_property_body = property_probe(active_access_token)
                      attempt["setup_property_http_status"] = setup_property_status
                      if 200 <= setup_property_status < 300 and setup_property is not None:
                          selected_property = setup_property
                          attempt["accepted_mode"] = "setup_code"
                          evidence["selected_source"] = source
                          evidence["selected_mode"] = "setup_code"
                          evidence["property_http_status"] = setup_property_status
                          break
                      attempt["diagnostic"] = {
                          "stage": "property_after_setup",
                          "response": diagnostics(setup_property_body),
                      }
                  elif attempt["diagnostic"] is None:
                      attempt["diagnostic"] = {
                          "stage": "direct_refresh_setup",
                          "direct": diagnostics(direct_body),
                          "refresh": diagnostics(refresh_body),
                          "setup": diagnostics(setup_body),
                      }
              elif attempt["diagnostic"] is None:
                  attempt["diagnostic"] = {
                      "stage": "direct_refresh",
                      "direct": diagnostics(direct_body),
                      "refresh": diagnostics(refresh_body),
                  }

          if selected_property is None:
              evidence["status"] = "FAILED"
              evidence["diagnostic"] = "No stored token, refresh token, or invite code produced readable property 324882"
          else:
              evidence["property_keys"] = sorted(str(key) for key in selected_property.keys())
              rooms = selected_property.get("roomTypes")
              if isinstance(rooms, list) and rooms and isinstance(rooms[0], dict):
                  evidence["room_keys"] = sorted(str(key) for key in rooms[0].keys())
              evidence["picture_paths"] = collect_picture_paths(selected_property)
              evidence["property_snapshot"] = sanitize(selected_property)
              evidence["status"] = "SUCCESS"

          EVIDENCE_PATH.parent.mkdir(parents=True, exist_ok=True)
          EVIDENCE_PATH.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )
          files_to_add = [str(EVIDENCE_PATH)]
          if VAULT_PATH.exists():
              files_to_add.append(str(VAULT_PATH))
          subprocess.run(["git", "add", *files_to_add], check=True)
          diff = subprocess.run(["git", "diff", "--cached", "--quiet"], check=False)
          if diff.returncode != 0:
              subprocess.run(
                  ["git", "commit", "-m", f"Record Beds24 token recovery {RUN_ID} [skip ci]"],
                  check=True,
              )
              subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)

          print(json.dumps({
              "status": evidence["status"],
              "selected_source": evidence["selected_source"],
              "selected_mode": evidence["selected_mode"],
              "vault_written": evidence["vault_written"],
              "property_http_status": evidence["property_http_status"],
              "picture_path_count": len(evidence["picture_paths"]),
              "evidence_path": str(EVIDENCE_PATH),
          }, ensure_ascii=False))
          if evidence["status"] != "SUCCESS":
              raise SystemExit(1)
          PY
