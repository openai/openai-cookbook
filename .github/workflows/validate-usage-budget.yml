name: Validate usage-budget example

on:
  pull_request:
    paths:
      - 'examples/chatgpt/daily_usage_limits/**'
      - '.github/workflows/validate-usage-budget.yml'

permissions:
  contents: read

jobs:
  prepare-source:
    name: Prepare example source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: examples/chatgpt/daily_usage_limits
      # Other Cookbook examples contain filenames Windows cannot check out.
      # Export this example's tracked files and license before the OS matrix.
      - name: Export tracked example
        run: git archive --format=tar --output=usage-budget-source.tar HEAD LICENSE examples/chatgpt/daily_usage_limits
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: usage-budget-source
          path: usage-budget-source.tar
          if-no-files-found: error
          retention-days: 1
  offline-checks:
    name: Usage budget (${{ matrix.os }})
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/chatgpt/daily_usage_limits
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: usage-budget-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Extract example source
        working-directory: .
        run: python -c "import tarfile; tarfile.open('usage-budget-source.tar').extractall(filter='data')"
      - name: Test source
        run: node --test test/*.test.mjs
      - name: Run fictional demonstration
        run: node src/demo.mjs
      - name: Verify starter contents
        run: python scripts/package_starter.py --check
      - name: Extract starter download
        run: python -m zipfile -e assets/chatgpt-usage-budget-starter.zip .private/download-check
      - name: Test downloaded starter
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: node --test test/*.test.mjs
      - name: Run downloaded demonstration
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: node src/demo.mjs
      - name: Build downloaded AWS package
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: npm run package --prefix aws
      - name: Verify AWS archive
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: python -m zipfile -t aws/dist/controller.zip
