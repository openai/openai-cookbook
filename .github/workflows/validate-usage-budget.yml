name: Validate usage-budget example

on:
  pull_request:
    paths:
      - 'examples/chatgpt/daily_usage_limits/**'
      - '.github/workflows/validate-usage-budget.yml'

permissions:
  contents: read

jobs:
  offline-checks:
    name: Usage budget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/chatgpt/daily_usage_limits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: examples/chatgpt/daily_usage_limits
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test source
        run: node --test test/*.test.mjs
      - name: Run fictional demonstration
        run: node src/demo.mjs
      - name: Verify starter contents
        run: python scripts/package_starter.py --check
      - name: Extract starter download
        run: python -m zipfile -e assets/chatgpt-usage-budget-starter.zip .private/download-check
      - name: Test downloaded starter
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: node --test test/*.test.mjs
      - name: Run downloaded demonstration
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: node src/demo.mjs
      - name: Build downloaded AWS package
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: npm run package --prefix aws
      - name: Verify AWS archive
        working-directory: examples/chatgpt/daily_usage_limits/.private/download-check/chatgpt-usage-budget-starter
        run: python -m zipfile -t aws/dist/controller.zip
