        "aumara.first-morning-care"
      ],
      "response_templates": {
        "en": "Good morning {guest_first_name}. Did you sleep well? If anything could make your stay more comfortable, tell us here. We can also recommend a beach or restaurant for today.",
        "es": "Buenos días {guest_first_name}. ¿Habéis descansado bien? Si podemos hacer algo para que vuestra estancia sea más cómoda, decídnoslo por aquí. También podemos recomendaros una playa o un restaurante para hoy.",
        "fr": "Bonjour {guest_first_name}. Avez-vous bien dormi ? Si quelque chose peut rendre votre séjour plus confortable, dites-le-nous ici. Nous pouvons aussi vous recommander une plage ou un restaurant pour aujourd’hui.",
        "de": "Guten Morgen {guest_first_name}. Haben Sie gut geschlafen? Wenn wir etwas tun können, um Ihren Aufenthalt angenehmer zu machen, schreiben Sie uns hier. Gern empfehlen wir Ihnen auch einen Strand oder ein Restaurant für heute.",
