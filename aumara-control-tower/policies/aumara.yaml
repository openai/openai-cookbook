    {
      "policy_id": "aumara.first-morning-care",
      "property": "aumara",
      "category": "guest_journey",
      "rule": "Prepare one first-morning comfort check only for stays of at least two nights, between zero eight thirty and eleven thirty local time, and never on departure day.",
      "source": "approved_internal_document",
      "source_reference": "REQUEST:CUSTOMER_SERVICE_COORDINATES:2026-08-17",
