      "response_template_ids": [
        "aumara.post-checkin-care"
      ],
      "response_templates": {
        "en": "Hi {guest_first_name}, is everything going well in your AUMARA house since you arrived? If anything needs attention, message us here.",
        "es": "Hola {guest_first_name}, ¿va todo bien en vuestra casa AUMARA desde que llegasteis? Si necesitáis algo, escribidnos por aquí.",
