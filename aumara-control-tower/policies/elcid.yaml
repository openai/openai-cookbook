      "response_template_ids": [
        "elcid.post-checkin-care"
      ],
      "response_templates": {
        "en": "Hi {guest_first_name}, is everything going well since you arrived at El Cid Country Club? Is your room comfortable, and are the Wi-Fi and air conditioning working as expected? Message us here if anything needs attention.",
        "es": "Hola {guest_first_name}, ¿va todo bien desde vuestra llegada a El Cid Country Club? ¿La habitación es cómoda? ¿Funcionan bien el Wi-Fi y el aire acondicionado? Si necesitáis algo, escribidnos por aquí.",
        "fr": "Bonjour {guest_first_name}, tout se passe bien depuis votre arrivée à El Cid Country Club ? Votre chambre est-elle confortable ? Le Wi-Fi et la climatisation fonctionnent-ils correctement ? Écrivez-nous ici si quelque chose nécessite notre attention.",
        "de": "Hallo {guest_first_name}, ist seit Ihrer Ankunft im El Cid Country Club alles in Ordnung? Ist Ihr Zimmer angenehm, und funktionieren WLAN und Klimaanlage einwandfrei? Schreiben Sie uns hier, wenn wir uns um etwas kümmern sollen.",
        "nl": "Hallo {guest_first_name}, gaat alles goed sinds jullie aankomst bij El Cid Country Club? Is de kamer comfortabel en werken wifi en airconditioning naar behoren? Laat het ons hier weten als we ergens naar moeten kijken."
      },
      "policy_version": "2026.07.27.1"
    },
    {
