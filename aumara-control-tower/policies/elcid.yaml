        "de": "Guten Morgen {guest_first_name}. Haben Sie gut geschlafen? Wenn wir etwas tun können, um Ihr Zimmer oder Ihren Aufenthalt angenehmer zu machen, schreiben Sie uns hier. Gern empfehlen wir Ihnen auch einen Strand oder ein Restaurant für heute.",
