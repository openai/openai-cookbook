      "policy_id": "elcid.post-checkin-care",
      "property": "elcid",
      "category": "guest_journey",
      "rule": "Prepare one short care check between sixty and one hundred eighty minutes after verified check-in. Ask only about current comfort and do not request a rating or promise an unverified response time.",
