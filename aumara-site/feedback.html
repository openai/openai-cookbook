function renderSurvey(p){state.profile=p;if(p.surveySubmitted&&p.discountCode){renderReward({source:p,publicMode:false});return}app.innerHTML=`<section class="card"><p class="kicker">${esc(tr().kicker)}</p><h2>${esc(fmt(tr().hello,{name:p.guestFirstName}))}</h2><p class="lead">${esc(tr().intro)}</p><div class="stay"><span class="pill">${esc(p.roomType||"AUMARA")}</span><span class="pill">${esc(date(p.stayArrival))} — ${esc(date(p.stayDeparture))}</span></div><div class="gift">${esc(tr().gift)}</div></section><form id="survey">${section(1,tr().overall,score(5,"overallRating"))}${section(2,tr().recommend,score(11,"recommendScore")+`<div class="range"><span>${esc(tr().low)}</span><span>${esc(tr().high)}</span></div>`)}${section(3,tr().liked,chipGroup("liked",chips.liked)+`<label class="field">${esc(tr().improve)}<textarea name="improvementText" maxlength="1200" placeholder="${esc(tr().improvePh)}"></textarea></label>`)}${section(4,tr().add,chipGroup("addWishlist",chips.add))}${section(5,tr().activities,chipGroup("activityInterests",chips.activities)+`<label class="field">${esc(tr().comment)}<textarea name="finalComment" maxlength="1200" placeholder="${esc(tr().commentPh)}"></textarea></label><label class="consent"><input type="checkbox" name="testimonialConsent"><span>${esc(tr().consent)}</span></label>`)}<div class="submit-wrap"><button class="submit" type="submit">${esc(tr().submit)}</button><p class="error" id="formError"></p></div></form><p class="foot">${esc(tr().privacy)}</p>`;
 const data={overallRating:null,recommendScore:null,liked:[],addWishlist:[],activityInterests:[]};document.querySelectorAll("[data-score]").forEach(group=>group.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const key=group.dataset.score;data[key]=Number(b.dataset.value);group.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b))})));document.querySelectorAll("[data-group]").forEach(group=>group.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const list=data[group.dataset.group],v=b.dataset.value,i=list.indexOf(v);if(i>=0)list.splice(i,1);else list.push(v);b.classList.toggle("selected",i<0)})));
 document.getElementById("survey").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,err=document.getElementById("formError"),btn=form.querySelector(".submit");err.classList.remove("show");if(data.overallRating===null||data.recommendScore===null){err.textContent=tr().required;err.classList.add("show");return}btn.disabled=true;btn.textContent=tr().sending;try{const r=await fetch(`${API}?action=submit`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,locale:state.lang,...data,improvementText:form.improvementText.value,finalComment:form.finalComment.value,testimonialConsent:form.testimonialConsent.checked})});const j=await r.json();if(!r.ok||!j.ok)throw new Error();renderReward({source:j.reward,publicMode:false})}catch{err.textContent=tr().failed;err.classList.add("show");btn.disabled=false;btn.textContent=tr().submit}})}
function model(source){const n=source.reward||source;return{discountCode:source.discountCode||n.discountCode,minNights:n.minNights||5,transferable:n.transferable!==false,stackable:n.stackable!==false,readyForBooking:n.readyForBooking===true}}
function renderReward(payload){state.reward=payload;const r=model(payload.source),code=r.discountCode;if(!code)return renderError();const shareUrl=`https://elcidspain.com/aumara/feedback.html?code=${encodeURIComponent(code)}`;app.innerHTML=`<section class="card reward"><div class="reward-head"><p class="kicker">AUMARA</p><h2>${esc(payload.publicMode?tr().benefit:tr().thanks)}</h2><p>${esc(payload.publicMode?tr().offerText:tr().reward)}</p></div><div class="reward-body"><div class="voucher"><div><span class="code-label">${esc(tr().code)}</span><div class="code">${esc(code)}</div><div class="terms"><span class="term">${esc(fmt(tr().min,{n:r.minNights}))}</span><span class="term">${esc(tr().transfer)}</span><span class="term">${esc(tr().stack)}</span><span class="term">${esc(tr().once)}</span></div></div><div class="qr"><img src="${API}?action=qr&amp;code=${encodeURIComponent(code)}" alt="QR"><small>${esc(tr().scan)}</small></div></div>${r.readyForBooking?`<div class="actions"><a class="action primary" href="${API}?action=book&amp;code=${encodeURIComponent(code)}">${esc(tr().book)}</a><button class="action" type="button" id="copy">${esc(tr().copy)}</button><button class="action" type="button" id="share">${esc(tr().share)}</button></div>`:`<div class="pending">${esc(tr().pending)}</div><div class="actions"><button class="action" type="button" id="copy">${esc(tr().copy)}</button><button class="action" type="button" id="share">${esc(tr().share)}</button></div>`}</div></section><p class="foot">${esc(tr().privacy)}</p>`;document.getElementById("copy")?.addEventListener("click",async e=>{await navigator.clipboard.writeText(code);e.currentTarget.textContent=tr().copied});document.getElementById("share")?.addEventListener("click",async()=>{const data={title:"AUMARA 10%",text:`AUMARA · 10% · ${code}`,url:shareUrl};if(navigator.share)await navigator.share(data);else await navigator.clipboard.writeText(shareUrl)})}
function renderOffer(o){state.offer=o;if(text[o.locale]&&!localStorage.getItem("aumara-feedback-lang"))setLang(o.locale,false);renderReward({source:{discountCode:o.discountCode,reward:o},publicMode:true})}
function renderError(){app.innerHTML=`<section class="card"><p class="kicker">AUMARA</p><h2>${esc(tr().invalid)}</h2><p class="lead">${esc(tr().privacy)}</p><div class="actions"><a class="action primary" href="/aumara/">AUMARA</a></div></section>`}
async function init(){setLang(state.lang,false);try{if(token){const r=await fetch(`${API}?action=profile`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token})});const j=await r.json();if(!r.ok||!j.ok)throw new Error();return renderSurvey(j.profile)}if(publicCode){const r=await fetch(`${API}?action=offer&code=${encodeURIComponent(publicCode)}`),j=await r.json();if(!r.ok||!j.ok)throw new Error();return renderOffer(j.offer)}throw new Error()}catch{renderError()}}
init();
</script>
</body>
</html>
