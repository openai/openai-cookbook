<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="947" viewBox="0 0 1440 947" role="img" aria-labelledby="title description">
<title id="title">Data analyst workflow</title>
<desc id="description">User to Your application: Ask a business question. Your application to Agents API: Start or resume session. Agents API to Read-only warehouse: Discover tables and schemas. Agents API to Your application: Check business context. Agents API to Analyst memory: Find saved corrections. Agents API to Read-only warehouse: Run and verify read-only SQL. Agents API to User: Explain findings and sources. User to Agents API: Ask to remember a correction. Agents API to Analyst memory: Save for future analyses.</desc>
