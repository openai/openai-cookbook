<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964" role="img" aria-labelledby="title description">
<title id="title">Bulk document review workflow</title>
<desc id="description">User to Review command: Submit document folder. Review command to Agents API: Create multi-agent session. Review command to Input / output folders: Mount input + policy read-only; output writable. Agents API to Specialist subagents: Delegate each document. Specialist subagents to Mounted review skill: Discover and apply policy. Specialist subagents to Input / output folders: Write individual JSON reports. Agents API to Input / output folders: Write consolidated summary. Review command to User: Return findings for review.</desc>
