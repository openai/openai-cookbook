<g data-from="3" data-to="5"><path d="M 837.1666666666667 594.2 H 1305.8333333333335" fill="none" stroke="#253443" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1071.5" y="579.6" text-anchor="middle" font-size="22" font-weight="400" fill="#162231"><tspan x="1071.5" dy="0">Inspect code, AWS + history</tspan></text></g>
<g data-from="5" data-to="3"><path d="M 1305.8333333333335 662.8000000000001 H 837.1666666666667" fill="none" stroke="#253443" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1071.5" y="648.2" text-anchor="middle" font-size="22" font-weight="400" fill="#162231"><tspan x="1071.5" dy="0">Return correlated evidence</tspan></text></g>
<g data-from="3" data-to="2"><path d="M 837.1666666666667 760.0000000000001 H 602.8333333333334" fill="none" stroke="#253443" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="720" y="716.8000000000001" text-anchor="middle" font-size="22" font-weight="400" fill="#162231"><tspan x="720" dy="0">Action-required</tspan><tspan x="720" dy="28.6">webhook</tspan></text></g>
