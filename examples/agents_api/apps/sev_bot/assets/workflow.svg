<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1715" viewBox="0 0 1440 1715" role="img" aria-labelledby="title description">
<title id="title">SRE agent workflow</title>
<desc id="description">Incident alerts to Incident bot: Send incident. Incident bot to Slack #oncall: Open incident thread. Incident bot to Agents API: Create incident session. Incident bot to Incident sandbox: Start executor + AWS skills. Agents API to Incident sandbox: Read skills + runbook. Agents API to Evidence + history: Inspect code, AWS + history. Evidence + history to Agents API: Return correlated evidence. Agents API to Incident bot: Action-required webhook. Incident bot to Agents API: Fetch pending tool call. Incident bot to Slack #oncall: Post approval buttons. Slack #oncall to Incident bot: Approve or reject. Incident bot to Agents API: Submit decision. Agents API to Slack #oncall: Explain next steps. Slack #oncall to Incident bot: Ask a follow-up. Incident bot to Agents API: Continue same session. Incident bot to Incident bot: Save incident memory. Incident bot to Agents API: Delete session. Incident bot to Incident sandbox: Remove sandbox.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#253443"/></marker></defs>
