<g data-from="2" data-to="3"><path d="M 602.8333333333334 1527.8 H 837.1666666666667" fill="none" stroke="#253443" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="720" y="1513.2" text-anchor="middle" font-size="22" font-weight="400" fill="#162231"><tspan x="720" dy="0">Delete session</tspan></text></g>
<g data-from="2" data-to="4"><path d="M 602.8333333333334 1596.3999999999999 H 1071.5" fill="none" stroke="#253443" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="837.1666666666667" y="1581.8" text-anchor="middle" font-size="22" font-weight="400" fill="#162231"><tspan x="837.1666666666667" dy="0">Remove sandbox</tspan></text></g>
<text x="24" y="1681.3999999999999" text-anchor="start" font-size="17" font-weight="400" fill="#4D5B6A"><tspan x="24" dy="0">Approval records a decision, not a rollback. Incident memory is application-owned.</tspan></text>
