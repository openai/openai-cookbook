<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="839" viewBox="0 0 1440 839" role="img" aria-labelledby="title description">
<title id="title">Slack bot workflow</title>
<desc id="description">User to Slack: Tag the bot to investigate. Slack to Agents API: Start or resume thread session. Agents API to Connected tools: Search Slack and shared apps. Agents API to Thread sandbox: Analyze data or prepare changes. Agents API to Slack: Stream progress and reply. User to Slack: Ask to open a pull request. Slack to Agents API: Continue the same session.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#253443"/></marker></defs>
<rect width="1440" height="839" fill="#FFFFFF"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="46" text-anchor="start" font-size="26" font-weight="600" fill="#162231"><tspan x="24" dy="0">Slack bot</tspan></text>
