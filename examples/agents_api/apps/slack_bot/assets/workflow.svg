<path d="M 438.79999999999995 158 V 760.0000000000001" fill="none" stroke="#A8B3BC" stroke-width="1" stroke-dasharray="6 6"/>
<rect x="586.4" y="80" width="267.2" height="680.0000000000001" fill="#EEFBF3"/>
<rect x="586.4" y="80" width="267.2" height="78" fill="#CDF2DB"/>
<text x="720" y="125.05" text-anchor="middle" font-size="23" font-weight="600" fill="#162231"><tspan x="720" dy="0">Agents API</tspan></text>
<path d="M 720 158 V 760.0000000000001" fill="none" stroke="#A8B3BC" stroke-width="1" stroke-dasharray="6 6"/>
<rect x="867.5999999999999" y="80" width="267.2" height="680.0000000000001" fill="#EDF7FE"/>
