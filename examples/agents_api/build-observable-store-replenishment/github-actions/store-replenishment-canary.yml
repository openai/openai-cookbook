name: Store replenishment Agents API canary

"on":
  pull_request:
    paths:
      - "examples/agents_api/build-observable-store-replenishment/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-api-store-replenishment-${{ github.ref }}
  cancel-in-progress: false

env:
  EXAMPLE_DIR: examples/agents_api/build-observable-store-replenishment

jobs:
  offline-tests:
    name: Offline dataset and tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.EXAMPLE_DIR }}/requirements.txt

      - name: Install dependencies
        run: pip install --requirement "$EXAMPLE_DIR/requirements.txt"

      - name: Test the dataset, tools, and session workflow
        run: PYTHONPATH="$EXAMPLE_DIR" pytest "$EXAMPLE_DIR/tests"

  live-canary:
    name: Approved live Agents API canary
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: agents-api-canary
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.EXAMPLE_DIR }}/requirements.txt

      - name: Install dependencies
        run: pip install --requirement "$EXAMPLE_DIR/requirements.txt"

      - name: Run the live replenishment incident
        run: >-
          python "$EXAMPLE_DIR/replenishment_agent.py"
          --output-dir replenishment-output
          --check-expected-decisions

      - name: Upload recommendations and trace
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: store-replenishment-${{ github.run_id }}
          path: replenishment-output/
          if-no-files-found: warn
          retention-days: 14
