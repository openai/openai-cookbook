name: {name}
agent: codex-agentapi
config:
  agent:
    model: gpt-5.6-sol
  environment:
    type: self_hosted
    workspace_directory: /workspace
secrets:
  CODEX_API_KEY: ${EXECUTOR_API_KEY}
env:
  CODEX_ENVIRONMENT_ID: ${ENVIRONMENT_ID}
egress:
  - api.openai.com
  - codex-cloud-environments.chatgpt.com
