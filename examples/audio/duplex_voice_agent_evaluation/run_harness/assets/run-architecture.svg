      <text x="222" y="911">Expected state + constraints</text>
    </g>
    <g class="edge-label edge-label--green" data-edge-label="End of conversation">
      <rect x="558" y="1011" width="204" height="32" rx="16"/>
      <text x="660" y="1032">End of conversation</text>
    </g>
    <g class="edge-label edge-label--green" data-edge-label="Agent response + tools and state">
