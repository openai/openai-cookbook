      <rect class="icon-surface" x="431" y="117" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 127)"><path d="M4.5 7.4h6.1l2 2h7a1.7 1.7 0 0 1 1.7 1.7v8.1a1.7 1.7 0 0 1-1.7 1.7H4.5a1.7 1.7 0 0 1-1.7-1.7V9.1a1.7 1.7 0 0 1 1.7-1.7Z"/></g>
      <text class="node-title" x="493" y="135">Scenario</text>
      <text class="node-detail" x="493" y="163">scenarios.json</text>
    </g>
    <g class="card card--caller card--orange" data-node-id="caller" role="group" aria-label="GPT Live caller: gpt-live-1">
      <rect class="card-surface" x="115" y="425" width="420" height="108" rx="19"/>
      <rect class="icon-surface" x="141" y="456" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(151, 466)"><path d="M5 10v5"/><path d="M9.5 6v13"/><path d="M14 3.5v18"/><path d="M18.5 7v11"/><path d="M23 10.5v4"/></g>
      <text class="node-title" x="203" y="474">GPT Live caller</text>
      <text class="node-detail" x="203" y="502">gpt-live-1</text>
    </g>
    <g class="card card--caller-backend card--orange" data-node-id="caller-backend" role="group" aria-label="Caller reasoning: gpt-5.6-luna, low effort, no tools">
      <rect class="card-surface" x="115" y="578" width="420" height="102" rx="19"/>
      <rect class="icon-surface" x="141" y="606" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(151, 616)"><rect x="6" y="6" width="14" height="14" rx="2"/><rect x="10" y="10" width="6" height="6" rx="1"/><path d="M10 3v3m6-3v3m-6 14v3m6-3v3M3 10h3m-3 6h3m14-6h3m-3 6h3"/></g>
      <text class="node-title" x="203" y="624">Caller reasoning</text>
      <text class="node-detail" x="203" y="652">gpt-5.6-luna · low · no tools</text>
    </g>
    <g class="card card--assistant card--blue" data-node-id="assistant" role="group" aria-label="GPT Live agent: gpt-live-1">
      <rect class="card-surface" x="740" y="425" width="440" height="108" rx="19"/>
      <rect class="icon-surface" x="766" y="456" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(776, 466)"><path d="m13 3 2.2 6.3L21.5 11l-6.3 2.2L13 19.5l-2.2-6.3L4.5 11l6.3-1.7L13 3Z"/><path d="m20 15.7.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6Z"/></g>
      <text class="node-title" x="828" y="474">GPT Live agent</text>
      <text class="node-detail" x="828" y="502">gpt-live-1</text>
    </g>
    <g class="card card--backend card--blue" data-node-id="backend" role="group" aria-label="Backend and tools: gpt-5.6-terra · definitions.json">
      <rect class="card-surface" x="740" y="578" width="440" height="102" rx="19"/>
      <rect class="icon-surface" x="766" y="606" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(776, 616)"><path d="M20.9 7.2a5.3 5.3 0 0 1-6.7 6.7l-6.4 6.4a2 2 0 0 1-2.8-2.8l6.4-6.4a5.3 5.3 0 0 1 6.7-6.7L15 7.5l2.6 2.6z"/></g>
      <text class="node-title" x="828" y="624">Backend and tools</text>
      <text class="node-detail" x="828" y="652">gpt-5.6-terra · definitions.json</text>
    </g>
    <g class="card card--observer card--green" data-node-id="observer" role="group" aria-label="Semantic completion observer: gpt-5.6-terra">
      <rect class="card-surface" x="405" y="850" width="510" height="112" rx="19"/>
      <rect class="icon-surface" x="431" y="883" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 893)"><rect x="6" y="6" width="14" height="14" rx="2"/><rect x="10" y="10" width="6" height="6" rx="1"/><path d="M10 3v3m6-3v3m-6 14v3m6-3v3M3 10h3m-3 6h3m14-6h3m-3 6h3"/></g>
      <text class="node-title" x="493" y="901">Semantic completion observer</text>
      <text class="node-detail" x="493" y="929">gpt-5.6-terra</text>
    </g>
    <g class="card card--grading card--green" data-node-id="grading" role="group" aria-label="Grading and results: gpt-5.6-terra · results.json">
      <rect class="card-surface" x="405" y="1090" width="510" height="112" rx="19"/>
      <rect class="icon-surface" x="431" y="1123" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 1133)"><path d="M13 3.5 21 6.7v5.6c0 4.3-2.9 7.8-8 9.7-5.1-1.9-8-5.4-8-9.7V6.7z"/><path d="m9.3 12.6 2.4 2.4 5-5"/></g>
      <text class="node-title" x="493" y="1141">Grading and results</text>
      <text class="node-detail" x="493" y="1169">gpt-5.6-terra · results.json</text>
    </g></g>
  <g aria-hidden="true"><g class="edge-label edge-label--orange" data-edge-label="Goal · persona · agenda">
      <rect x="213.5" y="286" width="223" height="32" rx="16"/>
      <text x="325" y="307">Goal · persona · agenda</text>
    </g>
    <g class="edge-label edge-label--blue" data-edge-label="Agent context">
      <rect x="883.5" y="286" width="153" height="32" rx="16"/>
      <text x="960" y="307">Agent context</text>
    </g>
    <g class="edge-label edge-label--orange" data-edge-label="Caller audio">
      <rect x="570.5" y="441" width="133" height="32" rx="16"/>
      <text x="637" y="462">Caller audio</text>
    </g>
    <g class="edge-label edge-label--blue" data-edge-label="Agent audio">
      <rect x="572" y="490" width="130" height="32" rx="16"/>
      <text x="637" y="511">Agent audio</text>
    </g>
    <g class="edge-label edge-label--green" data-edge-label="Conversation">
      <rect x="587.5" y="793" width="145" height="32" rx="16"/>
      <text x="660" y="814">Conversation</text>
    </g>
    <g class="edge-label edge-label--green" data-edge-label="Expected state + constraints">
