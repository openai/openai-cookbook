<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1280" viewBox="0 0 1320 1280" role="img" aria-labelledby="run-title run-description">
  <title id="run-title">RUN continuous multi-turn voice-agent evaluation</title>
  <desc id="run-description">A scenario gives its private goal, persona, and agenda to a GPT Live caller with independent managed Responses reasoning and no tools, and gives agent context to a separate GPT Live agent. Both Live frontends use Marble and continuously exchange audio. The caller backend uses Luna at low effort; only the evaluated agent owns application tools and state. An independent semantic completion observer receives evaluator-owned expected state and constraints and recognizes the end of the conversation. The full expected outcome remains evaluator-only.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#c48a47" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-orange-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M8 1.5 2 5 8 8.5" fill="none" stroke="#c48a47" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#7290bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M8 1.5 2 5 8 8.5" fill="none" stroke="#7290bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#739b79" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="soft-shadow" x="-15%" y="-35%" width="130%" height="185%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#182b38" flood-opacity="0.045"/></filter>
  </defs>
  <style>
    svg { background: #fff; font-family: "OpenAI Sans", "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #fff; }
    .simulation-boundary rect { fill: #fcfcfb; stroke: #dfe3de; stroke-width: 1.4; }
    .simulation-caption { fill: #747b76; font-size: 13px; font-weight: 560; letter-spacing: .34px; }
    .agent-boundary rect { fill: #f7f9fd; stroke: #d5deeb; stroke-width: 1.4; }
    .flow { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .flow--orange { stroke: #c48a47; }
    .flow--optional { stroke: #c48a47; stroke-dasharray: 5 7; }
    .flow--blue, .flow--context, .flow--response { stroke: #7290bd; }
    .flow--green { stroke: #739b79; }
    .flow--expected { stroke: #739b79; stroke-dasharray: 5 7; }
    .card-surface { stroke-width: 1.25; filter: url(#soft-shadow); }
    .card--orange .card-surface { fill: #fffbf6; stroke: #e9d7bd; }
    .card--orange .icon-surface { fill: #fff1dc; }
    .card--orange .node-icon { stroke: #a86d31; }
    .card--optional .card-surface { fill: #fffdfa; stroke: #e5d5bd; stroke-dasharray: 5 5; }
    .card--assistant .card-surface { fill: #eef4fe; stroke: #b8cbed; }
    .card--assistant .icon-surface { fill: #dae7fc; }
    .card--assistant .node-icon { stroke: #37659d; }
    .card--backend .card-surface { fill: #fff; stroke: #d1dceb; }
    .card--backend .icon-surface { fill: #eef2f8; }
    .card--backend .node-icon { stroke: #516983; }
    .card--green .card-surface { fill: #f1f8f1; stroke: #c6ddc8; }
    .card--green .icon-surface { fill: #e0f0e1; }
    .card--green .node-icon { stroke: #4c7952; }
    .node-icon { fill: none; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .node-title { fill: #202520; font-size: 25px; font-weight: 590; letter-spacing: -0.52px; }
    .card--assistant .node-title { font-size: 27px; }
    .card--optional .node-title { font-size: 21px; }
    .card--observer .node-title { font-size: 22px; }
    .node-detail { fill: #676f70; font-family: "SF Mono", "SFMono-Regular", ui-monospace, monospace; font-size: 15.6px; letter-spacing: -0.24px; }
    .edge-label rect { fill: #fff; stroke: #edf0ee; stroke-width: .9; }
    .edge-label text { font-size: 15px; font-weight: 530; text-anchor: middle; letter-spacing: -.08px; }
    .edge-label--orange text { fill: #8e6538; }
    .edge-label--blue text { fill: #506b91; }
    .edge-label--green text { fill: #537758; }
  </style>
  <rect class="canvas" width="1320" height="1280"/>
  <g class="simulation-boundary" data-node-id="simulation-boundary">
      <rect x="80" y="345" width="1150" height="425" rx="29"/>
      <text class="simulation-caption" x="655" y="375" text-anchor="middle">Continuous multi-turn simulation</text>
    </g>
  <g class="agent-boundary" data-node-id="assistant-boundary">
      <rect x="710" y="393" width="500" height="316" rx="29"/>

    </g>
  <g aria-hidden="true"><path class="flow flow--orange" d="M505 194 V236 Q505 253 488 253 H342 Q325 253 325 270 V425" marker-end="url(#arrow-orange)"/>
    <path class="flow flow--blue" d="M815 194 V236 Q815 253 832 253 H943 Q960 253 960 270 V425" marker-end="url(#arrow-blue)"/>
    <path class="flow flow--orange" d="M535 459 H740" marker-end="url(#arrow-orange)"/>
    <path class="flow flow--blue" d="M740 502 H535" marker-end="url(#arrow-blue)"/>
    <path class="flow flow--orange" d="M325 540 V571" marker-start="url(#arrow-orange-start)" marker-end="url(#arrow-orange)"/>
    <path class="flow flow--blue" d="M960 540 V571" marker-start="url(#arrow-blue-start)" marker-end="url(#arrow-blue)"/>
    <path class="flow flow--green" d="M660 770 V850" marker-end="url(#arrow-green)"/>
    <path class="flow flow--green" d="M660 962 V1090" marker-end="url(#arrow-green)"/>
    <path class="flow flow--expected" d="M405 140 H62 Q45 140 45 157 V889 Q45 906 62 906 H405" marker-end="url(#arrow-green)"/>
    <path class="flow flow--green" d="M960 680 V1055 Q960 1072 943 1072 H867 Q850 1072 850 1089 V1090" marker-end="url(#arrow-green)"/>
    <path class="flow flow--expected" d="M915 140 H1253 Q1270 140 1270 157 V1129 Q1270 1146 1253 1146 H915" marker-end="url(#arrow-green)"/></g>
  <g><g class="card card--scenario card--orange" data-node-id="scenario" role="group" aria-label="Scenario: scenarios.json">
