<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1280" viewBox="0 0 1320 1280" role="img" aria-labelledby="walk-title walk-description">
  <title id="walk-title">WALK recorded single-turn voice-agent evaluation</title>
  <desc id="walk-description">A saved caller recording enters one GPT Live voice agent containing its reasoning backend and tools. An optional separate text-to-speech and noise workflow can create the recording before evaluation. Agent context goes only to the agent. Private expected outcomes go only to grading and results.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#c48a47" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#7290bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M8 1.5 2 5 8 8.5" fill="none" stroke="#7290bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1.5 1.5 8 5 1.5 8.5" fill="none" stroke="#739b79" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="soft-shadow" x="-15%" y="-35%" width="130%" height="185%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#182b38" flood-opacity="0.045"/></filter>
  </defs>
  <style>
    svg { background: #fff; font-family: "OpenAI Sans", "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { fill: #fff; }
    .agent-boundary rect { fill: #f7f9fd; stroke: #d5deeb; stroke-width: 1.4; }
    .flow { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .flow--orange { stroke: #c48a47; }
    .flow--optional { stroke: #c48a47; stroke-dasharray: 5 7; }
    .flow--blue, .flow--context, .flow--response { stroke: #7290bd; }
    .flow--green { stroke: #739b79; }
    .flow--expected { stroke: #739b79; stroke-dasharray: 5 7; }
    .card-surface { stroke-width: 1.25; filter: url(#soft-shadow); }
    .card--orange .card-surface { fill: #fffbf6; stroke: #e9d7bd; }
    .card--orange .icon-surface { fill: #fff1dc; }
    .card--orange .node-icon { stroke: #a86d31; }
    .card--optional .card-surface { fill: #fffdfa; stroke: #e5d5bd; stroke-dasharray: 5 5; }
    .card--assistant .card-surface { fill: #eef4fe; stroke: #b8cbed; }
    .card--assistant .icon-surface { fill: #dae7fc; }
    .card--assistant .node-icon { stroke: #37659d; }
    .card--backend .card-surface { fill: #fff; stroke: #d1dceb; }
    .card--backend .icon-surface { fill: #eef2f8; }
    .card--backend .node-icon { stroke: #516983; }
    .card--green .card-surface { fill: #f1f8f1; stroke: #c6ddc8; }
    .card--green .icon-surface { fill: #e0f0e1; }
    .card--green .node-icon { stroke: #4c7952; }
    .node-icon { fill: none; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .node-title { fill: #202520; font-size: 25px; font-weight: 590; letter-spacing: -0.52px; }
    .card--assistant .node-title { font-size: 27px; }
    .card--optional .node-title { font-size: 21px; }
    .node-detail { fill: #676f70; font-family: "SF Mono", "SFMono-Regular", ui-monospace, monospace; font-size: 15.6px; letter-spacing: -0.24px; }
    .edge-label rect { fill: #fff; stroke: #edf0ee; stroke-width: .9; }
    .edge-label text { font-size: 15px; font-weight: 530; text-anchor: middle; letter-spacing: -.08px; }
    .edge-label--orange text { fill: #8e6538; }
    .edge-label--blue text { fill: #506b91; }
    .edge-label--green text { fill: #537758; }
  </style>
  <rect class="canvas" width="1320" height="1280"/>
  <g class="agent-boundary" data-node-id="assistant-boundary">
      <rect x="352" y="617" width="616" height="345" rx="29"/>
    </g>
  <g aria-hidden="true"><path class="flow flow--orange" d="M660 194 V454" marker-end="url(#arrow-orange)"/>
    <path class="flow flow--optional" d="M405 168 H332 Q315 168 315 185 V277" marker-end="url(#arrow-orange)"/>
    <path class="flow flow--optional" d="M315 385 V491 Q315 508 332 508 H405" marker-end="url(#arrow-orange)"/>
    <path class="flow flow--blue" d="M660 562 V666" marker-end="url(#arrow-blue)"/>
    <path class="flow flow--context" d="M405 120 H82 Q65 120 65 137 V705 Q65 722 82 722 H405" marker-end="url(#arrow-blue)"/>
    <path class="flow flow--blue" d="M660 785 V825" marker-start="url(#arrow-blue-start)" marker-end="url(#arrow-blue)"/>
    <path class="flow flow--response" d="M915 722 H987 Q1004 722 1004 739 V999 Q1004 1016 987 1016 H838 Q821 1016 821 1033 V1090" marker-end="url(#arrow-blue)"/>
    <path class="flow flow--green" d="M660 934 V1090" marker-end="url(#arrow-green)"/>
    <path class="flow flow--expected" d="M915 140 H1133 Q1150 140 1150 157 V1129 Q1150 1146 1133 1146 H915" marker-end="url(#arrow-green)"/></g>
  <g><g class="card card--scenario card--orange" data-node-id="scenario" role="group" aria-label="Scenario: scenarios.json">
      <rect class="card-surface" x="405" y="86" width="510" height="108" rx="19"/>
      <rect class="icon-surface" x="431" y="117" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 127)"><path d="M4.5 7.4h6.1l2 2h7a1.7 1.7 0 0 1 1.7 1.7v8.1a1.7 1.7 0 0 1-1.7 1.7H4.5a1.7 1.7 0 0 1-1.7-1.7V9.1a1.7 1.7 0 0 1 1.7-1.7Z"/></g>
      <text class="node-title" x="493" y="135">Scenario</text>
      <text class="node-detail" x="493" y="163">scenarios.json</text>
    </g>
    <g class="card card--tts card--orange card--optional" data-node-id="tts" role="group" aria-label="Text-to-speech + noise: gpt-4o-mini-tts">
      <rect class="card-surface" x="105" y="277" width="420" height="108" rx="19"/>
      <rect class="icon-surface" x="131" y="308" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(141, 318)"><path d="M6 9.3h4l5-4v14l-5-4H6z"/><path d="M18.2 9a5.1 5.1 0 0 1 0 7.1"/><path d="M21 6.2a9 9 0 0 1 0 12.7"/></g>
      <text class="node-title" x="193" y="326">Text-to-speech + noise</text>
      <text class="node-detail" x="193" y="354">gpt-4o-mini-tts</text>
    </g>
    <g class="card card--audio card--orange" data-node-id="audio" role="group" aria-label="Recorded caller audio: audio.wav">
      <rect class="card-surface" x="405" y="454" width="510" height="108" rx="19"/>
      <rect class="icon-surface" x="431" y="485" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 495)"><path d="M5 10v5"/><path d="M9.5 6v13"/><path d="M14 3.5v18"/><path d="M18.5 7v11"/><path d="M23 10.5v4"/></g>
      <text class="node-title" x="493" y="503">Recorded caller audio</text>
      <text class="node-detail" x="493" y="531">audio.wav</text>
    </g>
    <g class="card card--assistant card--blue" data-node-id="assistant" role="group" aria-label="GPT Live agent: gpt-live-1">
      <rect class="card-surface" x="405" y="666" width="510" height="112" rx="19"/>
      <rect class="icon-surface" x="431" y="699" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 709)"><path d="m13 3 2.2 6.3L21.5 11l-6.3 2.2L13 19.5l-2.2-6.3L4.5 11l6.3-1.7L13 3Z"/><path d="m20 15.7.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9.9-2.6Z"/></g>
      <text class="node-title" x="493" y="717">GPT Live agent</text>
      <text class="node-detail" x="493" y="745">gpt-live-1</text>
    </g>
    <g class="card card--backend card--blue" data-node-id="backend" role="group" aria-label="Backend and tools: gpt-5.6-terra · definitions.json">
      <rect class="card-surface" x="405" y="832" width="510" height="102" rx="19"/>
      <rect class="icon-surface" x="431" y="860" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 870)"><path d="M20.9 7.2a5.3 5.3 0 0 1-6.7 6.7l-6.4 6.4a2 2 0 0 1-2.8-2.8l6.4-6.4a5.3 5.3 0 0 1 6.7-6.7L15 7.5l2.6 2.6z"/></g>
      <text class="node-title" x="493" y="878">Backend and tools</text>
      <text class="node-detail" x="493" y="906">gpt-5.6-terra · definitions.json</text>
    </g>
    <g class="card card--grading card--green" data-node-id="grading" role="group" aria-label="Grading and results: gpt-5.6-terra · results.json">
      <rect class="card-surface" x="405" y="1090" width="510" height="112" rx="19"/>
      <rect class="icon-surface" x="431" y="1123" width="46" height="46" rx="13"/>
      <g class="node-icon" transform="translate(441, 1133)"><path d="M13 3.5 21 6.7v5.6c0 4.3-2.9 7.8-8 9.7-5.1-1.9-8-5.4-8-9.7V6.7z"/><path d="m9.3 12.6 2.4 2.4 5-5"/></g>
      <text class="node-title" x="493" y="1141">Grading and results</text>
      <text class="node-detail" x="493" y="1169">gpt-5.6-terra · results.json</text>
    </g></g>
  <g aria-hidden="true"><g class="edge-label edge-label--orange" data-edge-label="Caller recording">
      <rect x="573" y="308" width="174" height="32" rx="16"/>
      <text x="660" y="329">Caller recording</text>
    </g>
    <g class="edge-label edge-label--orange" data-edge-label="Optional">
      <rect x="262" y="213" width="106" height="32" rx="16"/>
      <text x="315" y="234">Optional</text>
    </g>
    <g class="edge-label edge-label--blue" data-edge-label="Agent context">
      <rect x="25.5" y="404" width="153" height="32" rx="16"/>
      <text x="102" y="425">Agent context</text>
    </g>
    <g class="edge-label edge-label--blue" data-edge-label="Agent response">
      <rect x="920.5" y="846" width="167" height="32" rx="16"/>
      <text x="1004" y="867">Agent response</text>
    </g>
    <g class="edge-label edge-label--green" data-edge-label="Tools and state">
      <rect x="579.5" y="991" width="161" height="32" rx="16"/>
      <text x="660" y="1012">Tools and state</text>
    </g>
    <g class="edge-label edge-label--green" data-edge-label="Expected outcome">
      <rect x="1054.5" y="404" width="191" height="32" rx="16"/>
      <text x="1150" y="425">Expected outcome</text>
    </g></g>
</svg>
