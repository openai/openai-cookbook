<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" role="img" aria-labelledby="chart-title-seq-store-order-support" font-family="Arial, Helvetica, sans-serif" fill="#1b2c23" height="852" viewBox="0 0 840 852" id="seq-store-order-support" style="max-width:100%;height:auto;background:white" aria-describedby="chart-desc-seq-store-order-support">
  <title id="chart-title-seq-store-order-support">From order tracking to a replacement</title>
  <desc id="chart-desc-seq-store-order-support">GPT-Live hands off the tracking request, then the damage report. The app sends the updated conversation to Terra. Terra follows the damaged-item procedure, and the app creates a replacement after the caller accepts.</desc>
