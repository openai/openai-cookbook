<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="345" viewBox="0 0 1120 345" role="img" aria-labelledby="title description">
  <title id="title">From a small pilot to ongoing workspace operation</title>
  <desc id="description">Try the approach with a small group using Codex automation or an individual computer. Choose a monthly budget, release schedule, and people to include. Preview each person's proposed limit. For ongoing workspace operation, use organization-managed infrastructure such as a virtual machine or cloud service. An AWS deployment guide is included.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#202123}.title{font-size:26px;font-weight:600}.heading{font-size:19px;font-weight:600}.label{font-size:17px}.muted{fill:#626262}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#626262"/></marker>
  </defs>
  <rect width="1120" height="345" fill="#fff"/>
  <text x="32" y="48" class="title">From a small pilot to ongoing workspace operation</text>
  <g transform="translate(32 92)">
    <rect width="240" height="174" rx="4" fill="#fff" stroke="#d9d9d9"/>
    <text x="18" y="36" class="heading">1. Try a small pilot</text>
    <text x="18" y="77" class="label">Codex automation</text>
    <text x="18" y="105" class="label">or an individual computer</text>
    <text x="18" y="145" class="label muted">Supervised testing</text>
  </g>
  <path d="M278 179h19" stroke="#626262" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(304 92)">
    <rect width="240" height="174" rx="4" fill="#fff" stroke="#d9d9d9"/>
    <text x="18" y="36" class="heading">2. Choose the plan</text>
    <text x="18" y="77" class="label">Monthly budget</text>
    <text x="18" y="105" class="label">Release schedule</text>
    <text x="18" y="133" class="label">People to include</text>
  </g>
  <path d="M550 179h19" stroke="#626262" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(576 92)">
    <rect width="240" height="174" rx="4" fill="#fff" stroke="#d9d9d9"/>
    <text x="18" y="36" class="heading">3. Preview the limits</text>
    <text x="18" y="77" class="label">Review each person's cap</text>
    <text x="18" y="105" class="label">Confirm planned changes</text>
  </g>
  <path d="M822 179h19" stroke="#626262" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(848 92)">
    <rect width="240" height="174" rx="4" fill="#f5f5f5" stroke="#a6a6a6"/>
    <text x="18" y="36" class="heading">4. Run on managed</text>
    <text x="18" y="61" class="heading">infrastructure</text>
    <text x="18" y="99" class="label">Virtual machine or cloud</text>
    <text x="18" y="127" class="label">AWS deployment guide</text>
    <text x="18" y="155" font-size="15" font-weight="600">Ongoing use: recommended</text>
  </g>
  <text x="32" y="311" class="label">Review the plan with a small group before using it across the workspace.</text>
</svg>
