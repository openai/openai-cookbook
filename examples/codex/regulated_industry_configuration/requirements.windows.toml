# Complete native Windows regulated-enterprise requirements for Codex 0.138.0+.
# Deploy through enterprise-managed configuration or:
# %ProgramData%\OpenAI\Codex\requirements.toml
# Select an approved workspace and enforce prohibited network shares externally.

allowed_approval_policies = ["on-request", "untrusted"]
allowed_approvals_reviewers = ["user"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["disabled", "cached"]
default_permissions = "regulated_workspace"
allow_managed_hooks_only = true
allow_appshots = false
mcp_servers = {}

[allowed_permission_profiles]
":read-only" = true
regulated_workspace = true

# Extend the standard workspace profile for general engineering compatibility.
# Define explicit filesystem roots when shared-drive isolation is mandatory.
[permissions.regulated_workspace]
description = "Use the elevated Windows workspace sandbox with human oversight, protected secrets, and restricted command networking."
extends = ":workspace"

[permissions.regulated_workspace.filesystem]
glob_scan_max_depth = 6

[permissions.regulated_workspace.filesystem.":workspace_roots"]
".env" = "deny"
".env.local" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.env" = "deny"
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"

[permissions.regulated_workspace.network]
enabled = false

# Require the stronger Windows sandbox backend and prevent unelevated fallback.
[windows]
allowed_sandbox_implementations = ["elevated"]

[features]
browser_use = false
browser_use_external = false
computer_use = false
enable_mcp_apps = false
guardian_approval = false
in_app_browser = false
memories = false
memory_tool = false
remote_control = false
skill_mcp_dependency_install = false

[rules]
prefix_rules = [
  { pattern = [{ any_of = ["rm", "rmdir", "Remove-Item", "del", "erase"] }], decision = "prompt", justification = "A human must review destructive filesystem operations." },
  { pattern = [{ token = "net" }, { any_of = ["use", "view"] }], decision = "prompt", justification = "A human must review network-share enumeration or mapping." },
  { pattern = [{ token = "New-PSDrive" }], decision = "prompt", justification = "A human must review new filesystem or network-drive mappings." },
  { pattern = [{ any_of = ["curl", "wget", "Invoke-WebRequest", "iwr", "Invoke-RestMethod", "irm"] }], decision = "prompt", justification = "A human must review attempted network access or data transfer." },
  { pattern = [{ token = "git" }, { any_of = ["commit", "push"] }], decision = "prompt", justification = "A human must approve repository commits and publication." },
  { pattern = [{ token = "kubectl" }, { any_of = ["apply", "delete", "patch", "exec", "edit"] }], decision = "forbidden", justification = "Production changes require approved deployment pipelines." },
  { pattern = [{ token = "terraform" }, { any_of = ["apply", "destroy"] }], decision = "forbidden", justification = "Infrastructure changes require approved change management." },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "merge" }], decision = "forbidden", justification = "Pull-request merges remain human-controlled actions outside Codex." },
]
