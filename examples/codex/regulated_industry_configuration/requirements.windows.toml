# Complete native Windows enterprise requirements for Codex 0.138.0 or later.
# Deploy through enterprise-managed configuration or:
# %ProgramData%\OpenAI\Codex\requirements.toml
# The workspace itself must be a local approved directory, not a network share.

allowed_approval_policies = ["never"]
allowed_approvals_reviewers = ["user"]
allowed_web_search_modes = ["disabled"]
default_permissions = "regulated_workspace"
allow_managed_hooks_only = true
allow_appshots = false
mcp_servers = {}

[allowed_permission_profiles]
regulated_workspace = true

# Do not extend :workspace. Its inherited broad-read behavior conflicts with a
# strict local-workspace-only boundary.
[permissions.regulated_workspace]
description = "Edit the selected local Windows workspace while denying broader filesystem, network-share, and command-network access."

[permissions.regulated_workspace.filesystem]
":minimal" = "read"
glob_scan_max_depth = 6

[permissions.regulated_workspace.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".codex" = "read"
".agents" = "read"
".devcontainer" = "read"
".env" = "deny"
".env.local" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*.env" = "deny"
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"

[permissions.regulated_workspace.network]
enabled = false

# The elevated backend can enforce explicit readable roots. Never fall back to
# the weaker unelevated backend for this Windows baseline.
[windows]
allowed_sandbox_implementations = ["elevated"]

[features]
browser_use = false
browser_use_external = false
computer_use = false
enable_mcp_apps = false
guardian_approval = false
in_app_browser = false
memories = false
memory_tool = false
remote_control = false
skill_mcp_dependency_install = false

[rules]
prefix_rules = [
  { pattern = [{ any_of = ["rm", "rmdir", "Remove-Item", "del", "erase"] }], decision = "forbidden", justification = "Destructive filesystem operations require approved controls outside Codex." },
  { pattern = [{ token = "net" }, { any_of = ["use", "view"] }], decision = "forbidden", justification = "Network-share mapping and enumeration are not permitted." },
  { pattern = [{ token = "New-PSDrive" }], decision = "forbidden", justification = "Network-drive mapping is not permitted." },
  { pattern = [{ any_of = ["curl", "wget", "Invoke-WebRequest", "iwr", "Invoke-RestMethod", "irm"] }], decision = "forbidden", justification = "External data transfers require an approved enterprise workflow." },
  { pattern = [{ token = "git" }, { any_of = ["commit", "push"] }], decision = "forbidden", justification = "Repository publication remains a human-controlled action outside Codex." },
  { pattern = [{ token = "kubectl" }, { any_of = ["apply", "delete", "patch", "exec", "edit"] }], decision = "forbidden", justification = "Production changes require approved deployment pipelines." },
  { pattern = [{ token = "terraform" }, { any_of = ["apply", "destroy"] }], decision = "forbidden", justification = "Infrastructure changes require approved change management." },
  { pattern = [{ token = "gh" }, { token = "pr" }, { token = "merge" }], decision = "forbidden", justification = "Pull-request merges remain human-controlled actions outside Codex." },
]
