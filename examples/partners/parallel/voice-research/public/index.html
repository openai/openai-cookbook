<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT-Live with web search</title><link rel="stylesheet" href="/style.css"></head><body>
<header><span class="brand">Parallel</span><nav aria-label="Resources"><a href="https://cookbook.openai.com/articles/voice-research-with-parallel" target="_blank" rel="noopener noreferrer">Cookbook ↗</a><a href="https://github.com/openai/openai-cookbook/tree/main/examples/partners/parallel/voice-research" target="_blank" rel="noopener noreferrer">GitHub ↗</a></nav></header>
<main><h1>GPT-Live with web search</h1><p class="intro">Keep talking. Parallel researches as you go.</p>
<div class="session"><div class="voice"><div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div><div id="status" class="mono" role="status">Ready to talk</div><div id="session-hint" class="hint">Ask a question to get started.</div></div></div><button id="start">Start conversation</button><button id="stop" disabled hidden><span class="stop" aria-hidden="true"></span>End conversation</button></div>
<audio id="assistant" autoplay hidden></audio><p id="error" role="alert"></p>
<section aria-labelledby="research-heading"><div class="section-title"><h2 id="research-heading">Research results</h2><span id="request-count" class="mono count">0 requests</span></div><div id="research" aria-live="polite"><p id="empty-research">Your answers and sources will appear here.</p></div></section>
<div class="bottom"><details><summary class="disclosure">Conversation transcript</summary><div id="captions"></div></details></div>
<footer><span>GPT-Live + Parallel Search</span><a href="https://platform.parallel.ai/" target="_blank" rel="noopener noreferrer">Get a Parallel API key ↗</a></footer></main><script type="module" src="/app.js"></script></body></html>
