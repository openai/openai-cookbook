<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Governed security review architecture</title>
  <desc id="diagram-description">Five solid-arrow stages show the optional Docker path of the synthetic reference. Trusted inventory and policy require a named scope approver for the repository, commit and current owner. The trusted host rechecks scope and high-risk context, then applies rate, worker and admission budgets. It launches separate network-denied, non-root Docker fixture workers with read-only source and no secrets. The host validates findings, coverage, manifest, hashes and HMAC state before named human disposition and a private review packet. A dashed alternative through a future Codex Security CLI or SDK adapter is not executed and needs separately approved identity, model egress and spend. The daemon-free Compose service has only its outer container boundary; it does not launch a separate inner worker. Idempotency binds repository ID, commit SHA, effective context hash, scanner version and policy version. Scope separately binds the current owner.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#48534F"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FAFBF9"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="77" font-size="44" font-weight="600" fill="#19211F">Governed security reviews</text><text x="48" y="119" font-size="24" font-weight="400" fill="#48534F">Trust boundaries for the optional restricted-Docker demonstration</text><path d="M 50 169 L 101 169" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="116" y="177" font-size="21" font-weight="400" fill="#19211F">Implemented with synthetic fixtures</text><path d="M 686 169 L 737 169" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="752" y="177" font-size="21" font-weight="400" fill="#19211F">Future live integration — not executed</text><rect x="32" y="217" width="608" height="346" rx="16" fill="#F2F5F1" stroke="#BAC5BE" stroke-width="1.8"/><rect x="648" y="217" width="296" height="346" rx="16" fill="#EDF4EF" stroke="#296348" stroke-width="1.8"/><rect x="952" y="217" width="608" height="346" rx="16" fill="#F2F5F1" stroke="#BAC5BE" stroke-width="1.8"/><text x="54" y="249" font-size="17" font-weight="600" fill="#48534F">TRUSTED HOST</text><text x="667" y="249" font-size="17" font-weight="600" fill="#296348">SEPARATE WORKERS</text><text x="974" y="249" font-size="17" font-weight="600" fill="#48534F">TRUSTED HOST</text><rect x="48" y="279" width="272" height="252" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="69" y="315" font-size="17" font-weight="600" fill="#296348">01</text><text x="69" y="354" font-size="24" font-weight="600" fill="#19211F">Authorise scope</text><text x="69" y="397" font-size="20" font-weight="400" fill="#48534F">Inventory + policy</text><text x="69" y="428" font-size="20" font-weight="400" fill="#48534F">Repo ID · full SHA</text><text x="69" y="459" font-size="20" font-weight="400" fill="#48534F">Current owner</text><text x="69" y="490" font-size="20" font-weight="400" fill="#48534F">Named scope approver</text><rect x="352" y="279" width="272" height="252" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="373" y="315" font-size="17" font-weight="600" fill="#296348">02</text><text x="373" y="354" font-size="24" font-weight="600" fill="#19211F">Admit work</text><text x="373" y="397" font-size="20" font-weight="400" fill="#48534F">Scope rechecked</text><text x="373" y="428" font-size="20" font-weight="400" fill="#48534F">High-risk context gate</text><text x="373" y="459" font-size="20" font-weight="400" fill="#48534F">Rate · budget · workers</text><text x="373" y="490" font-size="20" font-weight="400" fill="#48534F">Reuse eligible evidence</text><rect x="664" y="279" width="264" height="252" rx="12" fill="#FFFFFF" stroke="#296348" stroke-width="1.8"/><text x="685" y="315" font-size="17" font-weight="600" fill="#296348">03</text><text x="685" y="354" font-size="24" font-weight="600" fill="#19211F">Fixture workers</text><text x="685" y="397" font-size="20" font-weight="400" fill="#48534F">Host-launched Docker</text><text x="685" y="428" font-size="20" font-weight="400" fill="#48534F">No network · non-root</text><text x="685" y="459" font-size="20" font-weight="400" fill="#48534F">Read-only source</text><text x="685" y="490" font-size="20" font-weight="400" fill="#48534F">No secrets · zero caps</text><rect x="968" y="279" width="272" height="252" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="989" y="315" font-size="17" font-weight="600" fill="#296348">04</text><text x="989" y="354" font-size="24" font-weight="600" fill="#19211F">Verify evidence</text><text x="989" y="397" font-size="20" font-weight="400" fill="#48534F">Findings + coverage</text><text x="989" y="428" font-size="20" font-weight="400" fill="#48534F">Manifest + hashes</text><text x="989" y="459" font-size="20" font-weight="400" fill="#48534F">HMAC state + audit</text><text x="989" y="490" font-size="20" font-weight="400" fill="#48534F">Invalid evidence → stop</text><rect x="1272" y="279" width="272" height="252" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="1293" y="315" font-size="17" font-weight="600" fill="#296348">05</text><text x="1293" y="354" font-size="24" font-weight="600" fill="#19211F">Named review</text><text x="1293" y="397" font-size="20" font-weight="400" fill="#48534F">Disposition findings</text><text x="1293" y="428" font-size="20" font-weight="400" fill="#48534F">Private review packet</text><text x="1293" y="459" font-size="20" font-weight="400" fill="#48534F">Patch needs approval</text><text x="1293" y="490" font-size="20" font-weight="400" fill="#48534F">No merge or deploy</text><path d="M 320 405 L 352 405" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 624 405 L 664 405" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 928 405 L 968 405" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1240 405 L 1272 405" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 488 531 L 488 590 L 620 590 L 620 620" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/><path d="M 1120 682 L 1188 682 L 1188 581 L 1104 581 L 1104 531" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="480" y="620" width="640" height="128" rx="12" fill="#FAFBF9" stroke="#65786D" stroke-width="1.8" stroke-dasharray="10 7"/><text x="510" y="655" font-size="26" font-weight="600" fill="#19211F">Future Codex Security adapter</text><text x="510" y="692" font-size="21" font-weight="400" fill="#48534F">CLI / SDK · not executed by this example</text><text x="510" y="721" font-size="21" font-weight="400" fill="#48534F">Separate approved identity, model egress and spend</text><text x="48" y="790" font-size="21" font-weight="400" fill="#48534F">Daemon-free Compose confines one service; it does not create a separate inner worker.</text><text x="48" y="836" font-size="21" font-weight="600" fill="#19211F">Idempotency: repo ID + commit SHA + effective context hash + scanner version + policy version.</text><text x="48" y="870" font-size="21" font-weight="400" fill="#48534F">Scope also binds the current owner. Missing approval or invalid evidence stops dispatch.</text>
  </g>
</svg>
