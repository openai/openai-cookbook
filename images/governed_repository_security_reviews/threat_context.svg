<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Versioned threat context and human acceptance</title>
  <desc id="diagram-description">Organisation baseline, workload archetype and individual repository delta feed an effective context hash. A bespoke repository model contributes for the high-risk tier. The digest binds catalogue version, strategy, organisation controls, archetype, repository model, delta and covered scenario metadata. High-risk repositories require a named human to accept that exact hash; missing or stale acceptance holds work. Other repositories reach admission directly, while scope approval remains independently required for all repositories. Admission rechecks approvals before queuing work or reusing current evidence. A baseline change can alter every repository hash, so editing one shared artefact may invalidate all repositories. This is deterministic context metadata, not generated or empirically validated threat-model prose.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#48534F"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FAFBF9"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="77" font-size="44" font-weight="600" fill="#19211F">Versioned threat context</text><text x="64" y="119" font-size="24" font-weight="400" fill="#48534F">Reuse shared controls without losing repository-specific boundaries</text><text x="64" y="178" font-size="18" font-weight="600" fill="#296348">TRUSTED CONTEXT INPUTS</text><rect x="64" y="217" width="464" height="164" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="90" y="260" font-size="27" font-weight="600" fill="#19211F">Organisation baseline</text><text x="90" y="305" font-size="23" font-weight="400" fill="#48534F">Version + shared controls</text><text x="90" y="339" font-size="23" font-weight="400" fill="#48534F">Identity · network · data · audit</text><rect x="568" y="217" width="464" height="164" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="594" y="260" font-size="27" font-weight="600" fill="#19211F">Workload archetype</text><text x="594" y="305" font-size="23" font-weight="400" fill="#48534F">Reviewed reusable pattern</text><text x="594" y="339" font-size="23" font-weight="400" fill="#48534F">Topology · exposure · framework</text><rect x="1072" y="217" width="464" height="164" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="1098" y="260" font-size="27" font-weight="600" fill="#19211F">Repository delta</text><text x="1098" y="305" font-size="23" font-weight="400" fill="#48534F">Data · authentication · dependencies</text><text x="1098" y="339" font-size="23" font-weight="400" fill="#48534F">Criticality · controls · divergence</text><path d="M 296 381 V 409 H 1304 V 381 M 800 381 V 409" fill="none" stroke="#48534F" stroke-width="2.4"/><path d="M 800 409 L 800 448" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="448" width="464" height="158" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="90" y="490" font-size="27" font-weight="600" fill="#19211F">Bespoke high-risk context</text><text x="90" y="533" font-size="23" font-weight="400" fill="#48534F">Trusted repository-specific model</text><text x="90" y="567" font-size="23" font-weight="400" fill="#48534F">Required for the high-risk tier</text><path d="M 528 528 L 568 528" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="568" y="448" width="464" height="158" rx="12" fill="#EDF4EF" stroke="#296348" stroke-width="1.8"/><text x="594" y="490" font-size="27" font-weight="600" fill="#19211F">Effective context hash</text><text x="594" y="533" font-size="23" font-weight="400" fill="#48534F">Versioned composition of the inputs</text><text x="594" y="567" font-size="23" font-weight="400" fill="#48534F">An input change changes the digest</text><path d="M 1032 528 L 1072 528" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1072" y="448" width="464" height="158" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="1098" y="480" font-size="17" font-weight="600" fill="#296348">HIGH RISK: NAMED REVIEW</text><text x="1098" y="519" font-size="27" font-weight="600" fill="#19211F">Accept the exact hash</text><text x="1098" y="562" font-size="23" font-weight="400" fill="#48534F">Missing or stale approval → hold</text><path d="M 800 606 L 800 688" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="816" y="650" font-size="20" font-weight="400" fill="#48534F">Other repositories</text><path d="M 1304 606 L 1304 740 L 1032 740" fill="none" stroke="#48534F" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1094" y="723" font-size="20" font-weight="400" fill="#48534F">Accepted hash</text><rect x="568" y="688" width="464" height="110" rx="12" fill="#FFFFFF" stroke="#BAC5BE" stroke-width="1.8"/><text x="594" y="731" font-size="26" font-weight="600" fill="#19211F">Admission rechecks approval</text><text x="594" y="771" font-size="22" font-weight="400" fill="#48534F">Queue work or reuse current evidence</text><rect x="64" y="827" width="1472" height="62" rx="8" fill="#EDF4EF" stroke="#EDF4EF" stroke-width="1.8"/><text x="84" y="852" font-size="22" font-weight="600" fill="#19211F">A baseline change can invalidate every repository.</text><text x="84" y="879" font-size="20" font-weight="400" fill="#48534F">One edited model artefact can require many new reviews; context reuse does not remove revalidation.</text>
  </g>
</svg>
